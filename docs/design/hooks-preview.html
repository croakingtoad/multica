<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Multica — Lifecycle Hooks (design preview)</title>
<!--
  Multica · Runtime Lifecycle Hooks — static design preview (LOCO-82)
  ------------------------------------------------------------------
  A clickable sketch, NOT production code. No build step, no network, no CDN.
  Sample data only; nothing here talks to a runtime.

  Design provenance:
  - Tokens copied from packages/ui/styles/tokens.css (.dark block, OKLCH/zinc).
  - Type scale limited to the ten sanctioned steps (micro…display).
  - Shell mirrors runtime-detail.tsx: BreadcrumbHeader -> single scroll
    container -> grid-cols-[minmax(0,1fr)_320px].
  - Card = rounded-lg border bg-card. Editor = Dialog. Delete = AlertDialog.
  - Runtime picker grouped by machine = runtime-local-skill-import-panel.tsx.
  - Icons are hand-inlined lucide geometry (ISC) so the file stays offline.

  Feature is labelled "Lifecycle Hooks" throughout to avoid colliding with
  Multica's existing, unrelated "plugin hooks" (PluginHookTool).
-->
<style>
/* ------------------------------------------------------------------ *
 * 1. Tokens — lifted from packages/ui/styles/tokens.css
 * ------------------------------------------------------------------ */
:root {
  color-scheme: light;
  --app-shell: oklch(0.964435 0.001327 286.375);
  --page-canvas: oklch(0.988087 0 0);
  --surface: oklch(1 0 0);
  --surface-raised: oklch(1 0 0);
  --surface-hover: oklch(0.967 0.001 286.375);
  --surface-selected: oklch(0.94 0.002 286.375);
  --background: var(--page-canvas);
  --foreground: oklch(0.141 0.005 285.823);
  --card: var(--surface);
  --popover: var(--surface-raised);
  --primary: oklch(0.21 0.006 285.885);
  --primary-foreground: oklch(0.985 0 0);
  --secondary: oklch(0.967 0.001 286.375);
  --secondary-foreground: oklch(0.21 0.006 285.885);
  --muted: oklch(0.967 0.001 286.375);
  --muted-foreground: oklch(0.552 0.016 285.938);
  --faint-foreground: oklch(0.705 0.015 286.067);
  --accent: oklch(0.967 0.001 286.375);
  --accent-foreground: oklch(0.21 0.006 285.885);
  --destructive: oklch(0.577 0.245 27.325);
  --border: oklch(0 0 0 / 8%);
  --input: oklch(0 0 0 / 14%);
  --ring: oklch(0.705 0.015 286.067);
  --brand: oklch(0.55 0.18 255);
  --brand-foreground: oklch(0.985 0 0);
  --success: oklch(0.55 0.15 145);
  --warning: oklch(0.62 0.16 70);
  --info: oklch(0.55 0.18 250);
  --menu-shadow: 0 10px 28px rgb(0 0 0 / 0.10), 0 2px 8px rgb(0 0 0 / 0.06);
  --floating-shadow: 0 20px 48px rgb(0 0 0 / 0.18), 0 4px 12px rgb(0 0 0 / 0.10);
  --radius: 0.625rem;
}
html.dark {
  color-scheme: dark;
  --app-shell: oklch(0.155 0.005 285.823);
  --page-canvas: oklch(0.18 0.005 285.823);
  --surface: oklch(0.21 0.006 285.885);
  --surface-raised: oklch(0.235 0.007 285.885);
  --surface-hover: oklch(0.274 0.006 286.033);
  --surface-selected: oklch(0.3 0.006 286.033);
  --background: var(--page-canvas);
  --foreground: oklch(0.985 0 0);
  --card: var(--surface);
  --popover: var(--surface-raised);
  --primary: oklch(0.92 0.004 286.32);
  --primary-foreground: oklch(0.21 0.006 285.885);
  --secondary: oklch(0.274 0.006 286.033);
  --secondary-foreground: oklch(0.985 0 0);
  --muted: oklch(0.274 0.006 286.033);
  --muted-foreground: oklch(0.705 0.015 286.067);
  --faint-foreground: oklch(0.60 0.015 286.067);
  --accent: oklch(0.274 0.006 286.033);
  --accent-foreground: oklch(0.985 0 0);
  --destructive: oklch(0.704 0.191 22.216);
  --border: oklch(1 0 0 / 6%);
  --input: oklch(1 0 0 / 15%);
  --ring: oklch(0.552 0.016 285.938);
  --brand: oklch(0.65 0.16 255);
  --brand-foreground: oklch(0.985 0 0);
  --success: oklch(0.65 0.15 145);
  --warning: oklch(0.70 0.16 85);
  --info: oklch(0.65 0.18 250);
  --menu-shadow: 0 10px 28px rgb(0 0 0 / 0.3), 0 2px 8px rgb(0 0 0 / 0.18);
  --floating-shadow: 0 20px 48px rgb(0 0 0 / 0.46), 0 4px 12px rgb(0 0 0 / 0.28);
}

/* ------------------------------------------------------------------ *
 * 2. Base + the ten sanctioned type steps
 * ------------------------------------------------------------------ */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--background);
  color: var(--foreground);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 14px; line-height: 20px;
  -webkit-font-smoothing: antialiased;
}
.mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
.t-micro    { font-size: 11px; line-height: 15px; }
.t-caption  { font-size: 12px; line-height: 16px; }
.t-label    { font-size: 13px; line-height: 18px; }
.t-body     { font-size: 14px; line-height: 20px; }
.t-body-lg  { font-size: 15px; line-height: 22px; }
.t-title-sm { font-size: 16px; line-height: 24px; }
.t-title    { font-size: 18px; line-height: 28px; }
.t-title-lg { font-size: 20px; line-height: 28px; }
.t-display-sm { font-size: 24px; line-height: 32px; }
.muted { color: var(--muted-foreground); }
.faint { color: var(--faint-foreground); }
.medium { font-weight: 500; }
.semibold { font-weight: 600; }
.strike { text-decoration: line-through; }
svg { flex: none; }

/* ------------------------------------------------------------------ *
 * 3. Layout shell
 * ------------------------------------------------------------------ */
#app { display: flex; flex-direction: column; height: 100%; }

.preview-strip {
  display: flex; align-items: center; gap: 12px;
  padding: 6px 16px;
  background: color-mix(in oklab, var(--warning) 18%, var(--app-shell));
  border-bottom: 1px solid color-mix(in oklab, var(--warning) 40%, transparent);
  color: var(--foreground);
}
.preview-strip .dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--warning);
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--warning) 25%, transparent);
}
.preview-strip .spacer { flex: 1; }

.page-header {
  display: flex; align-items: center; gap: 6px;
  height: 44px; padding: 0 16px;
  background: var(--background);
  border-bottom: 1px solid var(--border);
  flex: none;
}
.crumb { color: var(--muted-foreground); text-decoration: none; }
.crumb:hover { color: var(--foreground); }

.tabbar {
  display: flex; gap: 2px; padding: 0 16px;
  border-bottom: 1px solid var(--border); background: var(--background); flex: none;
  overflow-x: auto;
}
.tab {
  appearance: none; background: none; border: 0; border-bottom: 2px solid transparent;
  color: var(--muted-foreground); padding: 9px 10px; font: inherit; font-size: 13px;
  cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;
}
.tab:hover { color: var(--foreground); }
.tab[aria-selected="true"] { color: var(--foreground); border-bottom-color: var(--primary); font-weight: 500; }
.tab:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; border-radius: 4px; }

.scroll { flex: 1; min-height: 0; overflow-y: auto; }
.rail { margin: 0 auto; width: 100%; max-width: 1440px; }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; padding: 24px 16px; }
@media (max-width: 1100px) { .two-col { grid-template-columns: 1fr; } }
.col-main { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.col-rail { display: flex; flex-direction: column; gap: 16px; }

/* ------------------------------------------------------------------ *
 * 4. Primitives — Card / Badge / Button / Input / Select / Switch
 * ------------------------------------------------------------------ */
.card { border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); }
.card-head {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px; border-bottom: 1px solid var(--border);
}
.card-head .spacer { flex: 1; }
.card-body { padding: 16px; }
.card-body.tight { padding: 12px 16px; }

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  border-radius: 6px; border: 1px solid var(--border);
  padding: 1px 6px; font-size: 11px; line-height: 15px; font-weight: 500;
  background: color-mix(in oklab, var(--muted) 60%, transparent);
  color: var(--muted-foreground); white-space: nowrap;
}
.badge.solid { border-color: transparent; }
.badge.b-claude { background: color-mix(in oklab, var(--warning) 20%, transparent); color: var(--warning); border-color: color-mix(in oklab, var(--warning) 35%, transparent); }
.badge.b-codex  { background: color-mix(in oklab, var(--info) 20%, transparent);    color: var(--info);    border-color: color-mix(in oklab, var(--info) 35%, transparent); }
.badge.b-ok     { background: color-mix(in oklab, var(--success) 18%, transparent); color: var(--success); border-color: color-mix(in oklab, var(--success) 32%, transparent); }
.badge.b-warn   { background: color-mix(in oklab, var(--warning) 18%, transparent); color: var(--warning); border-color: color-mix(in oklab, var(--warning) 32%, transparent); }
.badge.b-bad    { background: color-mix(in oklab, var(--destructive) 16%, transparent); color: var(--destructive); border-color: color-mix(in oklab, var(--destructive) 32%, transparent); }
.badge.b-brand  { background: color-mix(in oklab, var(--brand) 20%, transparent); color: var(--brand); border-color: color-mix(in oklab, var(--brand) 35%, transparent); }
.badge.b-dim    { opacity: .72; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 12px; border-radius: calc(var(--radius) * 0.8);
  border: 1px solid var(--border); background: transparent; color: var(--foreground);
  font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
  white-space: nowrap; text-decoration: none;
}
.btn:hover { background: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.btn[disabled]:hover { background: transparent; }
.btn.primary { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
.btn.primary:hover { background: color-mix(in oklab, var(--primary) 88%, var(--foreground)); }
.btn.danger { background: var(--destructive); color: oklch(0.985 0 0); border-color: transparent; }
.btn.ghost { border-color: transparent; }
.btn.sm { height: 26px; padding: 0 8px; font-size: 12px; }
.btn.xs { height: 22px; padding: 0 6px; font-size: 11px; border-radius: 6px; }
.btn.icon { width: 28px; height: 28px; padding: 0; }

.field { display: flex; flex-direction: column; gap: 5px; }
.field > label { font-size: 13px; line-height: 18px; font-weight: 500; }
.field .hint { font-size: 12px; line-height: 16px; color: var(--muted-foreground); }
.field .err  { font-size: 12px; line-height: 16px; color: var(--destructive); display: flex; gap: 5px; align-items: flex-start; }
.field .warn { font-size: 12px; line-height: 16px; color: var(--warning); display: flex; gap: 5px; align-items: flex-start; }
.input, .select, .textarea {
  width: 100%; height: 32px; padding: 0 10px;
  border-radius: calc(var(--radius) * 0.8); border: 1px solid var(--input);
  background: color-mix(in oklab, var(--surface) 70%, transparent);
  color: var(--foreground); font: inherit; font-size: 13px;
}
.textarea { height: auto; padding: 7px 10px; min-height: 60px; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { outline: 2px solid var(--ring); outline-offset: -1px; border-color: var(--ring); }
.input[aria-invalid="true"] { border-color: var(--destructive); }
.input[disabled], .select[disabled], .textarea[disabled] { opacity: .55; cursor: not-allowed; }
.select { appearance: none; padding-right: 28px; background-image: none; }
.select-wrap { position: relative; }
.select-wrap > svg { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--faint-foreground); }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

.switch {
  appearance: none; width: 32px; height: 18px; border-radius: 999px;
  background: var(--input); border: 1px solid var(--border); position: relative;
  cursor: pointer; flex: none; transition: background .12s;
}
.switch::after {
  content: ""; position: absolute; top: 1px; left: 1px; width: 14px; height: 14px;
  border-radius: 50%; background: var(--foreground); transition: transform .12s;
}
.switch:checked { background: var(--brand); }
.switch:checked::after { transform: translateX(14px); background: oklch(0.99 0 0); }
.switch:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.switch[disabled] { opacity: .45; cursor: not-allowed; }

.kbd {
  display: inline-flex; align-items: center; height: 17px; padding: 0 4px;
  border-radius: 4px; border: 1px solid var(--border); background: var(--muted);
  font-size: 10px; font-family: inherit; color: var(--muted-foreground);
}

/* ------------------------------------------------------------------ *
 * 5. Tables / rows
 * ------------------------------------------------------------------ */
table.tbl { width: 100%; border-collapse: collapse; }
table.tbl th {
  text-align: left; font-size: 11px; line-height: 15px; font-weight: 500;
  color: var(--faint-foreground); text-transform: uppercase; letter-spacing: .04em;
  padding: 7px 12px; border-bottom: 1px solid var(--border); white-space: nowrap;
}
table.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.tbl tr:last-child td { border-bottom: 0; }
table.tbl tbody tr:hover { background: color-mix(in oklab, var(--accent) 45%, transparent); }
table.tbl tr.shadowed td { background: color-mix(in oklab, var(--destructive) 5%, transparent); }
table.tbl tr.shadowed .cmd, table.tbl tr.shadowed .matcher { opacity: .5; text-decoration: line-through; }
.cmd { font-family: "Geist Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; overflow-wrap: anywhere; }
.nowrap { white-space: nowrap; }
.cellflex { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.event-group { border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); overflow: hidden; }
.event-group + .event-group { margin-top: 10px; }
.event-head {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 9px 12px; background: color-mix(in oklab, var(--muted) 35%, transparent);
  border: 0; border-bottom: 1px solid var(--border); color: inherit; font: inherit;
  cursor: pointer; text-align: left;
}
.event-head:hover { background: color-mix(in oklab, var(--muted) 60%, transparent); }
.event-head:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; }
.event-head .spacer { flex: 1; }
.event-head .chev { transition: transform .12s; color: var(--faint-foreground); }
.event-head[aria-expanded="false"] .chev { transform: rotate(-90deg); }

/* ------------------------------------------------------------------ *
 * 6. Notices / strips
 * ------------------------------------------------------------------ */
.behavior-strip {
  display: flex; align-items: flex-start; gap: 10px;
  border-radius: var(--radius); padding: 10px 14px;
  border: 1px solid var(--border); background: color-mix(in oklab, var(--muted) 40%, transparent);
}
.behavior-strip.claude { border-color: color-mix(in oklab, var(--warning) 30%, transparent); background: color-mix(in oklab, var(--warning) 9%, transparent); }
.behavior-strip.codex  { border-color: color-mix(in oklab, var(--info) 30%, transparent);    background: color-mix(in oklab, var(--info) 9%, transparent); }
.behavior-strip .ico { margin-top: 1px; }
.behavior-strip .spacer { flex: 1; }

.notice { display: flex; gap: 9px; border-radius: calc(var(--radius) * 0.8); padding: 9px 12px; border: 1px solid var(--border); }
.notice .ico { margin-top: 1px; }
.notice.warn { border-color: color-mix(in oklab, var(--warning) 35%, transparent); background: color-mix(in oklab, var(--warning) 10%, transparent); }
.notice.bad  { border-color: color-mix(in oklab, var(--destructive) 35%, transparent); background: color-mix(in oklab, var(--destructive) 9%, transparent); }
.notice.info { border-color: color-mix(in oklab, var(--info) 30%, transparent); background: color-mix(in oklab, var(--info) 9%, transparent); }
.notice.ok   { border-color: color-mix(in oklab, var(--success) 30%, transparent); background: color-mix(in oklab, var(--success) 9%, transparent); }

/* Empty (shadcn Empty) */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 56px 24px; }
.empty .media {
  width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
  background: var(--muted); color: var(--muted-foreground);
}
.empty .actions { display: flex; gap: 8px; margin-top: 4px; }

/* Skeleton */
@keyframes sk { 0%,100% { opacity: .45 } 50% { opacity: .85 } }
.sk { background: var(--muted); border-radius: 6px; animation: sk 1.5s ease-in-out infinite; }

/* ------------------------------------------------------------------ *
 * 7. Dialog / AlertDialog
 * ------------------------------------------------------------------ */
.overlay {
  position: fixed; inset: 0; background: rgb(0 0 0 / .6); z-index: 60;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 48px 16px; overflow-y: auto;
}
.overlay[hidden] { display: none; }
.dialog {
  width: 100%; max-width: 620px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--popover);
  box-shadow: var(--floating-shadow); display: flex; flex-direction: column;
}
.dialog.wide { max-width: 780px; }
.dialog.narrow { max-width: 440px; }
.dialog-head { padding: 16px 20px 12px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-start; }
.dialog-head .spacer { flex: 1; }
.dialog-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }
.dialog-foot { padding: 12px 20px 16px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.dialog-foot .spacer { flex: 1; }

/* searchable event combobox */
.combo { position: relative; }
.combo-list {
  position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px);
  max-height: 236px; overflow-y: auto; border-radius: calc(var(--radius) * 0.8);
  border: 1px solid var(--border); background: var(--popover); box-shadow: var(--menu-shadow);
  padding: 4px;
}
.combo-list[hidden] { display: none; }
.combo-group { font-size: 11px; color: var(--faint-foreground); padding: 6px 8px 2px; text-transform: uppercase; letter-spacing: .04em; }
.combo-opt {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 5px 8px; border: 0; background: none; color: inherit; font: inherit; font-size: 13px;
  border-radius: 6px; cursor: pointer; text-align: left;
}
.combo-opt:hover, .combo-opt.active { background: var(--accent); }
.combo-opt .spacer { flex: 1; }
.combo-empty { padding: 10px 8px; font-size: 12px; color: var(--muted-foreground); }

/* diff */
.diff { border-radius: calc(var(--radius) * 0.8); border: 1px solid var(--border); overflow: hidden; background: var(--app-shell); }
.diff-head { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--border); background: color-mix(in oklab, var(--muted) 40%, transparent); }
.diff pre { margin: 0; padding: 10px 0; overflow-x: auto; font-family: "Geist Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; line-height: 18px; }
.diff .ln { display: block; padding: 0 12px; white-space: pre; }
.diff .ln.add { background: color-mix(in oklab, var(--success) 14%, transparent); color: color-mix(in oklab, var(--success) 75%, var(--foreground)); }
.diff .ln.del { background: color-mix(in oklab, var(--destructive) 12%, transparent); color: color-mix(in oklab, var(--destructive) 75%, var(--foreground)); }
.diff .ln.ctx { color: var(--muted-foreground); }

/* toast (sonner) */
#toasts { position: fixed; right: 16px; bottom: 16px; z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.toast {
  display: flex; gap: 8px; align-items: flex-start; min-width: 260px; max-width: 380px;
  border-radius: calc(var(--radius) * 0.8); border: 1px solid var(--border);
  background: var(--popover); box-shadow: var(--menu-shadow); padding: 10px 12px;
}
.toast .ico { margin-top: 1px; }

/* gallery */
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(276px, 1fr)); gap: 12px; }
.g-card { border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); padding: 14px; display: flex; flex-direction: column; gap: 9px; }
.g-card:hover { border-color: color-mix(in oklab, var(--brand) 40%, var(--border)); }
.g-card .g-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.g-card .g-foot { display: flex; gap: 6px; margin-top: auto; padding-top: 4px; }
.compat { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

/* precedence layer stack */
.layers { display: flex; flex-direction: column; gap: 8px; }
.layer { border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
.layer-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: color-mix(in oklab, var(--muted) 35%, transparent); }
.layer-head .spacer { flex: 1; }
.layer.writable .layer-head { background: color-mix(in oklab, var(--brand) 12%, transparent); }
.layer-body { padding: 0; }
.layer-entry { display: flex; align-items: flex-start; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--border); }
.layer-entry.is-shadowed { background: color-mix(in oklab, var(--destructive) 5%, transparent); }
.layer-entry.is-shadowed .cmd, .layer-entry.is-shadowed .matcher { opacity: .5; text-decoration: line-through; }
.layer-entry .spacer { flex: 1; }
.runorder {
  width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; flex: none;
  background: color-mix(in oklab, var(--success) 20%, transparent); color: var(--success);
  font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.runorder.off { background: var(--muted); color: var(--faint-foreground); }

/* fire log */
.log-row { display: grid; grid-template-columns: 92px 1fr 74px 130px; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--border); align-items: start; }
.log-row:last-child { border-bottom: 0; }
.log-row:hover { background: color-mix(in oklab, var(--accent) 40%, transparent); }
.log-row.fail { background: color-mix(in oklab, var(--destructive) 7%, transparent); }
.log-row.fail:hover { background: color-mix(in oklab, var(--destructive) 11%, transparent); }
.log-head { display: grid; grid-template-columns: 92px 1fr 74px 130px; gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--border); }
.log-head > span { font-size: 11px; color: var(--faint-foreground); text-transform: uppercase; letter-spacing: .04em; }
.stderr {
  margin-top: 5px; padding: 6px 8px; border-radius: 6px;
  background: color-mix(in oklab, var(--destructive) 10%, transparent);
  border: 1px solid color-mix(in oklab, var(--destructive) 25%, transparent);
  font-family: "Geist Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11px; line-height: 16px;
  white-space: pre-wrap; word-break: break-all;
}
.seg { display: inline-flex; border-radius: calc(var(--radius) * 0.8); border: 1px solid var(--border); overflow: hidden; }
.seg button { appearance: none; border: 0; background: transparent; color: var(--muted-foreground); font: inherit; font-size: 12px; padding: 4px 10px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--foreground); font-weight: 500; }
.seg button:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
.kv dt { color: var(--muted-foreground); font-size: 12px; }
.kv dd { margin: 0; font-size: 12px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.inline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sr {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
hr.sep { border: 0; border-top: 1px solid var(--border); margin: 2px 0; }
</style>

<script>
/* ==================================================================== *
 * STATE + RESOLUTION
 * ==================================================================== */
const state = {
  runtimeId: 'b9322c50-ad96-489e-8aab-9e49f11c913a',
  screen: 'hooks',
  collapsed: {},          // event -> true
  query: '',
  logFilter: 'all',
  stateDemo: 'discovery', // discovery | empty | offline
  discoveryStep: 3,
};

const rt = () => RUNTIMES.find((r) => r.id === state.runtimeId);
const machineOf = (r) => MACHINES.find((m) => m.id === r.machine);
const layersOf = (prov) => LAYERS[prov];
const layerMeta = (prov, id) => layersOf(prov).find((l) => l.id === id) || { label: id, file: id, writable: false };
const hooksOf = (id) => HOOKS[id] || [];
const providerLabel = (p) => (p === 'claude' ? 'Claude Code' : 'Codex');

/* Claude overrides per event: the highest-priority layer that defines the
   event wins outright and every entry below it is shadowed. Codex merges:
   every entry runs. This function is the only place that difference lives,
   which is why the two screens can render genuinely different pictures
   instead of one screen with a flag. */
function resolve(runtime) {
  const hooks = hooksOf(runtime.id);
  const order = layersOf(runtime.provider).map((l) => l.id);
  const byEvent = {};
  hooks.forEach((h) => { (byEvent[h.event] = byEvent[h.event] || []).push(h); });

  Object.keys(byEvent).forEach((ev) => {
    const group = byEvent[ev];
    if (runtime.provider === 'claude') {
      const live = group.filter((h) => !h.parked);
      const winningScope = live
        .map((h) => h.scope)
        .sort((a, b) => order.indexOf(a) - order.indexOf(b))[0];
      group.forEach((h) => {
        h._shadowed = !h.parked && h.scope !== winningScope;
        h._winningScope = winningScope;
      });
      let n = 0;
      group.forEach((h) => { h._runOrder = (!h.parked && !h._shadowed) ? ++n : null; });
    } else {
      group.forEach((h) => { h._shadowed = false; });
      let n = 0;
      group
        .slice()
        .sort((a, b) => order.indexOf(a.scope) - order.indexOf(b.scope))
        .forEach((h) => { h._runOrder = runState(h, runtime).runs ? ++n : null; });
    }
  });
  return byEvent;
}

/* One honest answer to "is this running right now?", with the reason. */
function runState(h, runtime) {
  if (h.parked)      return { runs: false, label: 'Parked',       cls: '',       icon: 'archive',
    why: 'Configured but not registered. Multica moved the entry out of the hooks key.' };
  if (h._shadowed)   return { runs: false, label: 'Shadowed',     cls: '',       icon: 'layers',
    why: 'A higher-precedence file defines ' + h.event + ', so this entry is never loaded.' };
  if (h.ineffective) return { runs: false, label: 'Never runs',   cls: 'b-bad',  icon: 'ban',
    why: 'Codex parses type: ' + h.type + ' and then skips it. It has never executed.' };
  if (h.trust === 'stale') return { runs: false, label: 'Not trusted', cls: 'b-bad', icon: 'key',
    why: 'Edited since it was trusted. Codex skips it until the new hash is trusted on the host.' };
  if (h.broken === 'path') return { runs: true, label: 'Failing',  cls: 'b-bad',  icon: 'circleAlert',
    why: 'Registered and fires, but the command cannot be found. Claude treats that as non-blocking, so nothing surfaces in the session.' };
  if (h.async)       return { runs: true,  label: 'Active · async', cls: 'b-ok', icon: 'zap',
    why: 'Runs detached. Its exit status is never checked, so a failure is invisible.' };
  return { runs: true, label: 'Active', cls: 'b-ok', icon: 'check', why: 'Registered and running.' };
}

/* The matcher rule is the single most surprising thing in the schema, so
   it gets a live interpretation rather than a tooltip. */
function interpretMatcher(v) {
  const s = (v || '').trim();
  if (s === '' || s === '*') return { kind: 'all', text: 'every tool fires this hook. Empty and * are the same thing.' };
  if (/^[A-Za-z0-9_\-,| ]+$/.test(s)) {
    const parts = s.split(/[|,]/).map((x) => x.trim()).filter(Boolean);
    return { kind: 'exact', text: parts.length > 1
      ? 'matches only ' + parts.join(', ') + ' — nothing else.'
      : 'matches only ' + parts[0] + ' — nothing else.' };
  }
  const extra = [];
  if (/^[A-Za-z0-9_]+\.\*$/.test(s)) {
    const stem = s.slice(0, -2);
    extra.push('Unanchored, so it also matches Notebook' + stem + ' and Multi' + stem + '. Use ^' + stem + '$ for whole-string.');
  } else if (!s.startsWith('^')) {
    extra.push('Unanchored — it matches anywhere in the tool name. Add ^ and $ to pin it.');
  }
  return { kind: 'regex', text: 'treated as a JavaScript regex, because it contains a character outside [A-Za-z0-9_-,| ]. ' + extra.join(' ') };
}

function validateCommand(cmd) {
  const s = (cmd || '').trim();
  if (!s) return { level: 'error', text: 'A command handler needs a command.' };
  if (s.includes('\\')) return { level: 'error',
    text: 'Backslashes are Windows separators. Claude runs this through bash, which reads \\U as an escape — the path collapses to C:UsersMarty and fails with status 127 on every fire, silently.' };
  if (/\s/.test(s.split(' ')[0]) === false && / /.test(s) && !/["']/.test(s)) {
    const first = s.split(' ')[0];
    if (!/^(sh|bash|node|python3?|npx|pnpm|uv|deno)$/.test(first)) {
      return { level: 'warn', text: 'This path contains a space and is unquoted. Wrap it in double quotes or the shell will split it.' };
    }
  }
  return null;
}

        For each event, the highest-precedence file that defines it wins and every entry below is
        <span class="strike">shadowed</span> — not merged. 33 events. <code class="cmd">http</code>,
        <code class="cmd">prompt</code> and <code class="cmd">agent</code> handlers all work.</div>
        <div class="t-caption muted" style="margin-top:2px">Precedence: <code class="cmd">--settings</code> › managed › local › project › user.</div>
      </div>
      <span class="spacer"></span>
      <button class="btn sm" data-screen="precedence">See what wins</button>
    </div>`;
  }
  return `
  <div class="behavior-strip codex">
    ${ic('gitBranch', 15, 'ico')}
    <div>
      <div class="t-label"><strong class="semibold">Codex merges.</strong>
      Every matching hook in every file runs. Nothing is ever shadowed, so three entries on one event
      means three processes per fire. 12 events. Only <code class="cmd">command</code> and
      <code class="cmd">mcp_tool</code> do anything.</div>
      <div class="t-caption muted" style="margin-top:2px">Hooks also run only while their hash is trusted — any edit stops them until re-trusted.</div>
    </div>
    <span class="spacer"></span>
    <button class="btn sm" data-screen="precedence">See run order</button>
  </div>`;
}

/* ==================================================================== *
 * SCREEN 1 — HOOKS LIST
 * ==================================================================== */
function screenHooks() {
  const r = rt();
  if (r.status === 'offline') return offlineBody(r);
  const byEvent = resolve(r);
  const hooks = hooksOf(r.id);
  if (!hooks.length) return emptyBody(r);

  const q = state.query.trim().toLowerCase();
  const events = Object.keys(byEvent).sort((a, b) => {
    const order = r.provider === 'claude' ? CLAUDE_EVENTS : CODEX_EVENTS;
    return order.indexOf(a) - order.indexOf(b);
  });

  const groupsHtml = events.map((ev) => {
    const group = byEvent[ev].filter((h) => !q ||
      ev.toLowerCase().includes(q) ||
      (h.matcher || '').toLowerCase().includes(q) ||
      (h.command || h.url || h.mcpTool || '').toLowerCase().includes(q));
    if (!group.length) return '';
    if (r.provider === 'codex') {
      const lo = layersOf('codex').map((l) => l.id);
      group.sort((a, b) => lo.indexOf(a.scope) - lo.indexOf(b.scope));
    }
    const open = !state.collapsed[ev];
    const running = group.filter((h) => runState(h, r).runs).length;
    const trouble = group.filter((h) => { const s = runState(h, r); return !s.runs && (h.ineffective || h.trust === 'stale'); }).length;

    return `
    <div class="event-group">
      <button class="event-head" aria-expanded="${open}" data-toggle-event="${esc(ev)}">
        ${ic('chevronDown', 14, 'chev')}
        <span class="mono t-label medium">${esc(ev)}</span>
        ${CODEX_ONLY.includes(ev) ? '<span class="badge b-codex">Codex-only event</span>' : ''}
        <span class="badge">${group.length} ${group.length === 1 ? 'hook' : 'hooks'}</span>
        <span class="badge ${running ? 'b-ok' : 'b-dim'}">${running} running</span>
        ${trouble ? `<span class="badge b-bad">${ic('alert', 11)}${trouble} not running</span>` : ''}
        ${r.provider === 'codex' && running > 1 ? `<span class="badge b-codex">${ic('gitBranch', 11)}all ${running} fire</span>` : ''}
        ${r.provider === 'claude' && group.filter((h) => h._shadowed).length ? `<span class="badge">${ic('layers', 11)}${group.filter((h) => h._shadowed).length} shadowed</span>` : ''}
        <span class="spacer"></span>
        <span class="t-caption faint">${r.provider === 'claude'
          ? (!group[0]._winningScope ? 'nothing loads — all parked'
            : group.filter((h) => h._shadowed).length ? 'wins: ' + esc(layerMeta(r.provider, group[0]._winningScope).file) : 'single layer')
          : 'merged across ' + new Set(group.map((h) => h.scope)).size + ' file(s)'}</span>
      </button>
      ${open ? hookTable(group, r) : ''}
    </div>`;
  }).join('');

  return `
  <div class="two-col">
    <div class="col-main">
      ${runtimePicker()}
      ${behaviorStrip(r.provider)}
      ${r.provider === 'codex' && hooks.some((h) => h.trust === 'stale') ? trustBanner(hooks.filter((h) => h.trust === 'stale')) : ''}
      ${hooks.some((h) => h.broken === 'path') ? `
        <div class="notice bad t-label">
          ${ic('circleAlert', 15, 'ico')}
          <div>
            <strong class="semibold">1 hook is registered but cannot run.</strong>
            <code class="cmd">snapshot.sh</code> has failed on every <code class="cmd">PreCompact</code> fire since 2026-09-04 with status 127.
            Claude treats a failing hook as non-blocking, so the session shows nothing.
            <div style="margin-top:6px"><button class="btn sm" data-screen="log">${ic('activity', 13)}Open fire log</button>
            <button class="btn sm" data-edit="c14">${ic('pencil', 13)}Fix the path</button></div>
          </div>
        </div>` : ''}

      <div class="inline">
        <div class="field" style="flex:1;min-width:200px;max-width:320px">
          <label class="sr" for="hookSearch">Filter hooks</label>
          <div class="select-wrap">
            <input class="input" id="hookSearch" placeholder="Filter by event, matcher or command" value="${esc(state.query)}" style="padding-left:30px" />
            <svg style="position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--faint-foreground)" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">${P.search}</svg>
          </div>
        </div>
        <span style="flex:1"></span>
        <button class="btn sm" data-screen="gallery">${ic('pkg', 13)}Starter hooks</button>
        <button class="btn sm primary" data-add="1">${ic('plus', 13)}Add hook</button>
      </div>

      <div>${groupsHtml || `<div class="card"><div class="empty"><div class="media">${ic('search', 20)}</div><div class="t-title-sm medium">No hook matches “${esc(state.query)}”</div><div class="t-caption muted">Try an event name, a matcher, or part of a command.</div></div></div>`}</div>
    </div>
    <div class="col-rail">${railCards(r, hooks)}</div>
  </div>`;
}

function hookTable(group, r) {
  return `
  <table class="tbl">
    <thead><tr>
      <th style="width:1%"></th>
      <th style="width:16%">Matcher</th>
      <th style="width:11%">Handler</th>
      <th>Command</th>
      <th style="width:19%">Source</th>
      <th style="width:16%">State</th>
      <th style="width:1%"></th>
    </tr></thead>
    <tbody>
      ${group.map((h) => hookRow(h, r)).join('')}
    </tbody>
  </table>`;
}

function hookRow(h, r) {
  const st = runState(h, r);
  const lm = layerMeta(r.provider, h.scope);
  const types = HANDLER_TYPES[r.provider].find((t) => t.v === h.type);
  const target = h.command || h.url || h.mcpTool || h.prompt || '—';
  const mi = interpretMatcher(h.matcher);
  const cmdIssue = h.type === 'command' ? validateCommand(h.command) : null;

  return `
  <tr class="${h._shadowed ? 'shadowed' : ''}">
    <td>${r.provider === 'codex'
      ? `<span class="runorder ${h._runOrder ? '' : 'off'}" title="${h._runOrder ? 'Runs ' + ordinal(h._runOrder) + ' on this event' : 'Does not run'}">${h._runOrder || '–'}</span>`
      : `<span class="runorder ${st.runs ? '' : 'off'}" title="${esc(st.why)}">${st.runs ? ic('check', 12) : ic('ban', 12)}</span>`}</td>
    <td>
      <span class="cmd matcher">${h.matcher ? esc(h.matcher) : '<span class="faint">* (all)</span>'}</span>
      ${mi.kind === 'regex' ? `<div class="t-micro" style="color:var(--warning);margin-top:2px">${ic('alert', 10)} regex, unanchored</div>` : ''}
    </td>
    <td>
      <span class="badge ${types && !types.effective ? 'b-bad' : ''}">${esc(h.type)}</span>
      ${h.async ? `<div class="t-micro faint" style="margin-top:2px">async</div>` : ''}
      ${types && !types.effective ? `<div class="t-micro" style="color:var(--destructive);margin-top:2px">skipped by Codex</div>` : ''}
    </td>
    <td>
      <div class="cmd">${esc(target)}</div>
      ${h.commandWindows ? `<div class="t-micro faint" style="margin-top:3px">${ic('info', 10)} commandWindows: <span class="cmd">${esc(h.commandWindows)}</span></div>` : ''}
      ${h.statusMessage ? `<div class="t-micro faint" style="margin-top:2px">statusMessage: “${esc(h.statusMessage)}”</div>` : ''}
      ${h.additionalContextLimit ? `<div class="t-micro faint" style="margin-top:2px">additionalContextLimit: ${h.additionalContextLimit}</div>` : ''}
      ${cmdIssue ? `<div class="t-micro" style="color:var(--${cmdIssue.level === 'error' ? 'destructive' : 'warning'});margin-top:3px">${ic('alert', 10)} ${esc(cmdIssue.text.split('.')[0])}.</div>` : ''}
      ${h.codexStopBlock ? `<div class="t-micro" style="color:var(--warning);margin-top:3px">${ic('alert', 10)} Emits <span class="cmd">decision:"block"</span> on <span class="cmd">Stop</span> — on Codex that <strong>continues</strong> the turn.</div>` : ''}
      <div class="t-micro faint" style="margin-top:3px">timeout ${h.timeout != null ? h.timeout + 's' : 'default'}${h.shell ? ' · ' + esc(h.shell) : ''}</div>
    </td>
    <td>
      <div class="inline">
        <span class="badge ${lm.writable ? 'b-brand' : ''}">${lm.writable ? '' : ic('lock', 10)}${esc(lm.label)}</span>
      </div>
      <div class="cmd t-micro faint" style="margin-top:3px">${esc(lm.file)}</div>
      ${h.owner === 'multica' ? `<div class="t-micro" style="margin-top:2px;color:var(--brand)">${ic('check', 10)} written by Multica</div>`
        : h.owner === 'managed' ? `<div class="t-micro faint" style="margin-top:2px">org policy</div>`
        : h.owner === 'plugin' ? `<div class="t-micro faint" style="margin-top:2px">plugin-bundled</div>`
        : `<div class="t-micro faint" style="margin-top:2px">not written by Multica</div>`}
    </td>
    <td>
      <div class="inline">
        <span class="badge ${st.cls}">${ic(st.icon, 11)}${esc(st.label)}</span>
        ${h.trust === 'stale' ? `<button class="btn xs" data-retrust="${h.id}">${ic('key', 11)}Re-trust</button>` : ''}
      </div>
      <div class="t-micro faint" style="margin-top:3px">${esc(st.why)}</div>
    </td>
    <td class="nowrap">
      <div class="inline" style="gap:2px">
        <label class="sr" for="park-${h.id}">${h.parked ? 'Unpark' : 'Park'} this hook</label>
        <input class="switch" type="checkbox" id="park-${h.id}" ${h.parked ? '' : 'checked'} ${lm.writable && h.owner !== 'managed' && h.owner !== 'plugin' ? '' : 'disabled'} data-park="${h.id}"
          title="${lm.writable && h.owner !== 'managed' && h.owner !== 'plugin' ? 'Registered — click to park' : 'Read-only source: Multica cannot change this file'}" />
        <button class="btn ghost icon" data-edit="${h.id}" title="Edit" ${lm.writable ? '' : 'disabled'}>${ic('pencil', 14)}</button>
        <button class="btn ghost icon" data-del="${h.id}" title="Delete" ${lm.writable ? '' : 'disabled'}>${ic('trash', 14)}</button>
      </div>
    </td>
  </tr>`;
}
const ordinal = (n) => n + (['th','st','nd','rd'][(n % 100 > 10 && n % 100 < 14) ? 0 : Math.min(n % 10, 4)] || 'th');

function trustBanner(stale) {
  return `
  <div class="notice bad t-label">
    ${ic('key', 15, 'ico')}
    <div>
      <strong class="semibold">${stale.length} Codex hook${stale.length > 1 ? 's are' : ' is'} edited but not trusted — ${stale.length > 1 ? 'they are' : 'it is'} not running.</strong>
      Codex records trust against the hook's hash in <code class="cmd">[hooks.state]</code>. Any edit — including one Multica makes — invalidates it,
      and Codex skips the hook silently until the new hash is trusted.
      <div style="margin-top:6px">${stale.map((h) => `<button class="btn sm" data-retrust="${h.id}">${ic('key', 13)}Re-trust ${esc((h.command || '').split('/').pop())}</button>`).join(' ')}</div>
    </div>
  </div>`;
}

function railCards(r, hooks) {
  const layers = layersOf(r.provider);
  const counts = {};
  hooks.forEach((h) => { counts[h.scope] = (counts[h.scope] || 0) + 1; });
  const running = hooks.filter((h) => runState(h, r).runs).length;
  const parked = hooks.filter((h) => h.parked).length;
  const shadowed = hooks.filter((h) => h._shadowed).length;
  const broken = hooks.filter((h) => h.broken || h.ineffective || h.trust === 'stale').length;

  return `
  <div class="card">
    <div class="card-head"><span class="t-label medium">${ic('activity', 14)} This runtime</span></div>
    <div class="card-body tight">
      <dl class="kv">
        <dt>Running</dt><dd><span class="badge b-ok">${running}</span></dd>
        <dt>Parked</dt><dd><span class="badge">${parked}</span></dd>
        ${r.provider === 'claude' ? `<dt>Shadowed</dt><dd><span class="badge">${shadowed}</span></dd>` : `<dt>Shadowed</dt><dd><span class="badge b-dim">n/a on Codex</span></dd>`}
        <dt>Not working</dt><dd><span class="badge ${broken ? 'b-bad' : ''}">${broken}</span></dd>
      </dl>
      <hr class="sep" style="margin:10px 0" />
      <div class="t-caption muted">Configured ${hooks.length} · across ${new Set(hooks.map((h) => h.scope)).size} files · ${new Set(hooks.map((h) => h.event)).size} events</div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><span class="t-label medium">${ic('layers', 14)} Scopes</span>
      <span class="spacer"></span><button class="btn xs" data-screen="precedence">Detail</button></div>
    <div class="card-body tight">
      <div class="stack">
      ${layers.map((l) => `
        <div class="inline t-caption" style="gap:6px">
          <span class="badge ${l.writable ? 'b-brand' : ''}" style="min-width:64px;justify-content:center">${l.writable ? ic('pencil', 10) : ic('lock', 10)}${esc(l.label)}</span>
          <span class="cmd t-micro faint" style="flex:1;min-width:0">${esc(l.file)}</span>
          <span class="badge b-dim">${counts[l.id] || 0}</span>
        </div>`).join('')}
      </div>
      <hr class="sep" style="margin:10px 0" />
      <div class="t-caption muted">Only <strong class="semibold">${esc([...new Set(layers.filter((l) => l.writable).map((l) => l.label))].join(' / '))}</strong> scope is on the daemon host, so it is the only one Multica could write. Everything else is read-only here.</div>
    </div>
  </div>

  <div class="card" style="border-color:color-mix(in oklab, var(--warning) 30%, var(--border))">
    <div class="card-head" style="background:color-mix(in oklab, var(--warning) 8%, transparent)">
      <span class="t-label medium">${ic('alert', 14)} Not built yet</span>
    </div>
    <div class="card-body tight">
      <div class="t-caption muted stack">
        <div>This screen shows four things Multica cannot do today. They are sketched so Marty can react to them, not because they exist.</div>
        <div>${ic('x', 11)} <strong class="semibold">Reading</strong> a hooks file — discovery only covers fixed skill and MCP paths.</div>
        <div>${ic('x', 11)} <strong class="semibold">Writing</strong> any file on a runtime host — no write path exists at all.</div>
        <div>${ic('x', 11)} <strong class="semibold">Parking</strong> — Multica's own mechanism; neither provider has a per-hook disable.</div>
        <div>${ic('x', 11)} <strong class="semibold">Re-trusting</strong> a Codex hook — trust is granted by an interactive CLI on the host.</div>
      </div>
    </div>
  </div>`;
}
</script>

<script>
/* ==================================================================== *
 * SCREEN 2 — SCOPE & PRECEDENCE
 * The two providers get two different layouts on purpose. Claude's
 * question is "which one wins"; Codex's question is "how many run and in
 * what order". Rendering Codex with the Claude treatment would imply
 * shadowing exists there, which is the exact lie this screen must avoid.
 * ==================================================================== */
function screenPrecedence() {
  const r = rt();
  if (r.status === 'offline') return offlineBody(r);
  const byEvent = resolve(r);
  const hooks = hooksOf(r.id);
  if (!hooks.length) return emptyBody(r);

  return `
  <div class="two-col">
    <div class="col-main">
      ${runtimePicker()}
      ${behaviorStrip(r.provider)}
      ${r.provider === 'claude' ? claudePrecedence(r, byEvent) : codexPrecedence(r, byEvent)}
      ${scopeLegend(r)}
    </div>
    <div class="col-rail">${precedenceRail(r)}</div>
  </div>`;
}

/* ---------- Claude: override model ---------- */
function claudePrecedence(r, byEvent) {
  const order = layersOf('claude').map((l) => l.id);
  const events = Object.keys(byEvent).sort((a, b) => CLAUDE_EVENTS.indexOf(a) - CLAUDE_EVENTS.indexOf(b));
  const contested = events.filter((ev) => byEvent[ev].some((h) => h._shadowed));

  return `
  <div class="card">
    <div class="card-head">
      <span class="t-label medium">${ic('shield', 14)} What actually runs</span>
      <span class="badge b-claude">override model</span>
      <span class="spacer"></span>
      <span class="t-caption muted">${contested.length} of ${events.length} events are contested</span>
    </div>
    <table class="tbl">
      <thead><tr>
        <th style="width:20%">Event</th>
        <th style="width:28%">Defined in</th>
        <th>Wins</th>
        <th style="width:26%">Shadowed</th>
      </tr></thead>
      <tbody>
      ${events.map((ev) => {
        const g = byEvent[ev];
        const scopes = order.filter((s) => g.some((h) => h.scope === s && !h.parked));
        const win = g[0]._winningScope;
        const shadow = g.filter((h) => h._shadowed);
        return `<tr>
          <td><span class="mono t-label">${esc(ev)}</span></td>
          <td><div class="cellflex">${scopes.map((s) => `<span class="badge ${s === win ? 'b-ok' : 'b-dim'}">${esc(layerMeta('claude', s).label)}</span>`).join('')}</div></td>
          <td>
            ${win
              ? `<div class="cmd">${esc(layerMeta('claude', win).file)}</div>
                 <div class="t-micro faint" style="margin-top:2px">${g.filter((h) => !h._shadowed && !h.parked).length} handler(s) load from here</div>`
              : `<div class="t-caption" style="color:var(--warning)">${ic('archive', 11)} Nothing loads — every entry for this event is parked</div>`}
          </td>
          <td>${shadow.length
            ? `<div class="t-caption" style="color:var(--destructive)">${ic('layers', 11)} ${shadow.length} entr${shadow.length === 1 ? 'y' : 'ies'} never load</div>
               ${shadow.map((h) => `<div class="cmd t-micro strike" style="opacity:.6;margin-top:2px">${esc((h.command || h.url || '').split('/').pop())}</div>`).join('')}`
            : '<span class="t-caption faint">—</span>'}</td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>
    <div class="card-body tight" style="border-top:1px solid var(--border)">
      <div class="t-caption muted">Override is per event, not per matcher. The moment a higher layer names
      <code class="cmd">PreToolUse</code>, <em>every</em> <code class="cmd">PreToolUse</code> entry below it stops loading — even a matcher the
      winning layer never mentions. That is the trap: adding one repo-local Bash rule silently turned off the user-scope secret firewall below.</div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><span class="t-label medium">${ic('layers', 14)} Layers, highest precedence first</span></div>
    <div class="card-body">
      <div class="layers">
      ${layersOf('claude').map((l) => {
        const entries = hooksOf(r.id).filter((h) => h.scope === l.id);
        return `
        <div class="layer ${l.writable ? 'writable' : ''}">
          <div class="layer-head">
            <span class="badge ${l.writable ? 'b-brand' : ''}">${l.writable ? ic('pencil', 10) : ic('lock', 10)}${esc(l.label)}</span>
            <span class="cmd t-caption">${esc(l.file)}</span>
            <span class="spacer"></span>
            ${l.reach === 'not-discoverable' ? '<span class="badge b-warn">not discoverable</span>' : ''}
            ${l.reach === 'worktree' ? '<span class="badge">in the task worktree</span>' : ''}
            <span class="badge b-dim">${entries.length}</span>
          </div>
          <div class="layer-body">
            ${entries.length ? entries.map((h) => `
              <div class="layer-entry ${h._shadowed ? 'is-shadowed' : ''}">
                <span class="runorder ${runState(h, r).runs ? '' : 'off'}">${runState(h, r).runs ? ic('check', 12) : ic('ban', 12)}</span>
                <div style="min-width:0">
                  <div class="inline">
                    <span class="mono t-label">${esc(h.event)}</span>
                    <span class="cmd matcher t-caption faint">${h.matcher ? esc(h.matcher) : '*'}</span>
                    <span class="badge">${esc(h.type)}</span>
                  </div>
                  <div class="cmd t-caption" style="margin-top:2px">${esc(h.command || h.url || h.mcpTool || '')}</div>
                  <div class="t-micro ${h._shadowed ? '' : 'faint'}" style="margin-top:2px;${h._shadowed ? 'color:var(--destructive)' : ''}">${esc(runState(h, r).why)}</div>
                </div>
                <span class="spacer"></span>
                ${h.parked ? '<span class="badge">parked</span>' : ''}
              </div>`).join('')
              : `<div class="layer-entry"><span class="t-caption faint">${l.reach === 'not-discoverable' ? 'Cannot be read — a --settings file only exists for the life of one invocation.' : 'No hooks in this layer.'}</span></div>`}
          </div>
        </div>`;
      }).join('')}
      </div>
    </div>
  </div>`;
}

/* ---------- Codex: merge model ---------- */
function codexPrecedence(r, byEvent) {
  const order = layersOf('codex').map((l) => l.id);
  const events = Object.keys(byEvent).sort((a, b) => CODEX_EVENTS.indexOf(a) - CODEX_EVENTS.indexOf(b));

  return `
  <div class="notice info t-label">
    ${ic('info', 15, 'ico')}
    <div><strong class="semibold">There is no “wins” column on this screen, because on Codex nothing wins.</strong>
    Every file contributes and every contribution runs. A hook here is only ever skipped for two reasons —
    its hash is not trusted, or its handler type does nothing on Codex — never because another file outranked it.</div>
  </div>

  <div class="card">
    <div class="card-head">
      <span class="t-label medium">${ic('gitBranch', 14)} Run order per event</span>
      <span class="badge b-codex">merge model</span>
      <span class="spacer"></span>
      <span class="t-caption muted">${hooksOf(r.id).filter((h) => runState(h, r).runs).length} handlers will execute across ${events.length} events</span>
    </div>
    <div class="card-body">
      <div class="stack" style="gap:14px">
      ${events.map((ev) => {
        const g = byEvent[ev].slice().sort((a, b) => order.indexOf(a.scope) - order.indexOf(b.scope));
        const runs = g.filter((h) => runState(h, r).runs);
        const files = new Set(g.map((h) => h.scope)).size;
        return `
        <div>
          <div class="inline" style="margin-bottom:6px">
            <span class="mono t-label medium">${esc(ev)}</span>
            ${CODEX_ONLY.includes(ev) ? '<span class="badge b-codex">Codex-only</span>' : ''}
            <span class="badge ${runs.length > 1 ? 'b-codex' : ''}">${runs.length} of ${g.length} run${runs.length === 1 ? '' : 's'}</span>
            <span class="badge b-dim">${files} file${files > 1 ? 's' : ''}</span>
            ${runs.length > 1 ? `<span class="t-caption muted">${runs.length} processes per fire, in this order</span>` : ''}
          </div>
          <div class="layer">
            ${g.map((h) => {
              const st = runState(h, r);
              const lm = layerMeta('codex', h.scope);
              return `
              <div class="layer-entry">
                <span class="runorder ${h._runOrder ? '' : 'off'}">${h._runOrder || ic('ban', 12)}</span>
                <div style="min-width:0">
                  <div class="inline">
                    <span class="cmd">${esc((h.command || h.mcpTool || h.prompt || '').slice(0, 64))}</span>
                    <span class="badge ${st.cls}">${ic(st.icon, 11)}${esc(st.label)}</span>
                    <span class="badge ${lm.writable ? 'b-brand' : ''}">${lm.writable ? '' : ic('lock', 10)}${esc(lm.label)}</span>
                  </div>
                  <div class="t-micro faint" style="margin-top:2px">
                    <span class="cmd">${esc(lm.file)}</span> · matcher <span class="cmd">${h.matcher ? esc(h.matcher) : '*'}</span> · ${esc(h.type)}${h.async ? ' · async' : ''}
                  </div>
                  ${!st.runs ? `<div class="t-micro" style="margin-top:2px;color:var(--destructive)">${esc(st.why)}</div>` : ''}
                </div>
                <span class="spacer"></span>
                ${h.trust === 'stale' ? `<button class="btn xs" data-retrust="${h.id}">${ic('key', 11)}Re-trust</button>` : ''}
              </div>`;
            }).join('')}
          </div>
        </div>`;
      }).join('')}
      </div>
    </div>
    <div class="card-body tight" style="border-top:1px solid var(--border)">
      <div class="t-caption muted">Merge order decides sequence, not authority. <code class="cmd">PreToolUse</code> here runs three handlers on every
      shell call — a repo allowlist, a user policy script and an async audit — and any one of them can block. Adding a hook on Codex always adds
      work; it never replaces work, which is the opposite of the Claude screen.</div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><span class="t-label medium">${ic('layers', 14)} Layers, merge order</span></div>
    <div class="card-body">
      <div class="layers">
      ${layersOf('codex').map((l) => {
        const entries = hooksOf(r.id).filter((h) => h.scope === l.id);
        return `
        <div class="layer ${l.writable ? 'writable' : ''}">
          <div class="layer-head">
            <span class="badge ${l.writable ? 'b-brand' : ''}">${l.writable ? ic('pencil', 10) : ic('lock', 10)}${esc(l.label)}</span>
            <span class="cmd t-caption">${esc(l.file)}</span>
            <span class="spacer"></span>
            ${l.reach === 'worktree' ? '<span class="badge">in the task worktree</span>' : ''}
            ${l.id === 'user-toml' ? '<span class="badge b-warn">TOML</span>' : ''}
            <span class="badge b-dim">${entries.length}</span>
          </div>
          <div class="layer-body">
            ${entries.length ? entries.map((h) => `
              <div class="layer-entry">
                <span class="runorder ${runState(h, r).runs ? '' : 'off'}">${runState(h, r).runs ? ic('check', 12) : ic('ban', 12)}</span>
                <div style="min-width:0">
                  <div class="inline"><span class="mono t-label">${esc(h.event)}</span>
                  <span class="cmd matcher t-caption faint">${h.matcher ? esc(h.matcher) : '*'}</span>
                  <span class="badge">${esc(h.type)}</span></div>
                  <div class="cmd t-caption" style="margin-top:2px">${esc(h.command || h.mcpTool || h.prompt || '')}</div>
                </div>
                <span class="spacer"></span>
                ${h.parked ? '<span class="badge">parked</span>' : ''}
              </div>`).join('')
              : '<div class="layer-entry"><span class="t-caption faint">No hooks in this layer.</span></div>'}
          </div>
        </div>`;
      }).join('')}
      </div>
    </div>
  </div>`;
}

function scopeLegend(r) {
  return `
  <div class="card">
    <div class="card-head"><span class="t-label medium">${ic('lock', 14)} Why most of this is read-only</span></div>
    <div class="card-body tight">
      <div class="stack">
      ${layersOf(r.provider).map((l) => `
        <div class="inline" style="align-items:flex-start">
          <span class="badge ${l.writable ? 'b-brand' : ''}" style="min-width:74px;justify-content:center">${l.writable ? ic('pencil', 10) : ic('lock', 10)}${esc(l.label)}</span>
          <div style="min-width:0">
            <div class="cmd t-caption">${esc(l.file)}</div>
            <div class="t-caption muted">${esc(l.why)}</div>
          </div>
        </div>`).join('')}
      </div>
    </div>
  </div>`;
}

function precedenceRail(r) {
  return `
  <div class="card">
    <div class="card-head"><span class="t-label medium">${ic('cpu', 14)} Claude vs Codex</span></div>
    <div class="card-body tight">
      <div class="stack t-caption">
        <div><strong class="semibold">Precedence</strong><div class="muted">Claude: highest layer overrides, the rest are shadowed. Codex: all layers merge, everything runs.</div></div>
        <hr class="sep" />
        <div><strong class="semibold">Events</strong><div class="muted">Claude 33 · Codex 12. <code class="cmd">Interrupt</code> exists only on Codex; <code class="cmd">FileChanged</code>, <code class="cmd">TeammateIdle</code>, <code class="cmd">ConfigChange</code> and 20 more only on Claude.</div></div>
        <hr class="sep" />
        <div><strong class="semibold">Handler types</strong><div class="muted">Claude: command, http, mcp_tool, prompt, agent. Codex: command and mcp_tool only — <code class="cmd">prompt</code> and <code class="cmd">agent</code> are parsed and then skipped.</div></div>
        <hr class="sep" />
        <div><strong class="semibold">Trust</strong><div class="muted">Codex runs a hook only while its hash matches <code class="cmd">[hooks.state].trusted_hash</code>. Claude has no equivalent.</div></div>
        <hr class="sep" />
        <div><strong class="semibold">Stop + block</strong><div class="muted">Claude: rejects the stop. Codex: <em>continues</em> the turn. Same JSON, opposite outcome.</div></div>
        <hr class="sep" />
        <div><strong class="semibold">Windows</strong><div class="muted">Codex has <code class="cmd">commandWindows</code>; Claude has <code class="cmd">shell: "powershell"</code>.</div></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><span class="t-label medium">${ic('eye', 14)} Layers not shown</span></div>
    <div class="card-body tight">
      <div class="t-caption muted stack">
        <div>Both providers load hooks from places no discovery pass can enumerate. They are listed so the count above is not mistaken for the whole truth.</div>
        ${r.provider === 'claude' ? `
        <div>· <code class="cmd">--settings &lt;file&gt;</code> passed per invocation</div>
        <div>· plugin <code class="cmd">hooks/hooks.json</code>, per enabled plugin</div>
        <div>· skill frontmatter, for the rest of a session</div>
        <div>· subagent frontmatter, while a subagent runs</div>` : `
        <div>· plugin-bundled hooks, per enabled Codex plugin</div>
        <div>· <code class="cmd">requirements.toml</code> / MDM managed hooks, trusted by policy</div>
        <div>· anything added inside a live session via <code class="cmd">/hooks</code></div>`}
      </div>
    </div>
  </div>`;
}
</script>

<script>
/* ==================================================================== *
 * SCREEN 3 — FIRE LOG
 * The answer to LOCO-79's #1 complaint: a broken hook is a non-blocking
 * error, so the guard stops enforcing with nothing on screen. Shape
 * borrowed from the filterable event timelines (disler / agents-observe /
 * Agent-Monitor); the data is host-side and already exists for Claude.
 * ==================================================================== */
function screenLog() {
  const r = rt();
  const feed = FIRE_LOG[r.id] || { rows: [], source: '', sourceOk: true };
  const failish = ['failed', 'timeout', 'untrusted', 'ineffective'];
  const rows = feed.rows.filter((row) => {
    if (state.logFilter === 'failures') return failish.includes(row.verdict);
    if (state.logFilter === 'never') return ['shadowed', 'ineffective', 'untrusted'].includes(row.verdict);
    if (state.logFilter === 'blocked') return ['blocked', 'continued'].includes(row.verdict);
    return true;
  });
  const nFail = feed.rows.filter((x) => failish.includes(x.verdict)).length;
  const nNever = feed.rows.filter((x) => ['shadowed', 'ineffective', 'untrusted'].includes(x.verdict)).length;

  return `
  <div class="two-col">
    <div class="col-main">
      ${runtimePicker()}
      ${nFail ? `
      <div class="notice bad t-label">
        ${ic('circleAlert', 15, 'ico')}
        <div><strong class="semibold">${nFail} hook fire${nFail > 1 ? 's' : ''} failed in the last hour and none of them surfaced in the session.</strong>
        A hook that exits non-zero on a non-blocking event is swallowed by the CLI — the guard simply stops guarding.
        This feed is the only place that shows up.</div>
      </div>` : ''}

      <div class="card">
        <div class="card-head">
          <span class="t-label medium">${ic('activity', 14)} Hook fires</span>
          <span class="spacer"></span>
          <div class="seg" role="group" aria-label="Filter fires">
            <button data-log="all" aria-pressed="${state.logFilter === 'all'}">All ${feed.rows.length}</button>
            <button data-log="failures" aria-pressed="${state.logFilter === 'failures'}">Failures ${nFail}</button>
            <button data-log="never" aria-pressed="${state.logFilter === 'never'}">Never ran ${nNever}</button>
            <button data-log="blocked" aria-pressed="${state.logFilter === 'blocked'}">Decisions</button>
          </div>
        </div>
        ${rows.length ? `
        <div class="log-head"><span>Time</span><span>Event · matcher · hook</span><span>Duration</span><span>Verdict</span></div>
        ${rows.map(logRow).join('')}`
        : `<div class="empty"><div class="media">${ic('filter', 20)}</div>
            <div class="t-title-sm medium">Nothing matches this filter</div>
            <div class="t-caption muted">${feed.rows.length ? 'Switch back to All to see every fire.' : esc(feed.source)}</div></div>`}
      </div>

      <div class="notice ${feed.sourceOk ? 'info' : 'warn'} t-caption">
        ${ic(feed.sourceOk ? 'info' : 'alert', 14, 'ico')}
        <div><strong class="semibold">Where this comes from.</strong> ${esc(feed.source)}</div>
      </div>
    </div>
    <div class="col-rail">
      <div class="card">
        <div class="card-head"><span class="t-label medium">${ic('eye', 14)} What a verdict means</span></div>
        <div class="card-body tight">
          <div class="stack t-caption">
            <div><span class="badge b-ok">${ic('check', 11)}success</span> <span class="muted">exit 0.</span></div>
            <div><span class="badge b-warn">${ic('ban', 11)}blocked</span> <span class="muted">exit 2 on a blockable event — the tool call was rejected.</span></div>
            <div><span class="badge b-bad">${ic('circleAlert', 11)}failed</span> <span class="muted">non-zero, non-blocking. Invisible in the session.</span></div>
            <div><span class="badge b-bad">${ic('clock', 11)}timed out</span> <span class="muted">killed at its timeout.</span></div>
            <div><span class="badge">${ic('zap', 11)}async · unknown</span> <span class="muted">detached. Neither CLI records the outcome — a permanent blind spot, not a gap in this feed.</span></div>
            <div><span class="badge">${ic('layers', 11)}shadowed</span> <span class="muted">Claude only. Never invoked at all.</span></div>
            <div><span class="badge b-bad">${ic('key', 11)}not trusted</span> <span class="muted">Codex only. Skipped on a hash mismatch.</span></div>
            <div><span class="badge b-warn">${ic('info', 11)}continued turn</span> <span class="muted">Codex only. <code class="cmd">decision:"block"</code> on <code class="cmd">Stop</code> continues rather than rejects.</span></div>
          </div>
        </div>
      </div>
      <div class="card" style="border-color:color-mix(in oklab, var(--warning) 30%, var(--border))">
        <div class="card-head" style="background:color-mix(in oklab, var(--warning) 8%, transparent)">
          <span class="t-label medium">${ic('alert', 14)} Not built yet</span>
        </div>
        <div class="card-body tight">
          <div class="t-caption muted stack">
            <div>Claude writes per-hook results host-side today, so the data exists — but nothing ships it to the server.</div>
            <div>${ic('x', 11)} No log-tailing pending action, and no store for fires.</div>
            <div>${ic('x', 11)} Codex writes no per-hook log at all. The Codex feed above is inferred, and its durations are approximations — flagged on screen rather than dressed up.</div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function logRow(row) {
  const v = VERDICTS[row.verdict] || { label: row.verdict, cls: '', icon: 'info' };
  const bad = ['failed', 'timeout', 'untrusted', 'ineffective'].includes(row.verdict);
  return `
  <div class="log-row ${bad ? 'fail' : ''}">
    <span class="cmd t-caption faint">${esc(row.t)}</span>
    <div style="min-width:0">
      <div class="inline">
        <span class="mono t-label">${esc(row.event)}</span>
        <span class="faint t-caption">·</span>
        <span class="cmd t-caption faint">${esc(row.matcher)}</span>
        <span class="faint t-caption">·</span>
        <span class="cmd t-caption">${esc(row.hook)}</span>
        <span class="badge b-dim">${esc(row.task)}</span>
      </div>
      ${row.note ? `<div class="t-caption muted" style="margin-top:2px">${esc(row.note)}</div>` : ''}
      ${row.stderr ? `<div class="stderr">${esc(row.stderr)}</div>` : ''}
    </div>
    <span class="cmd t-caption ${row.ms == null ? 'faint' : ''}">${row.ms == null ? '—' : row.ms + ' ms'}</span>
    <span><span class="badge ${v.cls}">${ic(v.icon, 11)}${esc(v.label)}</span></span>
  </div>`;
}

/* ==================================================================== *
 * SCREEN 4 — STARTER HOOKS GALLERY
 * Catalog-card layout after karanb192.github.io/claude-code-hooks (MIT).
 * Provider compatibility is on the card because "Install" means two
 * different things depending on the selected runtime — and for two of
 * these it means "not possible here".
 * ==================================================================== */
function screenGallery() {
  const r = rt();
  const installed = new Set(hooksOf(r.id).map((h) => h.installedFrom).filter(Boolean));
  return `
  <div class="two-col">
    <div class="col-main">
      ${runtimePicker()}
      <div class="notice info t-label">
        ${ic('pkg', 15, 'ico')}
        <div><strong class="semibold">Install targets ${esc(r.name)} — ${esc(providerLabel(r.provider))}, user scope.</strong>
        Cards that need a handler type or a tool this provider does not have are marked and cannot be installed here.</div>
      </div>
      <div class="gallery">
      ${GALLERY.map((g) => {
        const ok = r.provider === 'claude' ? g.claude : g.codex;
        const has = installed.has(g.id);
        return `
        <div class="g-card">
          <div class="g-top">
            <span class="mono t-label medium" style="flex:1;min-width:0">${esc(g.name)}</span>
            ${has ? '<span class="badge b-ok">installed</span>' : ''}
          </div>
          <div class="inline">
            <span class="badge">${esc(g.event)}</span>
            <span class="cmd t-caption faint">${esc(g.matcher)}</span>
          </div>
          <div class="t-caption muted">${esc(g.desc)}</div>
          ${g.levels.length ? `<div class="inline t-micro">
            <span class="faint">Severity</span>
            ${g.levels.map((l) => `<span class="badge ${l === 'Block' ? 'b-bad' : l === 'Ask' ? 'b-warn' : ''}">${esc(l)}</span>`).join('')}
          </div>` : ''}
          <div class="compat t-micro">
            <span class="badge ${g.claude ? 'b-ok' : 'b-bad'}">${g.claude ? ic('check', 10) : ic('x', 10)}Claude</span>
            <span class="badge ${g.codex ? 'b-ok' : 'b-bad'}">${g.codex ? ic('check', 10) : ic('x', 10)}Codex</span>
            <span class="badge b-dim">${esc(g.type)}</span>
          </div>
          ${!ok ? `<div class="t-micro" style="color:var(--warning)">${ic('alert', 10)} ${esc(g.incompat || 'Not supported on this provider.')}</div>` : ''}
          <div class="g-foot">
            <button class="btn sm ${ok && !has ? 'primary' : ''}" ${ok && !has ? `data-install="${g.id}"` : 'disabled'}>
              ${has ? ic('check', 13) : ic('download', 13)}${has ? 'Installed' : ok ? 'Install' : 'Unavailable'}
            </button>
            <button class="btn sm" data-src="${g.id}">${ic('ext', 13)}Source</button>
          </div>
        </div>`;
      }).join('')}
      </div>
    </div>
    <div class="col-rail">
      <div class="card">
        <div class="card-head"><span class="t-label medium">${ic('shield', 14)} Severity, honestly</span></div>
        <div class="card-body tight">
          <div class="t-caption muted stack">
            <div>Warn / Ask / Block is not a field in either schema. It is a convention these hook scripts implement themselves — <code class="cmd">HOOK_SAFETY_LEVEL</code> plus <code class="cmd">permissionDecision: "ask"</code>.</div>
            <div>So it appears on gallery cards, where Multica controls what it installs, and deliberately <strong class="semibold">not</strong> as a column on the hooks list, where it would imply a per-hook setting that does not exist.</div>
          </div>
        </div>
      </div>
      <div class="card" style="border-color:color-mix(in oklab, var(--warning) 30%, var(--border))">
        <div class="card-head" style="background:color-mix(in oklab, var(--warning) 8%, transparent)">
          <span class="t-label medium">${ic('alert', 14)} Not built yet</span>
        </div>
        <div class="card-body tight">
          <div class="t-caption muted stack">
            <div>${ic('x', 11)} Installing means writing a script <em>and</em> a settings entry on the host. Neither is possible today.</div>
            <div>${ic('x', 11)} There is no catalog service. These nine entries are hard-coded here.</div>
            <div>${ic('x', 11)} Claude's native <code class="cmd">/plugin marketplace</code> route would avoid file surgery entirely and is probably the better v1 — worth deciding before building a writer.</div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

/* ==================================================================== *
 * SCREEN 5 — DISCOVERY / EMPTY / OFFLINE
 * Discovery mirrors the local-skills panel: initiate, then poll the
 * result endpoint every 500 ms up to 30 s, Skeleton in the meantime.
 * ==================================================================== */
const DISCOVERY_STEPS = [
  { label: 'Initiating discovery', detail: 'POST /api/runtimes/{id}/hooks' },
  { label: 'Queued for the next daemon heartbeat', detail: 'pending action · up to 5 s' },
  { label: 'Reading provider config on the host', detail: '~/.claude/settings.json · /etc/claude-code/managed-settings.json' },
  { label: 'Parsing and resolving precedence', detail: 'server-side' },
  { label: 'Done', detail: '16 hooks across 4 files' },
];

function screenStates() {
  return `
  <div class="two-col">
    <div class="col-main">
      <div class="card">
        <div class="card-body tight">
          <div class="inline">
            <span class="t-label medium">State</span>
            <div class="seg" role="group" aria-label="Choose a state to preview">
              <button data-demo="discovery" aria-pressed="${state.stateDemo === 'discovery'}">Discovery</button>
              <button data-demo="empty" aria-pressed="${state.stateDemo === 'empty'}">Empty</button>
              <button data-demo="offline" aria-pressed="${state.stateDemo === 'offline'}">Runtime offline</button>
            </div>
            <span style="flex:1"></span>
            <span class="t-caption muted">These three states are reachable from the runtime picker too — marty-mbp is empty, loco-winlab is offline.</span>
          </div>
        </div>
      </div>
      ${state.stateDemo === 'discovery' ? discoveryBody()
        : state.stateDemo === 'empty' ? emptyCard(RUNTIMES[2])
        : offlineCard(RUNTIMES[3])}
    </div>
    <div class="col-rail">
      <div class="card">
        <div class="card-head"><span class="t-label medium">${ic('refresh', 14)} Why initiate-then-poll</span></div>
        <div class="card-body tight">
          <div class="t-caption muted stack">
            <div>The server cannot call a runtime directly. It parks a pending action, the daemon picks it up on its next heartbeat, does the work, and reports back to a result endpoint the web app polls.</div>
            <div>That is exactly how runtime local-skill discovery already works, so a hooks read is a clone of a shipped pipeline rather than a new mechanism — which is also why a read is cheap and a <em>write</em> is not.</div>
          </div>
        </div>
      </div>
      <div class="card" style="border-color:color-mix(in oklab, var(--warning) 30%, var(--border))">
        <div class="card-head" style="background:color-mix(in oklab, var(--warning) 8%, transparent)">
          <span class="t-label medium">${ic('alert', 14)} Not built yet</span>
        </div>
        <div class="card-body tight">
          <div class="t-caption muted stack">
            <div>${ic('x', 11)} Discovery today reads a fixed set of skill directories and one MCP config file. Paths are compiled in per provider — there is no parameter for another path, so a hooks read needs a new pending action and daemon handler.</div>
            <div>${ic('x', 11)} No <code class="cmd">hooks-v1</code> capability flag, so there is nothing to gate the tab on for older daemons.</div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function discoveryBody() {
  const step = state.discoveryStep;
  return `
  <div class="card">
    <div class="card-head">
      <span class="t-label medium">${ic('refresh', 14)} Reading hooks from cc-claudesp</span>
      <span class="badge b-brand">polling</span>
      <span class="spacer"></span>
      <span class="t-caption muted mono">500 ms interval · 3.2 s elapsed · 30 s timeout</span>
      <button class="btn sm" data-act="stepDiscovery">${ic('play', 13)}Advance</button>
    </div>
    <div class="card-body">
      <div class="stack" style="gap:8px">
      ${DISCOVERY_STEPS.map((s, i) => `
        <div class="inline" style="align-items:flex-start">
          <span class="runorder ${i < step ? '' : 'off'}" style="margin-top:1px">${i < step ? ic('check', 12) : i === step ? ic('refresh', 12) : ic('clock', 12)}</span>
          <div style="min-width:0">
            <div class="t-label ${i <= step ? '' : 'faint'}">${esc(s.label)}${i === step && i < DISCOVERY_STEPS.length - 1 ? '…' : ''}</div>
            <div class="cmd t-micro faint">${esc(s.detail)}</div>
          </div>
        </div>`).join('')}
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><span class="t-label medium">Hooks</span><span class="spacer"></span>
      <span class="sk" style="display:inline-block;width:72px;height:14px"></span></div>
    ${[0, 1, 2].map(() => `
      <div style="padding:12px;border-bottom:1px solid var(--border)">
        <div class="inline" style="margin-bottom:8px">
          <span class="sk" style="width:110px;height:14px"></span>
          <span class="sk" style="width:54px;height:14px"></span>
          <span class="sk" style="width:68px;height:14px"></span>
        </div>
        <div class="sk" style="width:64%;height:12px;margin-bottom:6px"></div>
        <div class="sk" style="width:38%;height:12px"></div>
      </div>`).join('')}
    <div class="card-body tight"><span class="t-caption faint">Skeleton rows while the runtime is read — same treatment as the local-skills import panel.</span></div>
  </div>`;
}

function emptyCard(r) {
  return `
  <div class="card">
    <div class="empty">
      <div class="media">${ic('webhook', 20)}</div>
      <div class="t-title-sm medium">No lifecycle hooks on ${esc(r.name)}</div>
      <div class="t-caption muted" style="max-width:460px">
        Multica read <code class="cmd">~/.claude/settings.json</code> on ${esc(machineOf(r).title)} and found no <code class="cmd">hooks</code> key.
        Project and local scopes were not read — they live in the task worktree, not on this host.
      </div>
      <div class="actions">
        <button class="btn primary" data-add="1">${ic('plus', 14)}Add a hook</button>
        <button class="btn" data-screen="gallery">${ic('pkg', 14)}Browse starter hooks</button>
      </div>
      <div class="t-caption faint" style="margin-top:4px">Last read ${esc(r.scanned)}</div>
    </div>
  </div>`;
}
function emptyBody(r) {
  return `<div class="two-col"><div class="col-main">${runtimePicker()}${behaviorStrip(r.provider)}${emptyCard(r)}</div>
    <div class="col-rail">${railCards(r, [])}</div></div>`;
}

function offlineCard(r) {
  return `
  <div class="card">
    <div class="empty">
      <div class="media" style="background:color-mix(in oklab, var(--destructive) 16%, transparent);color:var(--destructive)">${ic('wifiOff', 20)}</div>
      <div class="t-title-sm medium">${esc(r.name)} is offline</div>
      <div class="t-caption muted" style="max-width:480px">
        The ${esc(machineOf(r).title)} daemon last checked in ${esc(r.scanned)}. Hooks cannot be read or written while it is offline —
        the write would sit in a pending action and apply whenever the machine came back, which is worse than refusing.
      </div>
      <div class="actions">
        <button class="btn" data-act="rescan">${ic('refresh', 14)}Retry</button>
        <button class="btn" data-act="viewCached">${ic('eye', 14)}View last known hooks</button>
      </div>
