      <div class="t-caption faint" style="margin-top:4px">Editing is disabled until the runtime reconnects.</div>
    </div>
  </div>`;
}
function offlineBody(r) {
  return `<div class="two-col"><div class="col-main">${runtimePicker()}${offlineCard(r)}</div>
    <div class="col-rail">
      <div class="card"><div class="card-head"><span class="t-label medium">${ic('wifiOff', 14)} Last known state</span></div>
      <div class="card-body tight"><div class="t-caption muted">Cached from ${esc(r.scanned)}. Shown read-only; a stale read is labelled rather than silently served as current.</div></div></div>
    </div></div>`;
}
</script>

<script>
/* ==================================================================== *
 * DIALOGS — Dialog for the editor (matching McpServerDialog and
 * runtime-profiles-dialog), AlertDialog for the delete confirm.
 * ==================================================================== */
let ed = null;      // editor draft
let modal = null;   // 'editor' | 'delete' | 'diff' | 'trust' | 'park'
let pending = null;  // payload for delete / trust / park

function openEditor(hookId) {
  const r = rt();
  const h = hookId ? hooksOf(r.id).find((x) => x.id === hookId) : null;
  const writable = layersOf(r.provider).filter((l) => l.writable);
  ed = {
    mode: h ? 'edit' : 'add',
    id: h ? h.id : null,
    provider: r.provider,
    event: h ? h.event : '',
    matcher: h ? (h.matcher || '') : '',
    type: h ? h.type : 'command',
    command: h ? (h.command || '') : '',
    args: h && h.args ? h.args.join(' ') : '',
    timeout: h && h.timeout != null ? String(h.timeout) : '',
    async: h ? !!h.async : false,
    shell: h && h.shell ? h.shell : 'bash',
    scope: h && layerMeta(r.provider, h.scope).writable ? h.scope : writable[0].id,
    commandWindows: h ? (h.commandWindows || '') : '',
    statusMessage: h ? (h.statusMessage || '') : '',
    additionalContextLimit: h && h.additionalContextLimit ? String(h.additionalContextLimit) : '',
    url: h ? (h.url || '') : '',
    mcpTool: h ? (h.mcpTool || '') : '',
    comboOpen: false,
    comboQuery: '',
    dirty: false,
  };
  modal = 'editor';
  renderModal();
}

function editorProblems() {
  const out = [];
  const types = HANDLER_TYPES[ed.provider];
  const t = types.find((x) => x.v === ed.type);
  if (!ed.event) out.push({ level: 'error', field: 'event', text: 'Pick an event.' });
  if (t && !t.effective) out.push({ level: 'error', field: 'type',
    text: 'Codex parses type: ' + ed.type + ' and then skips it. Saving this would store a hook that can never run — the silent failure this screen exists to prevent.' });
  if (ed.type === 'command') {
    const c = validateCommand(ed.command);
    if (c) out.push({ level: c.level, field: 'command', text: c.text });
  }
  if (ed.type === 'http' && !/^https?:\/\//.test(ed.url)) out.push({ level: 'error', field: 'url', text: 'An http handler needs an absolute URL.' });
  if (ed.type === 'mcp_tool' && !ed.mcpTool.trim()) out.push({ level: 'error', field: 'mcpTool', text: 'Name the MCP tool to invoke.' });
  const mi = interpretMatcher(ed.matcher);
  if (mi.kind === 'regex') out.push({ level: 'warn', field: 'matcher', text: mi.text });
  if (ed.event === 'FileChanged' && mi.kind === 'regex') out.push({ level: 'error', field: 'matcher',
    text: 'FileChanged only accepts the narrow exact set (letters, digits, _ and |). A regex here never matches anything.' });
  if (ed.event === 'Stop' && ed.provider === 'codex') out.push({ level: 'warn', field: 'event',
    text: 'On Codex, a Stop hook returning decision:"block" CONTINUES the turn. On Claude the same JSON rejects it. Check which one your script means.' });
  if (ed.async) out.push({ level: 'warn', field: 'async',
    text: 'async detaches the process. Neither CLI checks its exit status, so a failure will never appear anywhere — including in the fire log.' });
  if (ed.provider === 'codex') out.push({ level: 'warn', field: 'trust',
    text: 'Saving rewrites a Codex hooks file, which invalidates the trust hashes in [hooks.state]. Affected hooks stop running until they are re-trusted on the host.' });
  return out;
}

function eventOptions() {
  const all = ed.provider === 'claude' ? CLAUDE_EVENTS : CODEX_EVENTS;
  const q = ed.comboQuery.trim().toLowerCase();
  const hit = all.filter((e) => e.toLowerCase().includes(q));
  const common = ed.provider === 'claude' ? CLAUDE_COMMON : CODEX_EVENTS.slice(0, 6);
  return {
    total: all.length,
    common: hit.filter((e) => common.includes(e)),
    rest: hit.filter((e) => !common.includes(e)),
  };
}

function editorDialog() {
  const problems = editorProblems();
  const perField = (f) => problems.filter((p) => p.field === f);
  const blocking = problems.filter((p) => p.level === 'error');
  const types = HANDLER_TYPES[ed.provider];
  const opts = eventOptions();
  const mi = interpretMatcher(ed.matcher);
  const allLayers = layersOf(ed.provider);

  return `
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="edTitle">
    <div class="dialog-head">
      <div>
        <div class="t-title-lg" id="edTitle">${ed.mode === 'add' ? 'Add lifecycle hook' : 'Edit lifecycle hook'}</div>
        <div class="t-caption muted" style="margin-top:2px">
          ${esc(rt().name)} · <span class="badge ${ed.provider === 'claude' ? 'b-claude' : 'b-codex'}">${esc(providerLabel(ed.provider))}</span>
        </div>
      </div>
      <span class="spacer"></span>
      <button class="btn ghost icon" data-close="1" aria-label="Close">${ic('x', 16)}</button>
    </div>

    <div class="dialog-body">
      <!-- Event: searchable combobox, not a 33-item dropdown. -->
      <div class="field">
        <label for="edEvent">Event</label>
        <div class="combo">
          <div class="select-wrap">
            <input class="input" id="edEvent" autocomplete="off"
              placeholder="Search ${opts.total} ${esc(providerLabel(ed.provider))} events"
              value="${esc(ed.comboOpen ? ed.comboQuery : ed.event)}" data-combo="1"
              aria-expanded="${ed.comboOpen}" aria-invalid="${perField('event').some((p) => p.level === 'error')}" />
            ${ic('search', 14)}
          </div>
          <div class="combo-list" ${ed.comboOpen ? '' : 'hidden'}>
            ${opts.common.length ? `<div class="combo-group">Common</div>` +
              opts.common.map((e) => comboOpt(e)).join('') : ''}
            ${opts.rest.length ? `<div class="combo-group">All ${opts.total} events</div>` +
              opts.rest.map((e) => comboOpt(e)).join('') : ''}
            ${!opts.common.length && !opts.rest.length ? `<div class="combo-empty">
              No ${esc(providerLabel(ed.provider))} event matches “${esc(ed.comboQuery)}”.
              ${ed.provider === 'codex' && CLAUDE_EVENTS.some((e) => e.toLowerCase().includes(ed.comboQuery.trim().toLowerCase()))
                ? ' It exists on Claude but not on Codex.' : ''}</div>` : ''}
          </div>
        </div>
        <div class="hint">${esc(providerLabel(ed.provider))} has ${opts.total} events. ${ed.provider === 'codex'
          ? 'Interrupt is Codex-only; FileChanged, TeammateIdle and ConfigChange do not exist here.'
          : 'Nine are common; the other 24 are reachable by typing.'}</div>
        ${perField('event').map((p) => `<div class="${p.level === 'error' ? 'err' : 'warn'}">${ic('alert', 12)}<span>${p.text}</span></div>`).join('')}
      </div>

      <!-- Matcher: live interpretation of the non-obvious rule. -->
      <div class="field">
        <label for="edMatcher">Matcher</label>
        <input class="input mono" id="edMatcher" data-f="matcher" value="${esc(ed.matcher)}" placeholder="* — every tool"
          aria-invalid="${perField('matcher').some((p) => p.level === 'error')}" />
        <div class="hint">
          <code class="cmd">*</code> or empty matches everything. Only <code class="cmd">[A-Za-z0-9_-,| ]</code> means an exact string or a
          <code class="cmd">|</code>/<code class="cmd">,</code>-separated exact list. <strong class="semibold">Any other character makes it an
          unanchored JavaScript regex.</strong>
        </div>
        <div class="notice ${mi.kind === 'regex' ? 'warn' : 'ok'} t-caption" style="padding:7px 10px">
          ${ic(mi.kind === 'regex' ? 'alert' : 'check', 13, 'ico')}
          <div><strong class="semibold">${mi.kind === 'regex' ? 'Regex' : mi.kind === 'all' ? 'Matches all' : 'Exact'}</strong> — ${esc(mi.text)}</div>
        </div>
        ${perField('matcher').filter((p) => p.level === 'error').map((p) => `<div class="err">${ic('alert', 12)}<span>${esc(p.text)}</span></div>`).join('')}
      </div>

      <!-- Handler type: gated per provider. -->
      <div class="field">
        <label for="edType">Handler type</label>
        <div class="select-wrap">
          <select class="select" id="edType" data-f="type">
            ${types.map((t) => `<option value="${t.v}" ${t.v === ed.type ? 'selected' : ''} ${t.effective ? '' : 'disabled'}>
              ${esc(t.label)}${t.effective ? '' : ' — skipped by Codex'}</option>`).join('')}
          </select>
          ${ic('chevronDown', 14)}
        </div>
        <div class="hint">${esc((types.find((t) => t.v === ed.type) || {}).note || '')}</div>
        ${ed.provider === 'codex' ? `<div class="hint">Codex implements <code class="cmd">command</code> and <code class="cmd">mcp_tool</code>.
          <code class="cmd">http</code>, <code class="cmd">prompt</code> and <code class="cmd">agent</code> are disabled above because Codex parses them and then drops them without a word.</div>` : ''}
        ${perField('type').map((p) => `<div class="err">${ic('circleAlert', 12)}<span>${esc(p.text)}</span></div>`).join('')}
      </div>

      ${ed.type === 'command' ? `
      <div class="field">
        <label for="edCommand">Command</label>
        <input class="input mono" id="edCommand" data-f="command" value="${esc(ed.command)}" placeholder="~/.claude/hooks/guard.py"
          aria-invalid="${perField('command').some((p) => p.level === 'error')}" />
        <div class="hint">Runs through <code class="cmd">${esc(ed.shell)}</code> unless <code class="cmd">args</code> is set, which switches to exec form with no shell.</div>
        ${perField('command').map((p) => `<div class="${p.level === 'error' ? 'err' : 'warn'}">${ic(p.level === 'error' ? 'circleAlert' : 'alert', 12)}<span>${esc(p.text)}</span></div>`).join('')}
      </div>
      <div class="row-3">
        <div class="field">
          <label for="edArgs">Args <span class="faint">optional</span></label>
          <input class="input mono" id="edArgs" data-f="args" value="${esc(ed.args)}" placeholder="--strict --json" />
        </div>
        <div class="field">
          <label for="edTimeout">Timeout <span class="faint">seconds</span></label>
          <input class="input" id="edTimeout" data-f="timeout" value="${esc(ed.timeout)}" placeholder="600" inputmode="numeric" />
        </div>
        <div class="field">
          <label for="edShell">Shell</label>
          <div class="select-wrap">
            <select class="select" id="edShell" data-f="shell" ${ed.provider === 'codex' ? 'disabled' : ''}>
              <option ${ed.shell === 'bash' ? 'selected' : ''}>bash</option>
              <option ${ed.shell === 'powershell' ? 'selected' : ''}>powershell</option>
            </select>
            ${ic('chevronDown', 14)}
          </div>
          ${ed.provider === 'codex' ? '<div class="hint">Codex has no shell field — use commandWindows below.</div>' : ''}
        </div>
      </div>` : ''}

      ${ed.type === 'http' ? `
      <div class="field">
        <label for="edUrl">URL</label>
        <input class="input mono" id="edUrl" data-f="url" value="${esc(ed.url)}" placeholder="https://example.com/hook" />
        <div class="hint">Headers support <code class="cmd">$VAR</code> interpolation limited to <code class="cmd">allowedEnvVars</code>.</div>
        ${perField('url').map((p) => `<div class="err">${ic('circleAlert', 12)}<span>${esc(p.text)}</span></div>`).join('')}
      </div>` : ''}

      ${ed.type === 'mcp_tool' ? `
      <div class="field">
        <label for="edMcp">MCP tool</label>
        <input class="input mono" id="edMcp" data-f="mcpTool" value="${esc(ed.mcpTool)}" placeholder="server__tool_name" />
        ${perField('mcpTool').map((p) => `<div class="err">${ic('circleAlert', 12)}<span>${esc(p.text)}</span></div>`).join('')}
      </div>` : ''}

      ${ed.provider === 'codex' && ed.type === 'command' ? `
      <div class="card" style="background:color-mix(in oklab, var(--info) 6%, transparent);border-color:color-mix(in oklab, var(--info) 26%, transparent)">
        <div class="card-body tight">
          <div class="inline" style="margin-bottom:10px">
            <span class="badge b-codex">${ic('cpu', 11)}Codex-only fields</span>
            <span class="t-caption muted">These three have no Claude equivalent.</span>
          </div>
          <div class="stack">
            <div class="field">
              <label for="edCw">commandWindows</label>
              <input class="input mono" id="edCw" data-f="commandWindows" value="${esc(ed.commandWindows)}" placeholder="powershell -File %USERPROFILE%\\.codex\\hooks\\guard.ps1" />
              <div class="hint">Used instead of <code class="cmd">command</code> on Windows hosts. Written as <code class="cmd">command_windows</code> in TOML.</div>
            </div>
            <div class="row-2">
              <div class="field">
                <label for="edSm">statusMessage</label>
                <input class="input" id="edSm" data-f="statusMessage" value="${esc(ed.statusMessage)}" placeholder="Checking shell policy…" />
              </div>
              <div class="field">
                <label for="edAcl">additionalContextLimit</label>
                <input class="input" id="edAcl" data-f="additionalContextLimit" value="${esc(ed.additionalContextLimit)}" placeholder="4096" inputmode="numeric" />
              </div>
            </div>
          </div>
        </div>
      </div>` : ''}

      <div class="field">
        <div class="inline">
          <input class="switch" type="checkbox" id="edAsync" data-f="async" ${ed.async ? 'checked' : ''} />
          <label for="edAsync" style="margin:0">Run detached (<code class="cmd">async</code>)</label>
        </div>
        ${perField('async').map((p) => `<div class="warn">${ic('alert', 12)}<span>${esc(p.text)}</span></div>`).join('')}
      </div>

      <!-- Scope: user is the only writable layer, and the others say why. -->
      <div class="field">
        <label for="edScope">Write to</label>
        <div class="select-wrap">
          <select class="select" id="edScope" data-f="scope">
            ${allLayers.map((l) => `<option value="${l.id}" ${l.id === ed.scope ? 'selected' : ''} ${l.writable ? '' : 'disabled'}>
              ${esc(l.label)} — ${esc(l.file)}${l.writable ? '' : ' (read-only)'}</option>`).join('')}
          </select>
          ${ic('chevronDown', 14)}
        </div>
        <div class="hint">${ic('lock', 11)} ${esc(allLayers.filter((l) => !l.writable).length)} of ${allLayers.length} scopes are read-only:
          project and local live in the task worktree, not on the daemon host, and managed or plugin layers are not ours to touch.</div>
      </div>
    </div>

    <div class="dialog-foot">
      <div class="t-caption ${blocking.length ? '' : 'muted'}" style="${blocking.length ? 'color:var(--destructive)' : ''}">
        ${blocking.length
          ? ic('circleAlert', 13) + ' ' + blocking.length + ' problem' + (blocking.length > 1 ? 's' : '') + ' must be fixed before this can be written'
          : problems.length
            ? ic('alert', 13) + ' ' + problems.length + ' warning' + (problems.length > 1 ? 's' : '') + ' — you can still write it'
            : 'Ready to write'}
      </div>
      <span class="spacer"></span>
      <button class="btn" data-close="1">Cancel</button>
      <button class="btn primary" data-review="1" ${blocking.length ? 'disabled' : ''}>${ic('eye', 13)}Review write</button>
    </div>
  </div>`;
}
function comboOpt(e) {
  return `<button class="combo-opt" data-pick="${esc(e)}">
    <span class="mono">${esc(e)}</span>
    ${CODEX_ONLY.includes(e) ? '<span class="badge b-codex">Codex-only</span>' : ''}
    <span class="spacer"></span>
    ${e === ed.event ? ic('check', 13) : ''}
  </button>`;
}

/* Dry-run diff. LOCO-79 documented managers blanking settings.json to {};
   the answer is to show the exact patch and to tag ownership so an
   uninstall can remove precisely what was added. */
function diffDialog() {
  const l = layerMeta(ed.provider, ed.scope);
  const isCodex = ed.provider === 'codex';
  const lines = isCodex ? [
    ['ctx', '{'],
    ['ctx', '  "hooks": {'],
    ['ctx', '    "' + (ed.event || 'PreToolUse') + '": ['],
    ['ctx', '      { "matcher": "shell", "hooks": [ … ] },'],
    ['add', '      {'],
    ['add', '        "matcher": ' + JSON.stringify(ed.matcher || '*') + ','],
    ['add', '        "hooks": [{'],
    ['add', '          "type": "' + ed.type + '",'],
    ['add', '          "command": ' + JSON.stringify(ed.command || '') + ','],
    ['add', '          "timeout": ' + (ed.timeout || 600) + (ed.async ? ',' : '')],
    ['add', ed.async ? '          "async": true' : ''],
    ['add', '        }]'],
    ['add', '      }'],
    ['ctx', '    ]'],
    ['ctx', '  },'],
    ['add', '  "_multica": { "owned": ["' + (ed.id || 'hk_8f21c4') + '"], "writtenAt": "2026-09-11T19:58:00Z" }'],
    ['ctx', '}'],
  ] : [
    ['ctx', '{'],
    ['ctx', '  "permissions": { … },          // untouched'],
    ['ctx', '  "env": { … },                  // untouched'],
    ['ctx', '  "hooks": {'],
    ['ctx', '    "PostToolUse": [ … ],        // untouched'],
    ['ctx', '    "' + (ed.event || 'PreToolUse') + '": ['],
    ...(ed.mode === 'edit' ? [
      ['del', '      { "matcher": "manual", "hooks": [{ "type": "command",'],
      ['del', '        "command": "C:\\\\Users\\\\Marty Kelly\\\\bin\\\\snapshot.sh", "timeout": 30 }] }'],
    ] : []),
    ['add', '      { "matcher": ' + JSON.stringify(ed.matcher || '*') + ', "hooks": [{'],
    ['add', '          "type": "' + ed.type + '",'],
    ['add', '          "command": ' + JSON.stringify(ed.command || '') + ','],
    ['add', '          "timeout": ' + (ed.timeout || 600) + (ed.async ? ', "async": true' : '')],
    ['add', '      }] }'],
    ['ctx', '    ]'],
    ['ctx', '  },'],
    ['add', '  "_multica": { "owned": ["' + (ed.id || 'hk_8f21c4') + '"], "writtenAt": "2026-09-11T19:58:00Z" }'],
    ['ctx', '}'],
  ];

  return `
  <div class="dialog wide" role="dialog" aria-modal="true" aria-labelledby="dfTitle">
    <div class="dialog-head">
      <div>
        <div class="t-title-lg" id="dfTitle">Review write</div>
        <div class="t-caption muted" style="margin-top:2px">Nothing has been written. This is what would change.</div>
      </div>
      <span class="spacer"></span>
      <button class="btn ghost icon" data-close="1" aria-label="Close">${ic('x', 16)}</button>
    </div>
    <div class="dialog-body">
      <div class="inline">
        <span class="badge b-brand">${ic('pencil', 11)}${esc(l.label)}</span>
        <span class="cmd t-caption">${esc(l.file)}</span>
        <span class="spacer"></span>
        <span class="badge">on ${esc(machineOf(rt()).title)}</span>
      </div>
      <div class="diff">
        <div class="diff-head">
          <span class="cmd t-caption">${esc(l.file)}</span>
          <span class="spacer"></span>
          <span class="t-micro faint">${lines.filter((x) => x[0] === 'add' && x[1]).length} added · ${lines.filter((x) => x[0] === 'del').length} removed</span>
        </div>
        <pre>${lines.filter((x) => x[1]).map(([k, v]) => `<span class="ln ${k}">${k === 'add' ? '+' : k === 'del' ? '-' : ' '} ${esc(v)}</span>`).join('')}</pre>
      </div>
      <div class="notice ok t-caption">
        ${ic('shield', 13, 'ico')}
        <div><strong class="semibold">Surgical and ownership-tagged.</strong> Only the highlighted lines are touched; every other key is
        re-serialised byte-for-byte. The <code class="cmd">_multica</code> block records what Multica added so an uninstall can remove exactly
        that and nothing else. The failure mode this guards against is real — a manager blanking <code class="cmd">.claude/settings.json</code> to
        <code class="cmd">{}</code> is a documented incident.</div>
      </div>
      ${ed.provider === 'codex' ? `
      <div class="notice warn t-caption">
        ${ic('key', 13, 'ico')}
        <div><strong class="semibold">This write will un-trust 2 hooks.</strong> Codex records trust against a hook's hash. After this write,
        <code class="cmd">secret-firewall.js</code> and the new entry will not run until they are trusted again with <code class="cmd">/hooks</code>
        on ${esc(machineOf(rt()).title)}. Multica cannot grant trust remotely.</div>
      </div>` : ''}
      <div class="notice warn t-caption">
        ${ic('alert', 13, 'ico')}
        <div><strong class="semibold">No write path exists today.</strong> Multica has no mechanism of any kind for writing a file on a runtime
        host — no RPC, no pending action, no endpoint. This dialog is the sketch of one, not a preview of one that works.</div>
      </div>
    </div>
    <div class="dialog-foot">
      <button class="btn" data-act="copyDiff">${ic('copy', 13)}Copy patch</button>
      <span class="spacer"></span>
      <button class="btn" data-back="editor">Back</button>
      <button class="btn primary" data-act="apply">${ic('check', 13)}Write to ${esc(l.label)} scope</button>
    </div>
  </div>`;
}

/* AlertDialog — destructive confirm, same as mcp-config-tab. */
function deleteDialog() {
  const r = rt();
  const h = hooksOf(r.id).find((x) => x.id === pending);
  if (!h) return '';
  const l = layerMeta(r.provider, h.scope);
  const st = runState(h, r);
  return `
  <div class="dialog narrow" role="alertdialog" aria-modal="true" aria-labelledby="delTitle" aria-describedby="delDesc">
    <div class="dialog-head">
      <div>
        <div class="t-title-lg" id="delTitle">Delete this hook?</div>
        <div class="t-caption muted" style="margin-top:2px">The entry is removed from the file. It is not recoverable from Multica.</div>
      </div>
    </div>
    <div class="dialog-body" id="delDesc">
      <div class="card"><div class="card-body tight">
        <div class="inline"><span class="mono t-label medium">${esc(h.event)}</span>
          <span class="cmd t-caption faint">${h.matcher ? esc(h.matcher) : '*'}</span>
          <span class="badge">${esc(h.type)}</span>
          <span class="badge ${st.cls}">${esc(st.label)}</span></div>
        <div class="cmd t-caption" style="margin-top:6px">${esc(h.command || h.url || h.mcpTool || '')}</div>
        <div class="cmd t-micro faint" style="margin-top:4px">${esc(l.file)}</div>
      </div></div>
      ${h.owner !== 'multica' ? `
      <div class="notice warn t-caption">${ic('alert', 13, 'ico')}
        <div>Multica did not write this entry. Deleting it removes something you or another tool put there.</div></div>` : ''}
      ${r.provider === 'claude' && h._shadowed ? `
      <div class="notice info t-caption">${ic('layers', 13, 'ico')}
        <div>This entry is currently shadowed, so deleting it changes nothing at runtime — until the higher layer that shadows it goes away.</div></div>` : ''}
      ${r.provider === 'claude' && !h._shadowed && hooksOf(r.id).some((x) => x.event === h.event && x._shadowed) ? `
      <div class="notice warn t-caption">${ic('alert', 13, 'ico')}
        <div><strong class="semibold">Deleting this will un-shadow other hooks.</strong> It is the last live <code class="cmd">${esc(h.event)}</code>
        entry in ${esc(l.label)} scope, so the next layer down starts loading — and its hooks begin firing.</div></div>` : ''}
      ${r.provider === 'codex' ? `
      <div class="notice warn t-caption">${ic('key', 13, 'ico')}
        <div>Rewriting this file invalidates the Codex trust hashes in <code class="cmd">[hooks.state]</code>. Remaining hooks in it will need re-trusting.</div></div>` : ''}
      <div class="t-caption muted">Prefer <strong class="semibold">Park</strong> if you only want it to stop running — parking keeps the configuration.</div>
    </div>
    <div class="dialog-foot">
      <button class="btn" data-act="parkInstead">${ic('archive', 13)}Park instead</button>
      <span class="spacer"></span>
      <button class="btn" data-close="1">Cancel</button>
      <button class="btn danger" data-act="confirmDelete">${ic('trash', 13)}Delete hook</button>
    </div>
  </div>`;
}

/* Codex trust. Multica cannot grant trust, so the dialog says so and
   hands over the command instead of faking a button that works. */
function trustDialog() {
  const r = rt();
  const h = hooksOf(r.id).find((x) => x.id === pending);
  if (!h) return '';
  return `
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="trTitle">
    <div class="dialog-head">
      <div>
        <div class="t-title-lg" id="trTitle">Re-trust this Codex hook</div>
        <div class="t-caption muted" style="margin-top:2px">It has not run since it was edited.</div>
      </div>
      <span class="spacer"></span>
      <button class="btn ghost icon" data-close="1" aria-label="Close">${ic('x', 16)}</button>
    </div>
    <div class="dialog-body">
      <div class="card"><div class="card-body tight">
        <div class="inline"><span class="mono t-label medium">${esc(h.event)}</span>
          <span class="cmd t-caption faint">${h.matcher ? esc(h.matcher) : '*'}</span>
          <span class="badge b-bad">${ic('key', 11)}not trusted</span></div>
        <div class="cmd t-caption" style="margin-top:6px">${esc(h.command || '')}</div>
        <dl class="kv" style="margin-top:10px">
          <dt>Trusted hash</dt><dd class="cmd">${esc(h.trustedHash || '')}</dd>
          <dt>Current hash</dt><dd class="cmd" style="color:var(--destructive)">${esc(h.currentHash || '')}</dd>
          <dt>Edited</dt><dd>${esc(h.editedAt || '')}</dd>
          <dt>Fires missed</dt><dd>7 since the edit</dd>
        </dl>
      </div></div>
      <div class="notice bad t-caption">
        ${ic('circleAlert', 13, 'ico')}
        <div><strong class="semibold">This is what makes a Codex hooks manager awkward.</strong> Codex only runs a hook while its hash matches
        <code class="cmd">[hooks.state].trusted_hash</code> in <code class="cmd">~/.codex/config.toml</code>. Any edit — including one Multica
        makes on your behalf — breaks the match, and Codex then skips the hook without saying anything. Writing Codex hooks from a web app
        therefore breaks them by definition, and re-trust has to be part of the flow rather than an afterthought.</div>
      </div>
      <div class="field">
        <label>Run this on ${esc(machineOf(r).title)}</label>
        <div class="diff"><pre><span class="ln ctx">codex</span><span class="ln ctx">&gt; /hooks        # review the diff, then trust</span></pre></div>
        <div class="hint">Trust is granted interactively, by a human, in a Codex session on the host. There is no non-interactive flag except
        <code class="cmd">--dangerously-bypass-hook-trust</code>, which skips trust for a single run and is not a fix.</div>
      </div>
      <div class="notice warn t-caption">
        ${ic('alert', 13, 'ico')}
        <div><strong class="semibold">Not built yet.</strong> "Request trust on host" below assumes a notification path to the machine owner
        that does not exist. The honest v1 is the copyable command above.</div>
      </div>
    </div>
    <div class="dialog-foot">
      <button class="btn" data-act="copyTrust">${ic('copy', 13)}Copy command</button>
      <span class="spacer"></span>
      <button class="btn" data-close="1">Close</button>
      <button class="btn primary" data-act="requestTrust">${ic('key', 13)}Request trust on host</button>
    </div>
  </div>`;
}

/* The "enabled toggle" answer, spelled out at the point of use. */
function parkDialog() {
  const r = rt();
  const h = hooksOf(r.id).find((x) => x.id === pending);
  if (!h) return '';
  const c = PARK_COPY[r.provider];
  const parking = !h.parked;
  return `
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="pkTitle">
    <div class="dialog-head">
      <div>
        <div class="t-title-lg" id="pkTitle">${parking ? 'Park' : 'Unpark'} this hook</div>
        <div class="t-caption muted" style="margin-top:2px">Neither provider has a per-hook disable, so this is worth reading once.</div>
      </div>
      <span class="spacer"></span>
      <button class="btn ghost icon" data-close="1" aria-label="Close">${ic('x', 16)}</button>
    </div>
    <div class="dialog-body">
      <div class="card"><div class="card-body tight">
        <div class="inline"><span class="mono t-label medium">${esc(h.event)}</span>
          <span class="cmd t-caption faint">${h.matcher ? esc(h.matcher) : '*'}</span></div>
        <div class="cmd t-caption" style="margin-top:6px">${esc(h.command || h.url || h.mcpTool || '')}</div>
      </div></div>
      <div class="notice info t-caption">
        ${ic('archive', 13, 'ico')}
        <div><strong class="semibold">What the switch does.</strong> ${c.what} ${c.why}</div>
      </div>
      <div class="notice warn t-caption">
        ${ic('alert', 13, 'ico')}
        <div><strong class="semibold">What it is not.</strong> ${c.caveat}</div>
      </div>
      <div class="t-caption muted">
        The alternative approaches both leak: renaming the script and leaving a stub still spawns a process on every matching event, and a
        plain on/off switch that silently deletes the entry loses the configuration. Parking is the only option that stops the process
        <em>and</em> keeps the hook — so that is what the switch does, and the label says <strong class="semibold">parked</strong> rather than
        <strong class="semibold">disabled</strong> because "disabled" would imply a provider feature that does not exist.
      </div>
    </div>
    <div class="dialog-foot">
      <span class="spacer"></span>
      <button class="btn" data-close="1">Cancel</button>
      <button class="btn primary" data-act="confirmPark">${ic('archive', 13)}${parking ? 'Park hook' : 'Unpark hook'}</button>
    </div>
  </div>`;
}
</script>

<script>
/* ==================================================================== *
 * RENDER + WIRING
 * ==================================================================== */
function renderModal() {
  const o = document.getElementById('overlay');
  if (!modal) { o.hidden = true; o.innerHTML = ''; return; }
  o.hidden = false;
  o.innerHTML = modal === 'editor' ? editorDialog()
    : modal === 'diff' ? diffDialog()
    : modal === 'delete' ? deleteDialog()
    : modal === 'trust' ? trustDialog()
    : modal === 'park' ? parkDialog() : '';
  const first = o.querySelector('input, select, button');
  if (first) first.focus();
}
function closeModal() { modal = null; pending = null; renderModal(); }

function render() {
  renderHeader();
  renderTabs();
  const body = state.screen === 'hooks' ? screenHooks()
    : state.screen === 'precedence' ? screenPrecedence()
    : state.screen === 'log' ? screenLog()
    : state.screen === 'gallery' ? screenGallery()
    : screenStates();
  document.getElementById('screen').innerHTML = body;
}

function toast(msg, kind) {
  const el = document.createElement('div');
  el.className = 'toast t-caption';
  const icon = kind === 'error' ? 'circleAlert' : kind === 'warn' ? 'alert' : 'checkCircle';
  const color = kind === 'error' ? 'var(--destructive)' : kind === 'warn' ? 'var(--warning)' : 'var(--success)';
  el.innerHTML = `<span class="ico" style="color:${color}">${ic(icon, 15)}</span><div>${msg}</div>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 6000);
}

/* Nothing here mutates a runtime. Every "write" action reports what it
   would have done, so the sketch cannot be mistaken for a working build. */
function wouldWrite(what) {
  toast('<strong class="semibold">Preview only — nothing was written.</strong><br>' + what +
    '<br><span class="muted">Multica has no write path to a runtime host yet.</span>', 'warn');
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-screen],[data-toggle-event],[data-add],[data-edit],[data-del],[data-retrust],[data-park],[data-close],[data-review],[data-back],[data-act],[data-log],[data-demo],[data-install],[data-src],[data-pick]');
  if (!t) {
    if (ed && ed.comboOpen && !e.target.closest('.combo')) { ed.comboOpen = false; renderModal(); }
    return;
  }
  const d = t.dataset;

  if (d.screen)        { state.screen = d.screen; render(); document.getElementById('scroll').scrollTop = 0; return; }
  if (d.toggleEvent)   { state.collapsed[d.toggleEvent] = !state.collapsed[d.toggleEvent]; render(); return; }
  if (d.add)           { openEditor(null); return; }
  if (d.edit)          { openEditor(d.edit); return; }
  if (d.del)           { pending = d.del; modal = 'delete'; renderModal(); return; }
  if (d.retrust)       { pending = d.retrust; modal = 'trust'; renderModal(); return; }
  if (d.park)          { e.preventDefault(); pending = d.park; modal = 'park'; renderModal(); return; }
  if (d.close)         { closeModal(); return; }
  if (d.review)        { modal = 'diff'; renderModal(); return; }
  if (d.back)          { modal = d.back; renderModal(); return; }
  if (d.log)           { state.logFilter = d.log; render(); return; }
  if (d.demo)          { state.stateDemo = d.demo; render(); return; }
  if (d.pick)          { ed.event = d.pick; ed.comboOpen = false; ed.comboQuery = ''; renderModal(); return; }

  if (d.install) {
    const g = GALLERY.find((x) => x.id === d.install);
    wouldWrite('Would install <strong class="semibold">' + esc(g.name) + '</strong> — copy the hook script to the host and add a <span class="mono">' +
      esc(g.event.split(' ')[0]) + '</span> entry to ' + esc(layersOf(rt().provider).find((l) => l.writable).file) + '.');
    return;
  }
  if (d.src) {
    const g = GALLERY.find((x) => x.id === d.src);
    toast('Source: <span class="mono">' + esc(g.src) + '</span><br><span class="muted">A real build would link out to the repo.</span>');
    return;
  }

  switch (d.act) {
    case 'rescan':
      state.screen = 'states'; state.stateDemo = 'discovery'; state.discoveryStep = 0; render();
      toast('Discovery queued for the next daemon heartbeat.');
      break;
    case 'stepDiscovery':
      state.discoveryStep = (state.discoveryStep + 1) % (DISCOVERY_STEPS.length + 1); render();
      if (state.discoveryStep === DISCOVERY_STEPS.length) toast('Read 16 hooks across 4 files on cc-claudesp.');
      break;
    case 'viewCached':
      toast('Would show the 2026-09-09 cached read, labelled stale and read-only.', 'warn');
      break;
    case 'copyDiff':
      toast('Patch copied.'); break;
    case 'copyTrust':
      toast('<span class="mono">codex</span> then <span class="mono">/hooks</span> copied.'); break;
    case 'apply':
      closeModal();
      wouldWrite('Would write the reviewed patch to <span class="mono">' + esc(layerMeta(rt().provider, ed.scope).file) + '</span> on ' + esc(machineOf(rt()).title) + '.');
      break;
    case 'confirmDelete': {
      const h = hooksOf(rt().id).find((x) => x.id === pending);
      closeModal();
      wouldWrite('Would remove the <span class="mono">' + esc(h.event) + '</span> entry from <span class="mono">' + esc(layerMeta(rt().provider, h.scope).file) + '</span>.');
      break;
    }
    case 'parkInstead':
      modal = 'park'; renderModal(); break;
    case 'confirmPark': {
      const h = hooksOf(rt().id).find((x) => x.id === pending);
      const parking = !h.parked;
      closeModal();
      wouldWrite('Would ' + (parking ? 'move' : 'restore') + ' the entry ' + (parking ? 'into' : 'out of') +
        ' <span class="mono">_disabledHooks</span> in <span class="mono">' + esc(layerMeta(rt().provider, h.scope).file) + '</span>.');
      break;
    }
    case 'requestTrust':
      closeModal();
      wouldWrite('Would notify the owner of cc-claudesp to run <span class="mono">/hooks</span> and trust the new hash.');
      break;
  }
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'rtSel') {
    state.runtimeId = e.target.value;
    state.collapsed = {}; state.query = '';
    if (rt().status === 'offline' && state.screen === 'log') state.screen = 'hooks';
    render();
    return;
  }
  if (e.target.dataset.f && ed) {
    const f = e.target.dataset.f;
    ed[f] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
    ed.dirty = true;
    renderModal();
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'hookSearch') {
    state.query = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = document.getElementById('hookSearch');
    if (el) { el.focus(); el.setSelectionRange(pos, pos); }
    return;
  }
  if (e.target.dataset.combo && ed) {
    ed.comboQuery = e.target.value; ed.comboOpen = true;
    const pos = e.target.selectionStart;
    renderModal();
    const el = document.getElementById('edEvent');
    if (el) { el.focus(); el.setSelectionRange(pos, pos); }
    return;
  }
  if (e.target.dataset.f && ed && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') {
    const f = e.target.dataset.f, pos = e.target.selectionStart, id = e.target.id;
    ed[f] = e.target.value; ed.dirty = true;
    renderModal();
    const el = document.getElementById(id);
    if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (_) {} }
  }
});

document.addEventListener('focusin', (e) => {
  if (e.target.dataset.combo && ed && !ed.comboOpen) { ed.comboOpen = true; ed.comboQuery = ''; renderModal(); }
});

/* Keyboard: Escape closes the topmost surface, and the tab bar is
   arrow-navigable like a real Tabs primitive. */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (ed && ed.comboOpen) { ed.comboOpen = false; renderModal(); return; }
    if (modal === 'diff') { modal = 'editor'; renderModal(); return; }
    if (modal) { closeModal(); return; }
  }
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && e.target.classList.contains('tab')) {
    const i = SCREENS.findIndex((s) => s.id === state.screen);
    const n = (i + (e.key === 'ArrowRight' ? 1 : SCREENS.length - 1)) % SCREENS.length;
    state.screen = SCREENS[n].id; render();
    const tabs = document.querySelectorAll('.tab');
    if (tabs[n]) tabs[n].focus();
    e.preventDefault();
  }
});

document.getElementById('themeToggle').addEventListener('click', () => {
  document.documentElement.classList.toggle('dark');
});

/* Clicking the overlay backdrop dismisses a Dialog but not an AlertDialog,
   which is the shadcn default and the right behaviour for a destructive
   confirm. */
document.getElementById('overlay').addEventListener('mousedown', (e) => {
  if (e.target.id === 'overlay' && modal !== 'delete') closeModal();
});

render();
</script>
</body>
</html>
