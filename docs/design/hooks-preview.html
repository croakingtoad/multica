    <td>
      <span class="cmd matcher">${h.matcher ? esc(h.matcher) : '<span class="faint">* (all)</span>'}</span>
      ${mi.kind === 'ignored' ? `<div class="t-micro" style="color:var(--destructive);margin-top:2px">${ic('alert', 10)} ignored on ${esc(h.event)}</div>`
        : mi.kind === 'regex' ? `<div class="t-micro" style="color:var(--warning);margin-top:2px">${ic('alert', 10)} regex${(h.matcher || '').startsWith('^') && (h.matcher || '').endsWith('$') ? ', anchored' : ', unanchored'}</div>`
        : ''}
    </td>
    <td>
      <span class="badge ${types && !types.effective ? 'b-bad' : ''}">${esc(h.type)}</span>
      ${h.async ? `<div class="t-micro faint" style="margin-top:2px">async</div>` : ''}
      ${types && !types.effective ? `<div class="t-micro" style="color:var(--destructive);margin-top:2px">never runs on Codex</div>` : ''}
    </td>
    <td>
      <div class="cmd">${esc(target)}</div>
      ${h.commandWindows ? `<div class="t-micro faint" style="margin-top:3px">${ic('info', 10)} commandWindows: <span class="cmd">${esc(h.commandWindows)}</span></div>` : ''}
      ${h.statusMessage ? `<div class="t-micro faint" style="margin-top:2px">statusMessage: “${esc(h.statusMessage)}”</div>` : ''}
      ${h.additionalContextLimit ? (CODEX_ADDCTX_EVENTS.includes(h.event)
        ? `<div class="t-micro faint" style="margin-top:2px">additionalContextLimit: ${h.additionalContextLimit}</div>`
        : `<div class="t-micro" style="color:var(--warning);margin-top:3px">${ic('alert', 10)} <span class="cmd">additionalContextLimit: ${h.additionalContextLimit}</span> is inert on <span class="cmd">${esc(h.event)}</span> — the event produces no <span class="cmd">additionalContext</span>, so Codex ignores the limit and logs a configuration warning.</div>`) : ''}
      ${cmdIssue ? `<div class="t-micro" style="color:var(--${cmdIssue.level === 'error' ? 'destructive' : 'warning'});margin-top:3px">${ic('alert', 10)} ${esc(cmdIssue.text.split('.')[0])}.</div>` : ''}
      ${h.stopBlock ? `<div class="t-micro" style="color:var(--warning);margin-top:3px">${ic('alert', 10)} Emits <span class="cmd">decision:"block"</span> on <span class="cmd">Stop</span> — that <strong>continues</strong> the turn, it does not reject it. ${r.provider === 'codex' ? 'Codex turns the <span class="cmd">reason</span> into a new continuation prompt.' : 'Claude takes the <span class="cmd">reason</span> as why it should continue.'}</div>` : ''}
      ${h.stopFeedback ? `<div class="t-micro faint" style="margin-top:3px">${ic('info', 10)} Continues the turn with <span class="cmd">hookSpecificOutput.additionalContext</span> instead of <span class="cmd">decision:"block"</span> — same continuation, no hook error, transcript reads <em>Stop hook feedback</em>. Claude-only on this event.</div>` : ''}
      ${h.ifOnNonToolEvent ? `<div class="t-micro" style="color:var(--destructive);margin-top:3px">${ic('alert', 10)} <span class="cmd">if</span> is only evaluated on tool events. On <span class="cmd">${esc(h.event)}</span> this handler never runs.</div>` : ''}
      ${h.if && !h.ifOnNonToolEvent ? `<div class="t-micro faint" style="margin-top:2px">if: <span class="cmd">${esc(h.if)}</span> — pre-filter, so the process only spawns on a match</div>` : ''}
      ${h._dupOf ? `<div class="t-micro" style="margin-top:3px">${ic('copy', 10)} Identical to the ${esc(layerMeta(r.provider, h._dupOf.scope).label)} entry — Claude spawns it once.</div>` : ''}
      ${h._dupWith ? `<div class="t-micro faint" style="margin-top:2px">${ic('copy', 10)} Also defined in ${esc(layerMeta(r.provider, h._dupWith.scope).label)}; the pair runs once.</div>` : ''}
      <div class="t-micro faint" style="margin-top:3px">timeout ${h.timeout != null ? h.timeout + 's' : 'default'}${h.shell ? ' · ' + esc(h.shell) : ''}</div>
    </td>
    <td>
      <div class="inline">
        <span class="badge ${lm.writable ? 'b-brand' : ''}">${lm.writable ? '' : ic('lock', 10)}${esc(lm.label)}</span>
      </div>
      <div class="cmd t-micro faint" style="margin-top:3px">${esc(lm.file)}</div>
      ${h.owner === 'multica' ? `<div class="t-micro" style="margin-top:2px;color:var(--brand)">${ic('check', 10)} written by Multica</div>`
        : h.owner === 'managed' ? `<div class="t-micro faint" style="margin-top:2px">org policy</div>`
        : h.owner === 'plugin' ? `<div class="t-micro faint" style="margin-top:2px">plugin-bundled</div>`
        : `<div class="t-micro faint" style="margin-top:2px">not written by Multica</div>`}
    </td>
    <td>
      <div class="inline">
        <span class="badge ${st.cls}">${ic(st.icon, 11)}${esc(st.label)}</span>
        ${h.trust === 'stale' || h.trust === 'review' ? `<button class="btn xs" data-retrust="${h.id}">${ic('key', 11)}${h.trust === 'review' ? 'Review' : 'Re-trust'}</button>` : ''}
      </div>
      <div class="t-micro faint" style="margin-top:3px">${esc(st.why)}</div>
    </td>
    <td class="nowrap">
      <div class="inline" style="gap:2px">
        ${(() => {
          /* The switch means "is this registered to run", and the word for
             turning it off is provider-specific on purpose: Codex has a
             real per-hook disable, Claude has none. `disabledNative` is
             Codex's own off-state; `parked` is Multica's Claude-only one. */
          const off = !!(h.parked || h.disabledNative);
          const verb = r.provider === 'codex' ? 'Disable' : 'Park';
          const onVerb = r.provider === 'codex' ? 'Re-enable' : 'Unpark';
          const mine = lm.writable && h.owner !== 'managed' && h.owner !== 'plugin';
          return `
        <label class="sr" for="park-${h.id}">${off ? onVerb : verb} this hook</label>
        <input class="switch" type="checkbox" id="park-${h.id}" ${off ? '' : 'checked'} ${mine ? '' : 'disabled'} data-park="${h.id}"
          title="${mine ? (off ? onVerb + ' this hook' : 'Registered — click to ' + verb.toLowerCase()) : 'Read-only source: Multica cannot change this file'}" />`;
        })()}
        <button class="btn ghost icon" data-edit="${h.id}" title="Edit" ${lm.writable ? '' : 'disabled'}>${ic('pencil', 14)}</button>
        <button class="btn ghost icon" data-del="${h.id}" title="Delete" ${lm.writable ? '' : 'disabled'}>${ic('trash', 14)}</button>
      </div>
    </td>
  </tr>`;
}
const ordinal = (n) => n + (['th','st','nd','rd'][(n % 100 > 10 && n % 100 < 14) ? 0 : Math.min(n % 10, 4)] || 'th');

function trustBanner(stale) {
  return `
  <div class="notice bad t-label">
    ${ic('key', 15, 'ico')}
    <div>
      <strong class="semibold">${stale.length} Codex hook${stale.length > 1 ? 's are' : ' is'} edited but not trusted — ${stale.length > 1 ? 'they are' : 'it is'} not running.</strong>
      Codex records trust against the hook's hash in <code class="cmd">[hooks.state]</code>. Any edit — including one Multica makes — invalidates it,
      and Codex marks the hook for review and skips it until the new hash is trusted. Startup is not silent: Codex prints a warning telling you to open <code class="cmd">/hooks</code>.
      <div style="margin-top:6px">${stale.map((h) => `<button class="btn sm" data-retrust="${h.id}">${ic('key', 13)}Re-trust ${esc((h.command || '').split('/').pop())}</button>`).join(' ')}</div>
    </div>
  </div>`;
}

function railCards(r, hooks) {
  const layers = layersOf(r.provider);
  const counts = {};
  hooks.forEach((h) => { counts[h.scope] = (counts[h.scope] || 0) + 1; });
  const running = hooks.filter((h) => runState(h, r).runs).length;
  const parked = hooks.filter((h) => h.parked || h.disabledNative).length;
  const deduped = hooks.filter((h) => h._dupOf).length;
  const broken = hooks.filter((h) => h.broken || h.ineffective || h.ifOnNonToolEvent || h.trust === 'stale' || h.trust === 'review').length;
  const busiest = hooks.reduce((a, h) => (h._fires > (a._fires || 0) ? h : a), {});

  return `
  <div class="card">
    <div class="card-head"><span class="t-label medium">${ic('activity', 14)} This runtime</span></div>
    <div class="card-body tight">
      <dl class="kv">
        <dt>Running</dt><dd><span class="badge b-ok">${running}</span></dd>
        <dt>${r.provider === 'claude' ? 'Parked' : 'Switched off'}</dt><dd><span class="badge">${parked}</span></dd>
        ${r.provider === 'claude'
          ? `<dt>Collapsed</dt><dd><span class="badge">${deduped}</span></dd>`
          : `<dt>Collapsed</dt><dd><span class="badge b-dim">n/a on Codex</span></dd>`}
        <dt>Not working</dt><dd><span class="badge ${broken ? 'b-bad' : ''}">${broken}</span></dd>
      </dl>
      <hr class="sep" style="margin:10px 0" />
      <div class="t-caption muted">Configured ${hooks.length} · across ${new Set(hooks.map((h) => h.scope)).size} files · ${new Set(hooks.map((h) => h.event)).size} events</div>
      ${busiest.event ? `<div class="t-caption" style="margin-top:6px;color:var(--warning)">${ic('alert', 11)} Busiest event: <code class="cmd">${esc(busiest.event)}</code> fires <strong class="semibold">${busiest._fires} handlers</strong> every time it occurs.</div>` : ''}
    </div>
  </div>

  <div class="card">
    <div class="card-head"><span class="t-label medium">${ic('layers', 14)} Scopes</span>
      <span class="spacer"></span><button class="btn xs" data-screen="precedence">Detail</button></div>
    <div class="card-body tight">
      <div class="stack">
      ${layers.map((l) => `
        <div class="inline t-caption" style="gap:6px">
          <span class="badge ${l.writable ? 'b-brand' : ''}" style="min-width:64px;justify-content:center">${l.writable ? ic('pencil', 10) : ic('lock', 10)}${esc(l.label)}</span>
          <span class="cmd t-micro faint" style="flex:1;min-width:0">${esc(l.file)}</span>
          <span class="badge b-dim">${counts[l.id] || 0}</span>
        </div>`).join('')}
      </div>
      <hr class="sep" style="margin:10px 0" />
      <div class="t-caption muted">Only <strong class="semibold">${esc([...new Set(layers.filter((l) => l.writable).map((l) => l.label))].join(' / '))}</strong> scope is on the daemon host, so it is the only one Multica could write. Everything else is read-only here.</div>
    </div>
  </div>

  <div class="card" style="border-color:color-mix(in oklab, var(--warning) 30%, var(--border))">
    <div class="card-head" style="background:color-mix(in oklab, var(--warning) 8%, transparent)">
      <span class="t-label medium">${ic('alert', 14)} Not built yet</span>
    </div>
    <div class="card-body tight">
      <div class="t-caption muted stack">
        <div>This screen shows five things Multica cannot do today. They are sketched so Marty can react to them, not because they exist.</div>
        <div>${ic('x', 11)} <strong class="semibold">Reading</strong> a hooks file — discovery only covers fixed skill and MCP paths.</div>
        <div>${ic('x', 11)} <strong class="semibold">Writing</strong> any file on a runtime host — no write path exists at all.</div>
        <div>${ic('x', 11)} <strong class="semibold">${r.provider === 'claude' ? 'Parking' : 'Disabling'}</strong> — ${r.provider === 'claude'
          ? 'Multica\u2019s own invention. Claude has no per-hook disable at all, so there is no feature to drive.'
          : 'Codex <em>does</em> have a per-hook disable, but Multica has no way to reach its hook-state store on the host.'}</div>
        <div>${ic('x', 11)} <strong class="semibold">Re-trusting</strong> a Codex hook — trust is granted by an interactive CLI on the host.</div>
        <div>${ic('x', 11)} <strong class="semibold">Ownership-tagging</strong> a write — the <code class="cmd">_multica</code> block in the dry-run diff has no store behind it. No per-runtime settings table exists, and <code class="cmd">agent_runtime.metadata</code> is system-owned and on the hot claim path.</div>
      </div>
    </div>
  </div>`;
}
</script>

<script>
/* ==================================================================== *
 * SCREEN 2 — WHAT ACTUALLY RUNS
 *
 * Rebuilt after the override model turned out to be wrong. Hook entries
 * MERGE on BOTH providers — no entry is ever displaced by a higher layer,
 * so there is no "wins" column and nothing is struck through. Previous
 * revisions of this file rendered Claude as an override model; that was a
 * factual error and it is gone.
 *
 * With precedence identical, the two-screen split lost its reason to
 * exist, so it is collapsed: ONE layout, one merge model, and
 * provider-specific columns only where the facts genuinely diverge
 * (Claude dedup vs Codex trust + native per-hook disable).
 *
 * The valuable thing merging leaves behind is ACCUMULATION: handlers pile
 * up across files nobody routinely opens, and neither CLI shows you the
 * total. That is what this screen is for.
 * ==================================================================== */
function screenPrecedence() {
  const r = rt();
  if (r.status === 'offline') return offlineBody(r);
  const byEvent = resolve(r);
  const hooks = hooksOf(r.id);
  if (!hooks.length) return emptyBody(r);

  return `
  <div class="two-col">
    <div class="col-main">
      ${runtimePicker()}
      ${behaviorStrip(r.provider)}
      ${mergeNotice(r)}
      ${accumulationTable(r, byEvent)}
      ${killSwitchCard(r, hooks)}
      ${layerStack(r)}
      ${scopeLegend(r)}
    </div>
    <div class="col-rail">${precedenceRail(r)}</div>
  </div>`;
}

/* The correction, stated on the screen rather than assumed. It quotes the
   source because this is exactly the claim a previous revision got wrong,
   and a reader deserves to check it. */
function mergeNotice(r) {
  return `
  <div class="notice info t-label">
    ${ic('info', 15, 'ico')}
    <div>
      <strong class="semibold">There is no “wins” column on this screen, because nothing wins — on either provider.</strong>
      Every layer contributes and every contribution runs. Nothing here is shadowed, overridden or displaced by a
      higher-precedence file. The generic settings rule — “the highest level that sets a key wins” — is real for
      scalar keys like <code class="cmd">model</code>, and <code class="cmd">hooks</code> is an explicit exception to it.
      <div class="t-caption muted" style="margin-top:6px">
        ${r.provider === 'claude'
          ? 'Claude Code docs, verbatim: “Hook entries merge across settings levels rather than replacing each other: user, project, and local settings add their own hooks without removing managed ones.”'
          : 'Codex docs, verbatim: “If more than one hook source exists, Codex loads all matching hooks. Higher-precedence config layers don’t replace lower-precedence hooks.”'}
      </div>
    </div>
  </div>`;
}

/* The accumulation view. One row per event, ordered by how many handlers
   pile onto it, because that is the number that hurts. */
function accumulationTable(r, byEvent) {
  const events = Object.keys(byEvent).sort((a, b) => {
    const d = (byEvent[b].filter((h) => runState(h, r).runs).length) - (byEvent[a].filter((h) => runState(h, r).runs).length);
    if (d) return d;
    const order = r.provider === 'claude' ? CLAUDE_EVENTS : CODEX_EVENTS;
    return order.indexOf(a) - order.indexOf(b);
  });
  const totalFiring = hooksOf(r.id).filter((h) => runState(h, r).runs).length;
  const piled = events.filter((ev) => byEvent[ev].filter((h) => runState(h, r).runs).length > 1);
  const layerOrder = layersOf(r.provider).map((l) => l.id);

  return `
  <div class="card">
    <div class="card-head">
      <span class="t-label medium">${ic('shield', 14)} Everything that runs, from everywhere</span>
      <span class="badge ${r.provider === 'claude' ? 'b-claude' : 'b-codex'}">merge model</span>
      <span class="spacer"></span>
      <span class="t-caption muted">${totalFiring} handler${totalFiring === 1 ? '' : 's'} live · ${piled.length} of ${events.length} events fire more than one</span>
    </div>
    <table class="tbl">
      <thead><tr>
        <th style="width:19%">Event</th>
        <th style="width:13%">Per fire</th>
        <th style="width:27%">Contributed by</th>
        <th>What actually executes</th>
      </tr></thead>
      <tbody>
      ${events.map((ev) => {
        const g = byEvent[ev];
        const firing = g.filter((h) => runState(h, r).runs);
        const idle = g.filter((h) => !runState(h, r).runs);
        const scopes = layerOrder.filter((sc) => g.some((h) => h.scope === sc));
        return `<tr>
          <td>
            <span class="mono t-label">${esc(ev)}</span>
            ${CODEX_ONLY.includes(ev) ? '<div style="margin-top:3px"><span class="badge b-codex">Codex-only</span></div>' : ''}
          </td>
          <td>
            <span class="badge ${firing.length > 2 ? 'b-warn' : firing.length ? 'b-ok' : 'b-dim'}">${firing.length} handler${firing.length === 1 ? '' : 's'}</span>
            <div class="t-micro faint" style="margin-top:3px">${firing.length > 1 ? (r.provider === 'claude' ? 'in parallel' : 'all of them') : firing.length ? 'one process' : 'nothing fires'}</div>
          </td>
          <td><div class="cellflex">${scopes.map((sc) => {
            const n = g.filter((h) => h.scope === sc).length;
            return `<span class="badge ${sc === 'managed' ? 'b-warn' : 'b-dim'}">${esc(layerMeta(r.provider, sc).label)}${n > 1 ? ' ×' + n : ''}</span>`;
          }).join('')}</div>
          <div class="t-micro faint" style="margin-top:3px">${scopes.length} file${scopes.length === 1 ? '' : 's'}</div></td>
          <td>
            ${firing.map((h) => `<div class="cmd t-micro" style="margin-top:2px">${ic('check', 10)} ${esc(handlerLabel(h))}<span class="faint"> · ${esc(layerMeta(r.provider, h.scope).label)}</span></div>`).join('')}
            ${idle.map((h) => `<div class="t-micro" style="margin-top:2px;opacity:.7"><span class="badge ${runState(h, r).cls}" style="padding:0 4px">${esc(runState(h, r).label)}</span> <span class="cmd faint">${esc(handlerLabel(h))}</span><span class="faint"> · ${esc(layerMeta(r.provider, h.scope).label)}</span></div>`).join('')}
          </td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>
    <div class="card-body tight" style="border-top:1px solid var(--border)">
      <div class="t-caption muted"><strong class="semibold">The trap is accumulation, not shadowing.</strong>
      Because every layer merges and ${r.provider === 'claude'
        ? 'Claude has no way to switch off one hook'
        : 'a hook only stops when someone remembers to disable it'},
      the pile only grows. <code class="cmd">${esc(events[0] || 'PreToolUse')}</code> here spawns
      <strong class="semibold">${byEvent[events[0]] ? byEvent[events[0]].filter((h) => runState(h, r).runs).length : 0} processes</strong>
      on every occurrence, from ${byEvent[events[0]] ? new Set(byEvent[events[0]].map((h) => h.scope)).size : 0} different files — and nothing in the CLI
      adds that up for you. ${r.provider === 'claude'
        ? 'The one thing that does <em>not</em> accumulate is a byte-identical handler in two settings files: Claude collapses the pair and runs it once. A plugin’s or skill’s copy of the same handler stays separate and really does run twice.'
        : 'Codex documents no deduplication, so two identical entries in two files are two processes.'}
      </div>
      <div class="t-caption muted" style="margin-top:6px">${ic('info', 11)} Neither provider documents a run <em>sequence</em>
      — Claude states matching hooks run in parallel, and Codex says matching command hooks are launched concurrently. Both describe
      concurrency, neither an order, so nothing on this screen is numbered — an invented order would be the next thing to be wrong about.</div>
    </div>
  </div>`;
}

/* Kill switches — the only mechanism on either provider that resembles
   precedence, and it is global rather than per-entry. Rendered as live
   what-if toggles so the blast radius is visible instead of described.

   The Claude-side caption names allowedHttpHookUrls and httpHookAllowedEnvVars.
   Both are documented, and so is the merge-across-levels and every-source
   behaviour the caption asserts: "The HTTP hook allowlists apply to hooks from
   every source, including managed policy settings" — see the fuller quote at
   the c12 seed entry. — https://code.claude.com/docs/en/hooks#hook-locations

   httpHookAllowedEnvVars is an OUTER BOUND, not a substitute for a hook's own
   list: "a hook can use a variable only if both its own allowedEnvVars and this
   key name it", and unset means "each hook's own allowedEnvVars list applies".
   The caption above does not claim otherwise, so it needs no change — but if this
   sketch ever renders a hook's own allowedEnvVars, both lists have to be shown as
   an intersection rather than either one alone.
   — https://code.claude.com/docs/en/settings-reference#httphookallowedenvvars */
function killSwitchCard(r, hooks) {
  const prov = r.provider;
  const names = prov === 'claude'
    ? { all: 'disableAllHooks', only: 'allowManagedHooksOnly',
        allWhere: 'any settings file · read after settings precedence resolves',
        onlyWhere: 'managed settings only',
        allNote: 'Claude reads the value left after precedence, so a <code class="cmd">false</code> in a project’s <code class="cmd">.claude/settings.json</code> beats a <code class="cmd">true</code> in your user settings. It cannot disable managed hooks unless it is set at the managed level. <code class="cmd">--settings ’{"disableAllHooks": true}’</code> turns them off for one run.',
        onlyNote: 'Enterprise switch. Blocks your user, project, local and plugin hooks outright; plugins force-enabled via managed <code class="cmd">enabledPlugins</code> are exempt. It also narrows <code class="cmd">statusLine</code> and <code class="cmd">fileSuggestion</code> to managed settings.' }
    : { all: '[features].hooks = false', only: 'allow_managed_hooks_only = true',
        allWhere: 'config.toml · or forced in requirements.toml',
        onlyWhere: 'requirements.toml',
        allNote: 'Turns hooks off session-wide. An admin can force them back on by pinning <code class="cmd">[features].hooks = true</code> in <code class="cmd">requirements.toml</code>. <code class="cmd">codex_hooks</code> is a deprecated alias for the same key.',
        onlyNote: 'Skips user, project, session and plugin hooks while still loading managed hooks from <code class="cmd">requirements.toml</code> and other managed layers.' };

  const killedAll = hooks.filter((h) => h._killed === 'all').length;
  const killedOnly = hooks.filter((h) => h._killed === 'managedOnly').length;
  const survivors = hooks.filter((h) => runState(h, r).runs).length;

  return `
  <div class="card">
    <div class="card-head">
      <span class="t-label medium">${ic('ban', 14)} Kill switches</span>
      <span class="spacer"></span>
      <span class="t-caption muted">Global, never per-entry. This is the closest thing to precedence that actually exists.</span>
    </div>
    <div class="card-body">
      <div class="stack" style="gap:12px">
        <div class="inline" style="align-items:flex-start;gap:10px">
          <button class="switch ${state.killAll ? 'on' : ''}" role="switch" aria-checked="${state.killAll}" data-act="toggleKillAll" aria-label="Preview ${esc(names.all)}"><span></span></button>
          <div style="min-width:0">
            <div class="inline"><code class="cmd">${esc(names.all)}</code>
              ${state.killAll ? `<span class="badge b-warn">${killedAll} hooks off</span>` : ''}</div>
            <div class="t-caption faint" style="margin-top:2px">${esc(names.allWhere)}</div>
            <div class="t-caption muted" style="margin-top:4px">${names.allNote}</div>
          </div>
        </div>
        <hr class="sep" />
        <div class="inline" style="align-items:flex-start;gap:10px">
          <button class="switch ${state.killManagedOnly ? 'on' : ''}" role="switch" aria-checked="${state.killManagedOnly}" data-act="toggleKillManaged" aria-label="Preview ${esc(names.only)}"><span></span></button>
          <div style="min-width:0">
            <div class="inline"><code class="cmd">${esc(names.only)}</code>
              ${state.killManagedOnly ? `<span class="badge b-warn">${killedOnly} hooks off</span>` : ''}</div>
            <div class="t-caption faint" style="margin-top:2px">${esc(names.onlyWhere)}</div>
            <div class="t-caption muted" style="margin-top:4px">${names.onlyNote}</div>
          </div>
        </div>
        ${prov === 'codex' ? `
        <hr class="sep" />
        <div class="t-caption muted">${ic('key', 11)} Codex has a third lever with no Claude equivalent: <code class="cmd">--dangerously-bypass-hook-trust</code> runs enabled hooks for one invocation without persisted trust.</div>` : `
        <hr class="sep" />
        <div class="t-caption muted">${ic('info', 11)} Claude has two allowlists for <code class="cmd">http</code> handlers: <code class="cmd">allowedHttpHookUrls</code> decides whether the handler runs at all, and <code class="cmd">httpHookAllowedEnvVars</code> decides which environment variables get interpolated into its headers. Both <em>merge</em> across levels too, and apply to hooks from every source including managed policy.</div>`}
      </div>
    </div>
    ${(state.killAll || state.killManagedOnly) ? `
    <div class="card-body tight" style="border-top:1px solid var(--border);background:color-mix(in oklab, var(--warning) 7%, transparent)">
      <div class="t-caption"><strong class="semibold">${survivors} hook${survivors === 1 ? '' : 's'} still running.</strong>
      ${hooks.some((h) => h.scope === 'managed' && runState(h, r).runs)
        ? 'The managed-layer hooks survive — that is the whole point of the switch, and it is why a kill switch is not an override.'
        : 'Nothing managed is configured here, so the switch reaches everything.'}
      The rows above and on the Hooks screen are greyed rather than removed, because the entries are still in the files.</div>
    </div>` : ''}
  </div>`;
}

/* One layer stack for both providers. Ordered by where the file lives,
   not by authority — there is no authority. */
function layerStack(r) {
  return `
  <div class="card">
    <div class="card-head">
      <span class="t-label medium">${ic('layers', 14)} Layers</span>
      <span class="spacer"></span>
      <span class="t-caption muted">Ordered org-wide first, yours last. Not a precedence ladder — every layer's entries load.</span>
    </div>
    <div class="card-body">
      <div class="layers">
      ${layersOf(r.provider).map((l) => {
        const entries = hooksOf(r.id).filter((h) => h.scope === l.id);
        return `
        <div class="layer ${l.writable ? 'writable' : ''}">
          <div class="layer-head">
            <span class="badge ${l.writable ? 'b-brand' : ''}">${l.writable ? ic('pencil', 10) : ic('lock', 10)}${esc(l.label)}</span>
            <span class="cmd t-caption">${esc(l.file)}</span>
            <span class="spacer"></span>
            ${l.managedOnly ? '<span class="badge b-warn">survives both kill switches</span>' : ''}
            ${l.reach === 'worktree' ? '<span class="badge">in the task worktree</span>' : ''}
            ${l.id === 'user-toml' || l.id === 'repo-toml' ? '<span class="badge b-warn">TOML</span>' : ''}
            <span class="badge b-dim">${entries.length}</span>
          </div>
          <div class="layer-body">
            ${entries.length ? entries.map((h) => {
              const st = runState(h, r);
              return `
              <div class="layer-entry ${st.runs ? '' : 'inert'}">
                <span class="runorder ${st.runs ? '' : 'off'}">${st.runs ? ic('check', 12) : ic('ban', 12)}</span>
                <div style="min-width:0">
                  <div class="inline">
                    <span class="mono t-label">${esc(h.event)}</span>
                    <span class="cmd matcher t-caption faint">${h.matcher ? esc(h.matcher) : '*'}</span>
                    <span class="badge">${esc(h.type)}</span>
                    ${st.runs ? '' : `<span class="badge ${st.cls}">${ic(st.icon, 11)}${esc(st.label)}</span>`}
                  </div>
                  <div class="cmd t-caption" style="margin-top:2px">${esc(h.command || h.url || h.mcpTool || h.prompt || '')}</div>
                  <div class="t-micro ${st.runs ? 'faint' : ''}" style="margin-top:2px;${st.runs ? '' : 'color:var(--warning)'}">${esc(st.why)}</div>
                </div>
                <span class="spacer"></span>
                ${h.trust === 'stale' || h.trust === 'review' ? `<button class="btn xs" data-retrust="${h.id}">${ic('key', 11)}${h.trust === 'review' ? 'Review' : 'Re-trust'}</button>` : ''}
              </div>`;
            }).join('')
              : '<div class="layer-entry"><span class="t-caption faint">No hooks in this layer.</span></div>'}
          </div>
        </div>`;
      }).join('')}
      </div>
    </div>
    <div class="card-body tight" style="border-top:1px solid var(--border)">
      <div class="t-caption muted">${r.provider === 'claude'
        ? 'A managed layer is drawn first because it is org-wide, not because it outranks anything. Its only real privilege: a <code class="cmd">disableAllHooks</code> set anywhere else cannot switch it off.'
        : 'Project layers load only when the <code class="cmd">.codex/</code> layer is trusted. In an untrusted project Codex still loads user and managed hooks from their own layers.'}</div>
    </div>
  </div>`;
}

function scopeLegend(r) {
  return `
  <div class="card">
    <div class="card-head"><span class="t-label medium">${ic('lock', 14)} Why most of this is read-only</span></div>
    <div class="card-body tight">
      <div class="stack">
      ${layersOf(r.provider).map((l) => `
        <div class="inline" style="align-items:flex-start">
          <span class="badge ${l.writable ? 'b-brand' : ''}" style="min-width:74px;justify-content:center">${l.writable ? ic('pencil', 10) : ic('lock', 10)}${esc(l.label)}</span>
          <div style="min-width:0">
            <div class="cmd t-caption">${esc(l.file)}</div>
            <div class="t-caption muted">${esc(l.why)}</div>
          </div>
        </div>`).join('')}
      </div>
    </div>
  </div>`;
}

function precedenceRail(r) {
  return `
  <div class="card">
    <div class="card-head"><span class="t-label medium">${ic('cpu', 14)} Claude vs Codex</span></div>
    <div class="card-body tight">
      <div class="stack t-caption">
        <div><span class="badge b-ok" style="margin-bottom:3px">${ic('check', 10)}same on both</span>
        <strong class="semibold">Merge behaviour</strong><div class="muted">Both providers merge every layer and run everything. Neither shadows the other's entries. This row used to say the opposite and was wrong — it is the reason the two precedence screens collapsed into one.</div></div>
        <hr class="sep" />
        <div><strong class="semibold">Per-hook disable</strong><div class="muted"><strong>Codex has one</strong> — <code class="cmd">/hooks</code> disables an individual non-managed hook and the entry stays in the file. <strong>Claude has none</strong>: the docs say so outright, so Multica has to invent the mechanism there and only there.</div></div>
        <hr class="sep" />
        <div><strong class="semibold">Trust</strong><div class="muted">Codex records trust against a hook's current hash; a new or edited hook is skipped until reviewed in <code class="cmd">/hooks</code>. Enabling a plugin does not trust its hooks. Claude has no equivalent — its gate is workspace trust on the folder, not the hook.</div></div>
        <hr class="sep" />
        <div><strong class="semibold">Matcher semantics</strong><div class="muted">Claude: exact string unless it contains a character outside <code class="cmd">[A-Za-z0-9_-,| ]</code>, then an unanchored regex. Codex: <em>always</em> a regex — no exact path at all — and ignored outright on <code class="cmd">UserPromptSubmit</code>, <code class="cmd">Stop</code> and <code class="cmd">Interrupt</code>.</div></div>
        <hr class="sep" />
        <div><strong class="semibold">Deduplication</strong><div class="muted">Claude collapses a byte-identical handler defined in two settings files to one spawn; a plugin or skill copy stays separate. Codex documents none.</div></div>
        <hr class="sep" />
        <div><strong class="semibold">Events</strong><div class="muted">Claude 33 · Codex 12. <code class="cmd">Interrupt</code> is Codex-only; <code class="cmd">FileChanged</code>, <code class="cmd">TeammateIdle</code>, <code class="cmd">ConfigChange</code> and 19 more are Claude-only.</div></div>
        <hr class="sep" />
        <div><strong class="semibold">Handler types</strong><div class="muted">Claude: command, http, mcp_tool, prompt, agent — all effective. Codex: command and mcp_tool only; <code class="cmd">prompt</code> and <code class="cmd">agent</code> are parsed and then skipped, and there is no <code class="cmd">http</code>.</div></div>
        <hr class="sep" />
        <div><span class="badge b-ok" style="margin-bottom:3px">${ic('check', 10)}same outcome</span>
        <strong class="semibold">Stop + <code class="cmd">decision:"block"</code></strong><div class="muted">On <em>both</em> providers <code class="cmd">block</code> means <strong>keep going</strong> — neither rejects the turn. This row used to call them opposites; that was wrong. The real difference is how your <code class="cmd">reason</code> is delivered: Claude receives it as the explanation for why it should continue, under <code class="cmd">stop_hook_active</code> and an 8-consecutive-continuation cap; Codex turns it into a new continuation prompt that acts as a new user prompt. Claude alone offers a second door on <code class="cmd">Stop</code>/<code class="cmd">SubagentStop</code> — <code class="cmd">hookSpecificOutput.additionalContext</code> continues the turn under the same two loop protections but lands as <em>Stop hook feedback</em> rather than a hook error. Codex has no <code class="cmd">additionalContext</code> on these events at all. On both, a <code class="cmd">continue:false</code> from any matching Stop hook is what actually ends the turn, and on Codex it takes precedence over every other continuation decision.</div></div>
        <hr class="sep" />
        <div><strong class="semibold">Filtering fields</strong><div class="muted">Claude has <code class="cmd">if</code> (permission-rule pre-filter, tool events only — set it on any other event and the handler never runs). Codex has none.</div></div>
        <hr class="sep" />
        <div><strong class="semibold">Windows</strong><div class="muted">Codex has <code class="cmd">commandWindows</code> / <code class="cmd">command_windows</code>; Claude has <code class="cmd">shell: "powershell"</code> and exec-form <code class="cmd">args</code>.</div></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><span class="t-label medium">${ic('eye', 14)} Layers not shown</span></div>
    <div class="card-body tight">
      <div class="t-caption muted stack">
        <div>Both providers load hooks from places no discovery pass can enumerate. They are listed so the count above is not mistaken for the whole truth.</div>
        ${r.provider === 'claude' ? `
        <div>· skill frontmatter — registered once the skill is invoked, for the rest of the session. Supports <code class="cmd">once: true</code>, which nothing in a settings file does.</div>
        <div>· subagent frontmatter — only while that subagent runs, and only after the workspace-trust dialog is accepted for the folder the agent file came from</div>
        <div>· session hooks — registered in memory for the current session</div>
        <div>· server-managed settings, which a cloud session reads instead of your <code class="cmd">~/.claude/settings.json</code></div>
        <div class="t-micro faint">A <code class="cmd">--settings &lt;file&gt;</code> flag is <em>not</em> a hook layer — it is listed in the docs as a way to force <code class="cmd">disableAllHooks</code> for one run, so it lives in the kill-switch card above.</div>` : `
        <div>· MDM / cloud managed layers beyond <code class="cmd">requirements.toml</code></div>
        <div>· session hooks added inside a live session</div>
        <div>· plugin manifest overrides — <code class="cmd">.codex-plugin/plugin.json</code> can point <code class="cmd">hooks</code> anywhere in the plugin root, or inline the object, instead of the default <code class="cmd">hooks/hooks.json</code></div>
        <div class="t-micro faint">If one layer carries both a <code class="cmd">hooks.json</code> and inline <code class="cmd">[hooks]</code> tables, Codex merges them and warns at startup rather than picking one.</div>`}
      </div>
    </div>
  </div>`;
}
</script>

<script>
/* ==================================================================== *
 * SCREEN 3 — FIRE LOG
 * The answer to LOCO-79's #1 complaint: a non-zero exit that is not 2 is a
 * non-blocking error on most events, so the guard stops enforcing while the
 * action proceeds. Whether Claude SEES the failure is per-event, not a rule:
 * PostToolUse and PostToolUseFailure show an exit-2 stderr to Claude even
 * though neither can block, while PreCompact — the failing hook in this
 * sketch — routes its stderr to the user and discards systemMessage.
 * The transcript is not silent — Claude prints one
 * "<hook name> hook error" notice per fire with the first line of stderr.
 * What no one keeps is a RECORD: verdict and history
 * across fires. A one-line notice scrolling past in a transcript is not
 * something you can filter, count or audit, and that is the gap this screen
 * fills. Shape borrowed from the filterable event timelines (disler /
 * agents-observe / Agent-Monitor); the data is host-side and already exists
 * for Claude.
 * ==================================================================== */
function screenLog() {
  const r = rt();
  const feed = FIRE_LOG[r.id] || { rows: [], source: '', sourceOk: true };
  const failish = ['failed', 'timeout', 'untrusted', 'ineffective'];
  const rows = feed.rows.filter((row) => {
    if (state.logFilter === 'failures') return failish.includes(row.verdict);
    if (state.logFilter === 'never') return ['neverran', 'ineffective', 'untrusted'].includes(row.verdict);
    if (state.logFilter === 'blocked') return ['blocked', 'continued', 'feedback'].includes(row.verdict);
    return true;
  });
  const nFail = feed.rows.filter((x) => failish.includes(x.verdict)).length;
  const nNever = feed.rows.filter((x) => ['neverran', 'ineffective', 'untrusted'].includes(x.verdict)).length;

  return `
  <div class="two-col">
    <div class="col-main">
      ${runtimePicker()}
      ${nFail ? `
      <div class="notice bad t-label">
        ${ic('circleAlert', 15, 'ico')}
        <div><strong class="semibold">${nFail} hook fire${nFail > 1 ? 's' : ''} failed in the last hour and nothing kept a record of them.</strong>
        A hook that exits non-zero, but not 2, does not stop the action on most events — the guard simply stops guarding. Whether Claude sees the failure is per-event and not a general rule: <code class="cmd">PostToolUse</code> and <code class="cmd">PostToolUseFailure</code> show an exit-2 stderr message to Claude even though neither can block, while <code class="cmd">SessionEnd</code> routes its stderr to the user, as does <code class="cmd">PreCompact</code> on a manual <code class="cmd">/compact</code> — where an auto-triggered compact’s stderr goes is undocumented.
        Each fire does print one <code class="cmd">hook error</code> notice in the transcript. This feed is the only place with the verdict and the history across fires.</div>
      </div>` : ''}

      <div class="card">
        <div class="card-head">
          <span class="t-label medium">${ic('activity', 14)} Hook fires</span>
          <span class="spacer"></span>
          <div class="seg" role="group" aria-label="Filter fires">
            <button data-log="all" aria-pressed="${state.logFilter === 'all'}">All ${feed.rows.length}</button>
            <button data-log="failures" aria-pressed="${state.logFilter === 'failures'}">Failures ${nFail}</button>
            <button data-log="never" aria-pressed="${state.logFilter === 'never'}">Never ran ${nNever}</button>
            <button data-log="blocked" aria-pressed="${state.logFilter === 'blocked'}">Decisions</button>
          </div>
        </div>
        ${rows.length ? `
        <div class="log-head"><span>Time</span><span>Event · hook</span><span>Verdict</span></div>
        ${rows.map(logRow).join('')}`
        : `<div class="empty"><div class="media">${ic('filter', 20)}</div>
            <div class="t-title-sm medium">Nothing matches this filter</div>
            <div class="t-caption muted">${feed.rows.length ? 'Switch back to All to see every fire.' : esc(feed.source)}</div></div>`}
      </div>

      <div class="notice ${feed.sourceOk ? 'info' : 'warn'} t-caption">
        ${ic(feed.sourceOk ? 'info' : 'alert', 14, 'ico')}
        <div><strong class="semibold">Where this comes from.</strong> ${esc(feed.source)}</div>
      </div>
    </div>
    <div class="col-rail">
      <div class="card">
        <div class="card-head"><span class="t-label medium">${ic('eye', 14)} What a verdict means</span></div>
        <div class="card-body tight">
          <div class="stack t-caption">
            <div><span class="badge b-ok">${ic('check', 11)}success</span> <span class="muted">exit 0.</span></div>
            <div><span class="badge b-warn">${ic('ban', 11)}blocked</span> <span class="muted">exit 2 on a blockable event — the tool call was rejected.</span></div>
            <div><span class="badge b-bad">${ic('circleAlert', 11)}failed</span> <span class="muted">non-zero but not 2, so it did not block and the action proceeded. Whether Claude saw it is per-event: <code class="cmd">PostToolUse</code> and <code class="cmd">PostToolUseFailure</code> show an exit-2 stderr to Claude, while <code class="cmd">SessionEnd</code> shows its stderr to the user, as does <code class="cmd">PreCompact</code> on a manual <code class="cmd">/compact</code> — the auto-triggered case is undocumented. The transcript got a one-line hook-error notice; this row is the only record.</span></div>
            <div><span class="badge b-bad">${ic('clock', 11)}timed out</span> <span class="muted">killed at its timeout.</span></div>
            <div><span class="badge">${ic('zap', 11)}async</span> <span class="muted">Detached, so its exit status is not acted on. Claude only: Claude Code does emit a completion record when the process exits — <code class="cmd">hook_response</code>, with <code class="cmd">exit_code</code> and <code class="cmd">outcome</code> — and that record only reaches a host through the Agent SDK stream (<code class="cmd">includeHookEvents</code>, default off) or <code class="cmd">--output-format stream-json --verbose</code> with <code class="cmd">--include-hook-events</code>, which is how Multica launches <code class="cmd">claude</code>, so the outcome does reach the Claude feed. The host debug log is what carries no such record, so a fire whose debug line cannot be matched 1:1 to a response is timestamped on receipt and stamped <code class="cmd">inferred</code> rather than <code class="cmd">debug_log</code>. The shipped <code class="cmd">protocol.HookFire</code> has no duration on any row; that is not caused by async detachment, and this log therefore shows no duration column. Codex writes no per-hook log at all, so its async rows are inferred. The hook's additionalContext and systemMessage still reach Claude on the next turn, and completion notices are suppressed unless you run <code class="cmd">--verbose</code> or press Ctrl+O.</span></div>
            <div><span class="badge b-bad">${ic('ban', 11)}never invoked</span> <span class="muted">Loaded, but the provider never calls it. No error is raised, so this row is inferred from an absence rather than read from a log line.</span></div>
            <div><span class="badge">${ic('copy', 11)}collapsed · ran once</span> <span class="muted">Claude only. Two identical settings-file entries, one process.</span></div>
            <div><span class="badge">${ic('filter', 11)}if did not match</span> <span class="muted">Claude only. Deliberate: the pre-filter kept the process from spawning.</span></div>
            <div><span class="badge b-bad">${ic('key', 11)}not trusted</span> <span class="muted">Codex only. Skipped on a hash mismatch.</span></div>
            <div><span class="badge b-warn">${ic('info', 11)}continued turn</span> <span class="muted">Either provider. <code class="cmd">decision:"block"</code> on <code class="cmd">Stop</code> continues the turn — it never rejects it. Claude reads the <code class="cmd">reason</code> as why to continue; Codex replays it as a new user prompt.</span></div>
            <div><span class="badge">${ic('info', 11)}stop feedback · continued</span> <span class="muted">Claude only. <code class="cmd">hookSpecificOutput.additionalContext</code> on <code class="cmd">Stop</code>/<code class="cmd">SubagentStop</code> — the turn continues the same way, but it is guidance rather than a hook error.</span></div>
          </div>
        </div>
      </div>
      <div class="card" style="border-color:color-mix(in oklab, var(--warning) 30%, var(--border))">
        <div class="card-head" style="background:color-mix(in oklab, var(--warning) 8%, transparent)">
          <span class="t-label medium">${ic('alert', 14)} Not built yet</span>
        </div>
        <div class="card-body tight">
          <div class="t-caption muted stack">
            <div>Claude writes per-hook results host-side today, so the data exists — but nothing ships it to the server.</div>
            <div>${ic('x', 11)} No log-tailing pending action, and no store for fires.</div>
            <div>${ic('x', 11)} Codex writes no per-hook log at all. The Codex feed above is inferred rather than dressed up.</div>
            <div>${ic('x', 11)} The shipped <code class="cmd">protocol.HookFire</code> carries no duration, matcher or task reference, so none of those fields appears in this log.</div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function logRow(row) {
  const v = VERDICTS[row.verdict] || { label: row.verdict, cls: '', icon: 'info' };
  const bad = ['failed', 'timeout', 'untrusted', 'ineffective'].includes(row.verdict);
  return `
  <div class="log-row ${bad ? 'fail' : ''}">
    <span class="cmd t-caption faint">${esc(row.t)}</span>
    <div style="min-width:0">
      <div class="inline">
        <span class="mono t-label">${esc(row.event)}</span>
        <span class="faint t-caption">·</span>
        <span class="cmd t-caption">${esc(row.hook)}</span>
      </div>
      ${row.note ? `<div class="t-caption muted" style="margin-top:2px">${esc(row.note)}</div>` : ''}
      ${row.stderr ? `<div class="stderr">${esc(row.stderr)}</div>` : ''}
    </div>
    <span><span class="badge ${v.cls}">${ic(v.icon, 11)}${esc(v.label)}</span></span>
  </div>`;
}

/* ==================================================================== *
 * SCREEN 4 — STARTER HOOKS GALLERY
 * Catalog-card layout after karanb192.github.io/claude-code-hooks (MIT).
 * Provider compatibility is on the card because "Install" means two
 * different things depending on the selected runtime — and for two of
 * these it means "not possible here".
 * ==================================================================== */
function screenGallery() {
  const r = rt();
  const installed = new Set(hooksOf(r.id).map((h) => h.installedFrom).filter(Boolean));
  return `
  <div class="two-col">
    <div class="col-main">
      ${runtimePicker()}
      <div class="notice info t-label">
        ${ic('pkg', 15, 'ico')}
        <div><strong class="semibold">Install targets ${esc(r.name)} — ${esc(providerLabel(r.provider))}, user scope.</strong>
        Cards that need a handler type or a tool this provider does not have are marked and cannot be installed here.</div>
      </div>
      <div class="gallery">
      ${GALLERY.map((g) => {
        const ok = r.provider === 'claude' ? g.claude : g.codex;
        const has = installed.has(g.id);
        return `
        <div class="g-card">
          <div class="g-top">
            <span class="mono t-label medium" style="flex:1;min-width:0">${esc(g.name)}</span>
            ${has ? '<span class="badge b-ok">installed</span>' : ''}
          </div>
          <div class="inline">
            <span class="badge">${esc(g.event)}</span>
            <span class="cmd t-caption faint">${esc(g.matcher)}</span>
          </div>
          <div class="t-caption muted">${esc(g.desc)}</div>
          ${g.levels.length ? `<div class="inline t-micro">
            <span class="faint">Severity</span>
            ${g.levels.map((l) => `<span class="badge ${l === 'Block' ? 'b-bad' : l === 'Ask' ? 'b-warn' : ''}">${esc(l)}</span>`).join('')}
          </div>` : ''}
          <div class="compat t-micro">
            <span class="badge ${g.claude ? 'b-ok' : 'b-bad'}">${g.claude ? ic('check', 10) : ic('x', 10)}Claude</span>
            <span class="badge ${g.codex ? 'b-ok' : 'b-bad'}">${g.codex ? ic('check', 10) : ic('x', 10)}Codex</span>
            <span class="badge b-dim">${esc(g.type)}</span>
          </div>
          ${!ok ? `<div class="t-micro" style="color:var(--warning)">${ic('alert', 10)} ${esc(g.incompat || 'Not supported on this provider.')}</div>` : ''}
          <div class="g-foot">
            <button class="btn sm ${ok && !has ? 'primary' : ''}" ${ok && !has ? `data-install="${g.id}"` : 'disabled'}>
              ${has ? ic('check', 13) : ic('download', 13)}${has ? 'Installed' : ok ? 'Install' : 'Unavailable'}
            </button>
            <button class="btn sm" data-src="${g.id}">${ic('ext', 13)}Source</button>
          </div>
        </div>`;
      }).join('')}
      </div>
    </div>
    <div class="col-rail">
      <div class="card">
        <div class="card-head"><span class="t-label medium">${ic('shield', 14)} Severity, honestly</span></div>
        <div class="card-body tight">
          <div class="t-caption muted stack">
            <div>Warn / Ask / Block is not a field in either schema. It is a convention these hook scripts implement themselves — <code class="cmd">HOOK_SAFETY_LEVEL</code> plus <code class="cmd">permissionDecision: "ask"</code>.</div>
            <div>So it appears on gallery cards, where Multica controls what it installs, and deliberately <strong class="semibold">not</strong> as a column on the hooks list, where it would imply a per-hook setting that does not exist.</div>
          </div>
        </div>
      </div>
      <div class="card" style="border-color:color-mix(in oklab, var(--warning) 30%, var(--border))">
        <div class="card-head" style="background:color-mix(in oklab, var(--warning) 8%, transparent)">
          <span class="t-label medium">${ic('alert', 14)} Not built yet</span>
        </div>
        <div class="card-body tight">
          <div class="t-caption muted stack">
            <div>${ic('x', 11)} Installing means writing a script <em>and</em> a settings entry on the host. Neither is possible today.</div>
            <div>${ic('x', 11)} There is no catalog service. These nine entries are hard-coded here.</div>
            <div>${ic('x', 11)} Claude's native <code class="cmd">/plugin marketplace</code> route would avoid file surgery entirely and is probably the better v1 — worth deciding before building a writer.</div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

/* ==================================================================== *
 * SCREEN 5 — DISCOVERY / EMPTY / OFFLINE
 * Discovery mirrors the local-skills panel: initiate, then poll the
 * result endpoint every 500 ms up to 30 s, Skeleton in the meantime.
 * ==================================================================== */
const DISCOVERY_STEPS = [
  { label: 'Initiating discovery', detail: 'POST /api/runtimes/{id}/hooks' },
  { label: 'Queued for the next daemon heartbeat', detail: 'pending action · up to 5 s' },
  { label: 'Reading provider config on the host', detail: '~/.claude/settings.json · /etc/claude-code/managed-settings.json' },
  { label: 'Parsing and resolving precedence', detail: 'server-side' },
  { label: 'Done', detail: '19 hooks across 5 files' },
];

function screenStates() {
  return `
  <div class="two-col">
    <div class="col-main">
      <div class="card">
        <div class="card-body tight">
          <div class="inline">
            <span class="t-label medium">State</span>
            <div class="seg" role="group" aria-label="Choose a state to preview">
              <button data-demo="discovery" aria-pressed="${state.stateDemo === 'discovery'}">Discovery</button>
              <button data-demo="empty" aria-pressed="${state.stateDemo === 'empty'}">Empty</button>
              <button data-demo="offline" aria-pressed="${state.stateDemo === 'offline'}">Runtime offline</button>
            </div>
            <span style="flex:1"></span>
            <span class="t-caption muted">These three states are reachable from the runtime picker too — marty-mbp is empty, loco-winlab is offline.</span>
          </div>
        </div>
      </div>
      ${state.stateDemo === 'discovery' ? discoveryBody()
        : state.stateDemo === 'empty' ? emptyCard(RUNTIMES[2])
        : offlineCard(RUNTIMES[3])}
    </div>
    <div class="col-rail">
      <div class="card">
        <div class="card-head"><span class="t-label medium">${ic('refresh', 14)} Why initiate-then-poll</span></div>
        <div class="card-body tight">
          <div class="t-caption muted stack">
            <div>The server cannot call a runtime directly. It parks a pending action, the daemon picks it up on its next heartbeat, does the work, and reports back to a result endpoint the web app polls.</div>
            <div>That is exactly how runtime local-skill discovery already works, so a hooks read is a clone of a shipped pipeline rather than a new mechanism — which is also why a read is cheap and a <em>write</em> is not.</div>
          </div>
        </div>
      </div>
      <div class="card" style="border-color:color-mix(in oklab, var(--warning) 30%, var(--border))">
        <div class="card-head" style="background:color-mix(in oklab, var(--warning) 8%, transparent)">
          <span class="t-label medium">${ic('alert', 14)} Not built yet</span>
        </div>
        <div class="card-body tight">
          <div class="t-caption muted stack">
            <div>${ic('x', 11)} Discovery today reads a fixed set of skill directories and one MCP config file. Paths are compiled in per provider — there is no parameter for another path, so a hooks read needs a new pending action and daemon handler.</div>
            <div>${ic('x', 11)} No <code class="cmd">hooks-v1</code> capability flag, so there is nothing to gate the tab on for older daemons.</div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function discoveryBody() {
  const step = state.discoveryStep;
  return `
  <div class="card">
    <div class="card-head">
      <span class="t-label medium">${ic('refresh', 14)} Reading hooks from cc-claudesp</span>
      <span class="badge b-brand">polling</span>
      <span class="spacer"></span>
      <span class="t-caption muted mono">500 ms interval · 3.2 s elapsed · 30 s timeout</span>
      <button class="btn sm" data-act="stepDiscovery">${ic('play', 13)}Advance</button>
    </div>
    <div class="card-body">
      <div class="stack" style="gap:8px">
      ${DISCOVERY_STEPS.map((s, i) => `
        <div class="inline" style="align-items:flex-start">
          <span class="runorder ${i < step ? '' : 'off'}" style="margin-top:1px">${i < step ? ic('check', 12) : i === step ? ic('refresh', 12) : ic('clock', 12)}</span>
          <div style="min-width:0">
            <div class="t-label ${i <= step ? '' : 'faint'}">${esc(s.label)}${i === step && i < DISCOVERY_STEPS.length - 1 ? '…' : ''}</div>
            <div class="cmd t-micro faint">${esc(s.detail)}</div>
          </div>
        </div>`).join('')}
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><span class="t-label medium">Hooks</span><span class="spacer"></span>
      <span class="sk" style="display:inline-block;width:72px;height:14px"></span></div>
    ${[0, 1, 2].map(() => `
      <div style="padding:12px;border-bottom:1px solid var(--border)">
        <div class="inline" style="margin-bottom:8px">
          <span class="sk" style="width:110px;height:14px"></span>
          <span class="sk" style="width:54px;height:14px"></span>
          <span class="sk" style="width:68px;height:14px"></span>
        </div>
        <div class="sk" style="width:64%;height:12px;margin-bottom:6px"></div>
        <div class="sk" style="width:38%;height:12px"></div>
      </div>`).join('')}
    <div class="card-body tight"><span class="t-caption faint">Skeleton rows while the runtime is read — same treatment as the local-skills import panel.</span></div>
  </div>`;
}

function emptyCard(r) {
  return `
  <div class="card">
    <div class="empty">
      <div class="media">${ic('webhook', 20)}</div>
      <div class="t-title-sm medium">No lifecycle hooks on ${esc(r.name)}</div>
      <div class="t-caption muted" style="max-width:460px">
        Multica read <code class="cmd">~/.claude/settings.json</code> on ${esc(machineOf(r).title)} and found no <code class="cmd">hooks</code> key.
        Project and local scopes were not read — they live in the task worktree, not on this host.
      </div>
      <div class="actions">
        <button class="btn primary" data-add="1">${ic('plus', 14)}Add a hook</button>
        <button class="btn" data-screen="gallery">${ic('pkg', 14)}Browse starter hooks</button>
      </div>
      <div class="t-caption faint" style="margin-top:4px">Last read ${esc(r.scanned)}</div>
    </div>
  </div>`;
}
function emptyBody(r) {
  return `<div class="two-col"><div class="col-main">${runtimePicker()}${behaviorStrip(r.provider)}${emptyCard(r)}</div>
    <div class="col-rail">${railCards(r, [])}</div></div>`;
}

function offlineCard(r) {
  return `
  <div class="card">
    <div class="empty">
      <div class="media" style="background:color-mix(in oklab, var(--destructive) 16%, transparent);color:var(--destructive)">${ic('wifiOff', 20)}</div>
      <div class="t-title-sm medium">${esc(r.name)} is offline</div>
      <div class="t-caption muted" style="max-width:480px">
        The ${esc(machineOf(r).title)} daemon last checked in ${esc(r.scanned)}. Hooks cannot be read or written while it is offline —
        the write would sit in a pending action and apply whenever the machine came back, which is worse than refusing.
      </div>
      <div class="actions">
        <button class="btn" data-act="rescan">${ic('refresh', 14)}Retry</button>
        <button class="btn" data-act="viewCached">${ic('eye', 14)}View last known hooks</button>
      </div>
      <div class="t-caption faint" style="margin-top:4px">Editing is disabled until the runtime reconnects.</div>
    </div>
  </div>`;
}
function offlineBody(r) {
  return `<div class="two-col"><div class="col-main">${runtimePicker()}${offlineCard(r)}</div>
    <div class="col-rail">
      <div class="card"><div class="card-head"><span class="t-label medium">${ic('wifiOff', 14)} Last known state</span></div>
      <div class="card-body tight"><div class="t-caption muted">Cached from ${esc(r.scanned)}. Shown read-only; a stale read is labelled rather than silently served as current.</div></div></div>
    </div></div>`;
}
</script>

<script>
/* ==================================================================== *
 * DIALOGS — Dialog for the editor (matching McpServerDialog and
 * runtime-profiles-dialog), AlertDialog for the delete confirm.
 * ==================================================================== */
let ed = null;      // editor draft
let modal = null;   // 'editor' | 'delete' | 'diff' | 'trust' | 'park'
let pending = null;  // payload for delete / trust / park

function openEditor(hookId) {
  const r = rt();
  const h = hookId ? hooksOf(r.id).find((x) => x.id === hookId) : null;
  const writable = layersOf(r.provider).filter((l) => l.writable);
  ed = {
    mode: h ? 'edit' : 'add',
    id: h ? h.id : null,
    provider: r.provider,
    event: h ? h.event : '',
    matcher: h ? (h.matcher || '') : '',
    type: h ? h.type : 'command',
    command: h ? (h.command || '') : '',
    args: h && h.args ? h.args.join(' ') : '',
    timeout: h && h.timeout != null ? String(h.timeout) : '',
    async: h ? !!h.async : false,
    shell: h && h.shell ? h.shell : 'bash',
    scope: h && layerMeta(r.provider, h.scope).writable ? h.scope : writable[0].id,
    commandWindows: h ? (h.commandWindows || '') : '',
    statusMessage: h ? (h.statusMessage || '') : '',
    additionalContextLimit: h && h.additionalContextLimit ? String(h.additionalContextLimit) : '',
    url: h ? (h.url || '') : '',
    mcpTool: h ? (h.mcpTool || '') : '',
    if: h ? (h.if || '') : '',
    comboOpen: false,
    comboQuery: '',
    dirty: false,
  };
  modal = 'editor';
  renderModal();
}

function editorProblems() {
  const out = [];
  const types = HANDLER_TYPES[ed.provider];
  const t = types.find((x) => x.v === ed.type);
  if (!ed.event) out.push({ level: 'error', field: 'event', text: 'Pick an event.' });
  if (t && !t.effective) out.push({ level: 'error', field: 'type',
    text: (ed.type === 'http'
      ? 'Codex has no http handler type at all.'
      : 'Codex parses type: ' + ed.type + ' as a valid handler type and then never dispatches it.')
      + ' Saving this would store a hook that can never run — the exact failure this screen exists to prevent.' });
  if (ed.type === 'command') {
    const c = validateCommand(ed.command);
    if (c) out.push({ level: c.level, field: 'command', text: c.text });
  }
  if (ed.type === 'http' && !/^https?:\/\//.test(ed.url)) out.push({ level: 'error', field: 'url', text: 'An http handler needs an absolute URL.' });
  if (ed.type === 'mcp_tool' && !ed.mcpTool.trim()) out.push({ level: 'error', field: 'mcpTool', text: 'Name the MCP tool to invoke.' });
  const mi = interpretMatcher(ed.matcher, ed.provider, ed.event);
  if (mi.kind === 'regex') out.push({ level: 'warn', field: 'matcher', text: mi.text });
  if (mi.kind === 'ignored') out.push({ level: 'warn', field: 'matcher', text: mi.text });
  if (ed.event === 'FileChanged' && mi.kind === 'regex') out.push({ level: 'error', field: 'matcher',
    text: 'FileChanged only accepts the narrow exact set (letters, digits, _ and |). A regex here never matches anything — and the matcher doubles as the watch list, so this would also watch a file literally named that.' });
  if (ed.event === 'Stop' || ed.event === 'SubagentStop') out.push({ level: 'warn', field: 'event',
    text: 'A ' + ed.event + ' hook returning decision:"block" does not reject the turn on either provider — it CONTINUES it. Omit decision to let the turn end; only continue:false ends it. '
      + (ed.provider === 'codex'
        ? 'Codex turns your reason into a new continuation prompt that acts as a new user prompt, so write it as an instruction — and it has no additionalContext on this event, so decision/reason is the only way to feed the model context. Stop does also take the shared continue, stopReason and systemMessage fields.'
        : 'Claude takes your reason as the explanation for why it should continue, capped at 8 consecutive continuations. If the hook is working as designed and only wants to hand Claude guidance, return hookSpecificOutput.additionalContext instead: same continuation, same loop protections, but the transcript labels it Stop hook feedback and raises no hook error.') });
  if (ed.provider === 'codex' && ed.type === 'command' && String(ed.additionalContextLimit || '').trim() && ed.event && !CODEX_ADDCTX_EVENTS.includes(ed.event)) {
    out.push({ level: 'warn', field: 'additionalContextLimit',
      text: ed.event + ' produces no additionalContext on Codex, so this limit is inert — Codex ignores it and records a configuration warning. It only bites on ' + CODEX_ADDCTX_EVENTS.join(', ') + '.' });
  }
  if (ed.if && ed.if.trim() && ed.provider === 'claude' && !CLAUDE_IF_EVENTS.includes(ed.event) && ed.event) {
    out.push({ level: 'error', field: 'if',
      text: 'An if condition is only evaluated on tool events (' + CLAUDE_IF_EVENTS.join(', ') + '). Set it on ' + ed.event + ' and the handler never runs at all — silently.' });
  }
  if (ed.if && /&&|\|\||,/.test(ed.if)) out.push({ level: 'error', field: 'if',
    text: 'if holds exactly one permission rule. There is no &&, || or list syntax — define a separate handler per condition.' });
  if (ed.if && ed.if.trim() && ed.provider === 'codex') out.push({ level: 'error', field: 'if',
    text: 'Codex has no if field. It would be stored and ignored.' });
  if (ed.async) out.push({ level: 'warn', field: 'async',
    text: 'async detaches the process. Claude Code does emit a completion record when the process exits — hook_response, with exit_code and outcome — and that record only reaches a host through the Agent SDK stream (includeHookEvents, default off) or --output-format stream-json --verbose with --include-hook-events, which is how Multica launches claude, so the outcome does reach the fire log. The host debug log is what carries no such record, so a fire whose debug line cannot be matched 1:1 to a response is timed from receipt and stamped inferred rather than debug_log. The record has no duration field, so no timing for the run reaches this editor or the fire log. Matcher counts are a separate debug-log artifact, written only at CLAUDE_CODE_DEBUG_LOG_LEVEL=verbose. Its exit status is not acted on; asyncRewake is the field that wakes Claude on exit code 2. Claude still delivers the hook response\'s additionalContext and systemMessage on the next turn, and its completion notice is suppressed unless you run --verbose or press Ctrl+O. Claude also stops enforcing timeout once an async command hook is running, though it keeps enforcing it on an asyncRewake hook.' });
  if (ed.provider === 'codex') out.push({ level: 'warn', field: 'trust',
    text: 'Codex records trust against each hook\u2019s own hash, so saving a new or edited entry leaves that entry needing review in /hooks before it can run. Untouched entries in the same file keep their trust — the hash is per hook, not per file.' });
  return out;
}

/* The five tool events where Claude evaluates an `if` condition. On every
   other event a handler with `if` set never runs — which is a silent
   failure, so the editor treats it as blocking. */
const CLAUDE_IF_EVENTS = ['PreToolUse', 'PostToolUse', 'PostToolUseFailure', 'PermissionRequest', 'PermissionDenied'];
/* Codex documents hookSpecificOutput.additionalContext on these five events only.
   Everywhere else it "ignores additionalContextLimit and reports a configuration
   warning" — so the field is offerable but inert, which is worth saying out loud. */
const CODEX_ADDCTX_EVENTS = ['SessionStart', 'UserPromptSubmit', 'PreToolUse', 'PostToolUse', 'SubagentStart'];

function eventOptions() {
  const all = ed.provider === 'claude' ? CLAUDE_EVENTS : CODEX_EVENTS;
  const q = ed.comboQuery.trim().toLowerCase();
  const hit = all.filter((e) => e.toLowerCase().includes(q));
  const common = ed.provider === 'claude' ? CLAUDE_COMMON : CODEX_EVENTS.slice(0, 6);
  return {
    total: all.length,
    common: hit.filter((e) => common.includes(e)),
    rest: hit.filter((e) => !common.includes(e)),
  };
}

function editorDialog() {
  const problems = editorProblems();
  /* The footer counts every problem, so every problem has to be readable somewhere.
     perField() records what it places; whatever is left over renders above the
     footer instead of being counted and then hidden. */
  const placed = new Set();
  const perField = (f) => { placed.add(f); return problems.filter((p) => p.field === f); };
  const blocking = problems.filter((p) => p.level === 'error');
  const types = HANDLER_TYPES[ed.provider];
  const opts = eventOptions();
  const mi = interpretMatcher(ed.matcher, ed.provider, ed.event);
  const allLayers = layersOf(ed.provider);

  return `
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="edTitle">
    <div class="dialog-head">
      <div>
        <div class="t-title-lg" id="edTitle">${ed.mode === 'add' ? 'Add lifecycle hook' : 'Edit lifecycle hook'}</div>
        <div class="t-caption muted" style="margin-top:2px">
          ${esc(rt().name)} · <span class="badge ${ed.provider === 'claude' ? 'b-claude' : 'b-codex'}">${esc(providerLabel(ed.provider))}</span>
        </div>
      </div>
      <span class="spacer"></span>
      <button class="btn ghost icon" data-close="1" aria-label="Close">${ic('x', 16)}</button>
    </div>

    <div class="dialog-body">
      <!-- Event: searchable combobox, not a 33-item dropdown. -->
      <div class="field">
        <label for="edEvent">Event</label>
        <div class="combo">
          <div class="select-wrap">
            <input class="input" id="edEvent" autocomplete="off"
              placeholder="Search ${opts.total} ${esc(providerLabel(ed.provider))} events"
              value="${esc(ed.comboOpen ? ed.comboQuery : ed.event)}" data-combo="1"
              aria-expanded="${ed.comboOpen}" aria-invalid="${perField('event').some((p) => p.level === 'error')}" />
            ${ic('search', 14)}
          </div>
          <div class="combo-list" ${ed.comboOpen ? '' : 'hidden'}>
            ${opts.common.length ? `<div class="combo-group">Common</div>` +
              opts.common.map((e) => comboOpt(e)).join('') : ''}
            ${opts.rest.length ? `<div class="combo-group">All ${opts.total} events</div>` +
              opts.rest.map((e) => comboOpt(e)).join('') : ''}
            ${!opts.common.length && !opts.rest.length ? `<div class="combo-empty">
              No ${esc(providerLabel(ed.provider))} event matches “${esc(ed.comboQuery)}”.
              ${ed.provider === 'codex' && CLAUDE_EVENTS.some((e) => e.toLowerCase().includes(ed.comboQuery.trim().toLowerCase()))
                ? ' It exists on Claude but not on Codex.' : ''}</div>` : ''}
          </div>
        </div>
        <div class="hint">${esc(providerLabel(ed.provider))} has ${opts.total} events. ${ed.provider === 'codex'
          ? 'Interrupt is Codex-only; FileChanged, TeammateIdle and ConfigChange do not exist here.'
          : 'Nine are common; the other 24 are reachable by typing.'}</div>
        ${perField('event').map((p) => `<div class="${p.level === 'error' ? 'err' : 'warn'}">${ic('alert', 12)}<span>${p.text}</span></div>`).join('')}
      </div>

      <!-- Matcher: live interpretation of the non-obvious rule. -->
      <div class="field">
        <label for="edMatcher">Matcher</label>
        <input class="input mono" id="edMatcher" data-f="matcher" value="${esc(ed.matcher)}" placeholder="* — every occurrence"
          aria-invalid="${perField('matcher').some((p) => p.level === 'error')}" />
        <div class="hint">
          ${ed.provider === 'claude' ? `
          <code class="cmd">*</code> or empty matches everything. Only <code class="cmd">[A-Za-z0-9_-,| ]</code> means an exact string or a
          <code class="cmd">|</code>/<code class="cmd">,</code>-separated exact list. <strong class="semibold">Any other character makes it an
          unanchored JavaScript regex</strong> — <code class="cmd">Edit.*</code> also matches <code class="cmd">NotebookEdit</code>.` : `
          <code class="cmd">*</code> or empty matches everything. Everything else is <strong class="semibold">always a regular expression</strong> —
          Codex has no exact-string path, so <code class="cmd">Bash</code> here behaves differently from <code class="cmd">Bash</code> on Claude.
          Three events (<code class="cmd">UserPromptSubmit</code>, <code class="cmd">Stop</code>, <code class="cmd">Interrupt</code>) ignore this field entirely.`}
        </div>
        <div class="notice ${mi.kind === 'regex' || mi.kind === 'ignored' ? 'warn' : 'ok'} t-caption" style="padding:7px 10px">
          ${ic(mi.kind === 'regex' || mi.kind === 'ignored' ? 'alert' : 'check', 13, 'ico')}
          <div><strong class="semibold">${mi.kind === 'regex' ? 'Regex' : mi.kind === 'ignored' ? 'Not used on this event' : mi.kind === 'all' ? 'Matches all' : 'Exact'}</strong> — ${esc(mi.text)}</div>
        </div>
        ${perField('matcher').filter((p) => p.level === 'error').map((p) => `<div class="err">${ic('alert', 12)}<span>${esc(p.text)}</span></div>`).join('')}
      </div>

      <!-- if: Claude-only pre-filter. Cheaper than a broad matcher, and a
           silent no-op on any non-tool event, so it is gated hard. -->
      ${ed.provider === 'claude' ? `
      <div class="field">
        <label for="edIf">Condition <span class="t-micro faint">(optional · <code class="cmd">if</code>)</span></label>
        <input class="input mono" id="edIf" data-f="if" value="${esc(ed.if)}" placeholder="Bash(git push *)"
          ${CLAUDE_IF_EVENTS.includes(ed.event) || !ed.event ? '' : 'disabled'}
          aria-invalid="${perField('if').some((p) => p.level === 'error')}" />
        <div class="hint">
          ${CLAUDE_IF_EVENTS.includes(ed.event) || !ed.event
            ? `Permission-rule syntax — one rule, no <code class="cmd">&amp;&amp;</code> or lists. The process only spawns when the tool call matches,
               so <code class="cmd">matcher: "Bash"</code> plus <code class="cmd">if: "Bash(git *)"</code> costs nothing on an <code class="cmd">npm test</code>.
               Leading <code class="cmd">VAR=value</code> assignments are stripped, and subcommands inside <code class="cmd">&amp;&amp;</code>,
               <code class="cmd">$()</code> and backticks are each checked.`
            : `Disabled: <code class="cmd">if</code> is only evaluated on the five tool events. On <code class="cmd">${esc(ed.event)}</code> a handler
               with <code class="cmd">if</code> set never runs at all — so the field is off rather than available and quietly fatal.`}
        </div>
        ${perField('if').map((p) => `<div class="${p.level === 'error' ? 'err' : 'warn'}">${ic('alert', 12)}<span>${esc(p.text)}</span></div>`).join('')}
      </div>` : ''}

      <!-- Handler type: gated per provider. -->
      <div class="field">
        <label for="edType">Handler type</label>
        <div class="select-wrap">
          <select class="select" id="edType" data-f="type">
            ${types.map((t) => `<option value="${t.v}" ${t.v === ed.type ? 'selected' : ''} ${t.effective ? '' : 'disabled'}>
              ${esc(t.label)}${t.effective ? '' : ' — never runs on Codex'}</option>`).join('')}
          </select>
          ${ic('chevronDown', 14)}
        </div>
        <div class="hint">${esc((types.find((t) => t.v === ed.type) || {}).note || '')}</div>
        ${ed.provider === 'codex' ? `<div class="hint">Codex implements <code class="cmd">command</code> and <code class="cmd">mcp_tool</code>.
          <code class="cmd">prompt</code> and <code class="cmd">agent</code> are disabled above because they are real handler types that the dispatcher never runs;
          <code class="cmd">http</code> is disabled because Codex has no such handler type at all. Whether Codex prints anything when it skips a parsed
          handler is undocumented, so assume nothing reaches you and treat the editor as the only warning.</div>` : ''}
        ${perField('type').map((p) => `<div class="err">${ic('circleAlert', 12)}<span>${esc(p.text)}</span></div>`).join('')}
      </div>

      ${ed.type === 'command' ? `
      <div class="field">
        <label for="edCommand">Command</label>
        <input class="input mono" id="edCommand" data-f="command" value="${esc(ed.command)}" placeholder="~/.claude/hooks/guard.py"
          aria-invalid="${perField('command').some((p) => p.level === 'error')}" />
        <div class="hint">Runs through <code class="cmd">${esc(ed.shell)}</code> unless <code class="cmd">args</code> is set, which switches to exec form with no shell.</div>
        ${perField('command').map((p) => `<div class="${p.level === 'error' ? 'err' : 'warn'}">${ic(p.level === 'error' ? 'circleAlert' : 'alert', 12)}<span>${esc(p.text)}</span></div>`).join('')}
      </div>
      <div class="row-3">
        <div class="field">
          <label for="edArgs">Args <span class="faint">optional</span></label>
          <input class="input mono" id="edArgs" data-f="args" value="${esc(ed.args)}" placeholder="--strict --json" />
        </div>
        <div class="field">
          <label for="edTimeout">Timeout <span class="faint">seconds</span></label>
          <input class="input" id="edTimeout" data-f="timeout" value="${esc(ed.timeout)}" placeholder="600" inputmode="numeric" />
        </div>
        <div class="field">
          <label for="edShell">Shell</label>
          <div class="select-wrap">
            <select class="select" id="edShell" data-f="shell" ${ed.provider === 'codex' ? 'disabled' : ''}>
              <option ${ed.shell === 'bash' ? 'selected' : ''}>bash</option>
              <option ${ed.shell === 'powershell' ? 'selected' : ''}>powershell</option>
            </select>
            ${ic('chevronDown', 14)}
          </div>
          ${ed.provider === 'codex' ? '<div class="hint">Codex has no shell field — use commandWindows below.</div>' : ''}
        </div>
      </div>` : ''}

      ${ed.type === 'http' ? `
      <div class="field">
        <label for="edUrl">URL</label>

      ${ed.type === 'mcp_tool' ? `
      <div class="field">

      ${ed.provider === 'claude' || ed.type === 'command' || ed.type === 'mcp_tool' ? `
      <div class="field">
        <label for="edSm">statusMessage</label>
        <input class="input" id="edSm" data-f="statusMessage" value="${esc(ed.statusMessage)}" placeholder="Checking shell policy…" />
        <div class="hint">Spinner text shown while the hook runs. <strong class="semibold">Both providers take it</strong> — Claude as a common field on every handler type, Codex on <code class="cmd">command</code> and <code class="cmd">mcp_tool</code> handlers.</div>

      ${ed.provider === 'codex' && ed.type === 'command' ? `
      <div class="card" style="background:color-mix(in oklab, var(--info) 6%, transparent);border-color:color-mix(in oklab, var(--info) 26%, transparent)">
        <div class="card-body tight">
          <div class="inline" style="margin-bottom:10px">
            <span class="badge b-codex">${ic('cpu', 11)}Codex-only fields</span>
