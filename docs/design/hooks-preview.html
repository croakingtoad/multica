<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Multica — Lifecycle Hooks (design preview)</title>
<!--
  Multica · Runtime Lifecycle Hooks — static design preview (LOCO-82)
  ------------------------------------------------------------------
  A clickable sketch, NOT production code. No build step, no network, no CDN.
  Sample data only; nothing here talks to a runtime.

  Design provenance:
  - Tokens copied from packages/ui/styles/tokens.css (.dark block, OKLCH/zinc).
  - Type scale limited to the ten sanctioned steps (micro…display).
  - Shell mirrors runtime-detail.tsx: BreadcrumbHeader -> single scroll
    container -> grid-cols-[minmax(0,1fr)_320px].
  - Card = rounded-lg border bg-card. Editor = Dialog. Delete = AlertDialog.
  - Runtime picker grouped by machine = runtime-local-skill-import-panel.tsx.
  - Icons are hand-inlined lucide geometry (ISC) so the file stays offline.

  Feature is labelled "Lifecycle Hooks" throughout to avoid colliding with
  Multica's existing, unrelated "plugin hooks" (PluginHookTool).
-->
<style>
/* ------------------------------------------------------------------ *
 * 1. Tokens — lifted from packages/ui/styles/tokens.css
 * ------------------------------------------------------------------ */
:root {
  color-scheme: light;
  --app-shell: oklch(0.964435 0.001327 286.375);
  --page-canvas: oklch(0.988087 0 0);
  --surface: oklch(1 0 0);
  --surface-raised: oklch(1 0 0);
  --surface-hover: oklch(0.967 0.001 286.375);
  --surface-selected: oklch(0.94 0.002 286.375);
  --background: var(--page-canvas);
  --foreground: oklch(0.141 0.005 285.823);
  --card: var(--surface);
  --popover: var(--surface-raised);
  --primary: oklch(0.21 0.006 285.885);
  --primary-foreground: oklch(0.985 0 0);
  --secondary: oklch(0.967 0.001 286.375);
  --secondary-foreground: oklch(0.21 0.006 285.885);
  --muted: oklch(0.967 0.001 286.375);
  --muted-foreground: oklch(0.552 0.016 285.938);
  --faint-foreground: oklch(0.705 0.015 286.067);
  --accent: oklch(0.967 0.001 286.375);
  --accent-foreground: oklch(0.21 0.006 285.885);
  --destructive: oklch(0.577 0.245 27.325);
  --border: oklch(0 0 0 / 8%);
  --input: oklch(0 0 0 / 14%);
  --ring: oklch(0.705 0.015 286.067);
  --brand: oklch(0.55 0.18 255);
  --brand-foreground: oklch(0.985 0 0);
  --success: oklch(0.55 0.15 145);
  --warning: oklch(0.62 0.16 70);
  --info: oklch(0.55 0.18 250);
  --menu-shadow: 0 10px 28px rgb(0 0 0 / 0.10), 0 2px 8px rgb(0 0 0 / 0.06);
  --floating-shadow: 0 20px 48px rgb(0 0 0 / 0.18), 0 4px 12px rgb(0 0 0 / 0.10);
  --radius: 0.625rem;
}
html.dark {
  color-scheme: dark;
  --app-shell: oklch(0.155 0.005 285.823);
  --page-canvas: oklch(0.18 0.005 285.823);
  --surface: oklch(0.21 0.006 285.885);
  --surface-raised: oklch(0.235 0.007 285.885);
  --surface-hover: oklch(0.274 0.006 286.033);
  --surface-selected: oklch(0.3 0.006 286.033);
  --background: var(--page-canvas);
  --foreground: oklch(0.985 0 0);
  --card: var(--surface);
  --popover: var(--surface-raised);
  --primary: oklch(0.92 0.004 286.32);
  --primary-foreground: oklch(0.21 0.006 285.885);
  --secondary: oklch(0.274 0.006 286.033);
  --secondary-foreground: oklch(0.985 0 0);
  --muted: oklch(0.274 0.006 286.033);
  --muted-foreground: oklch(0.705 0.015 286.067);
  --faint-foreground: oklch(0.60 0.015 286.067);
  --accent: oklch(0.274 0.006 286.033);
  --accent-foreground: oklch(0.985 0 0);
  --destructive: oklch(0.704 0.191 22.216);
  --border: oklch(1 0 0 / 6%);
  --input: oklch(1 0 0 / 15%);
  --ring: oklch(0.552 0.016 285.938);
  --brand: oklch(0.65 0.16 255);
  --brand-foreground: oklch(0.985 0 0);
  --success: oklch(0.65 0.15 145);
  --warning: oklch(0.70 0.16 85);
  --info: oklch(0.65 0.18 250);
  --menu-shadow: 0 10px 28px rgb(0 0 0 / 0.3), 0 2px 8px rgb(0 0 0 / 0.18);
  --floating-shadow: 0 20px 48px rgb(0 0 0 / 0.46), 0 4px 12px rgb(0 0 0 / 0.28);
}

/* ------------------------------------------------------------------ *
 * 2. Base + the ten sanctioned type steps
 * ------------------------------------------------------------------ */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--background);
  color: var(--foreground);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 14px; line-height: 20px;
  -webkit-font-smoothing: antialiased;
}
.mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
.t-micro    { font-size: 11px; line-height: 15px; }
.t-caption  { font-size: 12px; line-height: 16px; }
.t-label    { font-size: 13px; line-height: 18px; }
.t-body     { font-size: 14px; line-height: 20px; }
.t-body-lg  { font-size: 15px; line-height: 22px; }
.t-title-sm { font-size: 16px; line-height: 24px; }
.t-title    { font-size: 18px; line-height: 28px; }
.t-title-lg { font-size: 20px; line-height: 28px; }
.t-display-sm { font-size: 24px; line-height: 32px; }
.muted { color: var(--muted-foreground); }
.faint { color: var(--faint-foreground); }
.medium { font-weight: 500; }
.semibold { font-weight: 600; }
.strike { text-decoration: line-through; }
svg { flex: none; }

/* ------------------------------------------------------------------ *
 * 3. Layout shell
 * ------------------------------------------------------------------ */
#app { display: flex; flex-direction: column; height: 100%; }

.preview-strip {
  display: flex; align-items: center; gap: 12px;
  padding: 6px 16px;
  background: color-mix(in oklab, var(--warning) 18%, var(--app-shell));
  border-bottom: 1px solid color-mix(in oklab, var(--warning) 40%, transparent);
  color: var(--foreground);
}
.preview-strip .dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--warning);
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--warning) 25%, transparent);
}
.preview-strip .spacer { flex: 1; }

.page-header {
  display: flex; align-items: center; gap: 6px;
  height: 44px; padding: 0 16px;
  background: var(--background);
  border-bottom: 1px solid var(--border);
  flex: none;
}
.crumb { color: var(--muted-foreground); text-decoration: none; }
.crumb:hover { color: var(--foreground); }

.tabbar {
  display: flex; gap: 2px; padding: 0 16px;
  border-bottom: 1px solid var(--border); background: var(--background); flex: none;
  overflow-x: auto;
}
.tab {
  appearance: none; background: none; border: 0; border-bottom: 2px solid transparent;
  color: var(--muted-foreground); padding: 9px 10px; font: inherit; font-size: 13px;
  cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;
}
.tab:hover { color: var(--foreground); }
.tab[aria-selected="true"] { color: var(--foreground); border-bottom-color: var(--primary); font-weight: 500; }
.tab:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; border-radius: 4px; }

.scroll { flex: 1; min-height: 0; overflow-y: auto; }
.rail { margin: 0 auto; width: 100%; max-width: 1440px; }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; padding: 24px 16px; }
@media (max-width: 1100px) { .two-col { grid-template-columns: 1fr; } }
.col-main { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.col-rail { display: flex; flex-direction: column; gap: 16px; }

/* ------------------------------------------------------------------ *
 * 4. Primitives — Card / Badge / Button / Input / Select / Switch
 * ------------------------------------------------------------------ */
.card { border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); }
.card-head {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px; border-bottom: 1px solid var(--border);
}
.card-head .spacer { flex: 1; }
.card-body { padding: 16px; }
.card-body.tight { padding: 12px 16px; }

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  border-radius: 6px; border: 1px solid var(--border);
  padding: 1px 6px; font-size: 11px; line-height: 15px; font-weight: 500;
  background: color-mix(in oklab, var(--muted) 60%, transparent);
  color: var(--muted-foreground); white-space: nowrap;
}
.badge.solid { border-color: transparent; }
.badge.b-claude { background: color-mix(in oklab, var(--warning) 20%, transparent); color: var(--warning); border-color: color-mix(in oklab, var(--warning) 35%, transparent); }
.badge.b-codex  { background: color-mix(in oklab, var(--info) 20%, transparent);    color: var(--info);    border-color: color-mix(in oklab, var(--info) 35%, transparent); }
.badge.b-ok     { background: color-mix(in oklab, var(--success) 18%, transparent); color: var(--success); border-color: color-mix(in oklab, var(--success) 32%, transparent); }
.badge.b-warn   { background: color-mix(in oklab, var(--warning) 18%, transparent); color: var(--warning); border-color: color-mix(in oklab, var(--warning) 32%, transparent); }
.badge.b-bad    { background: color-mix(in oklab, var(--destructive) 16%, transparent); color: var(--destructive); border-color: color-mix(in oklab, var(--destructive) 32%, transparent); }
.badge.b-brand  { background: color-mix(in oklab, var(--brand) 20%, transparent); color: var(--brand); border-color: color-mix(in oklab, var(--brand) 35%, transparent); }
.badge.b-dim    { opacity: .72; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 12px; border-radius: calc(var(--radius) * 0.8);
  border: 1px solid var(--border); background: transparent; color: var(--foreground);
  font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
  white-space: nowrap; text-decoration: none;
}
.btn:hover { background: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.btn[disabled]:hover { background: transparent; }
.btn.primary { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
.btn.primary:hover { background: color-mix(in oklab, var(--primary) 88%, var(--foreground)); }
.btn.danger { background: var(--destructive); color: oklch(0.985 0 0); border-color: transparent; }
.btn.ghost { border-color: transparent; }
.btn.sm { height: 26px; padding: 0 8px; font-size: 12px; }
.btn.xs { height: 22px; padding: 0 6px; font-size: 11px; border-radius: 6px; }
.btn.icon { width: 28px; height: 28px; padding: 0; }

.field { display: flex; flex-direction: column; gap: 5px; }
.field > label { font-size: 13px; line-height: 18px; font-weight: 500; }
.field .hint { font-size: 12px; line-height: 16px; color: var(--muted-foreground); }
.field .err  { font-size: 12px; line-height: 16px; color: var(--destructive); display: flex; gap: 5px; align-items: flex-start; }
.field .warn { font-size: 12px; line-height: 16px; color: var(--warning); display: flex; gap: 5px; align-items: flex-start; }
.input, .select, .textarea {
  width: 100%; height: 32px; padding: 0 10px;
  border-radius: calc(var(--radius) * 0.8); border: 1px solid var(--input);
  background: color-mix(in oklab, var(--surface) 70%, transparent);
  color: var(--foreground); font: inherit; font-size: 13px;
}
.textarea { height: auto; padding: 7px 10px; min-height: 60px; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { outline: 2px solid var(--ring); outline-offset: -1px; border-color: var(--ring); }
.input[aria-invalid="true"] { border-color: var(--destructive); }
.input[disabled], .select[disabled], .textarea[disabled] { opacity: .55; cursor: not-allowed; }
.select { appearance: none; padding-right: 28px; background-image: none; }
.select-wrap { position: relative; }
.select-wrap > svg { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--faint-foreground); }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

.switch {
  appearance: none; width: 32px; height: 18px; border-radius: 999px;
  background: var(--input); border: 1px solid var(--border); position: relative;
  cursor: pointer; flex: none; transition: background .12s;
}
.switch::after {
  content: ""; position: absolute; top: 1px; left: 1px; width: 14px; height: 14px;
  border-radius: 50%; background: var(--foreground); transition: transform .12s;
}
.switch:checked { background: var(--brand); }
.switch:checked::after { transform: translateX(14px); background: oklch(0.99 0 0); }
.switch:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.switch[disabled] { opacity: .45; cursor: not-allowed; }

.kbd {
  display: inline-flex; align-items: center; height: 17px; padding: 0 4px;
  border-radius: 4px; border: 1px solid var(--border); background: var(--muted);
  font-size: 10px; font-family: inherit; color: var(--muted-foreground);
}

/* ------------------------------------------------------------------ *
 * 5. Tables / rows
 * ------------------------------------------------------------------ */
table.tbl { width: 100%; border-collapse: collapse; }
table.tbl th {
  text-align: left; font-size: 11px; line-height: 15px; font-weight: 500;
  color: var(--faint-foreground); text-transform: uppercase; letter-spacing: .04em;
  padding: 7px 12px; border-bottom: 1px solid var(--border); white-space: nowrap;
}
table.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.tbl tr:last-child td { border-bottom: 0; }
table.tbl tbody tr:hover { background: color-mix(in oklab, var(--accent) 45%, transparent); }
/* `inert` = configured and loaded, but not producing a process right now.
   Deliberately NOT struck through: a struck-out row reads as "never
   loaded", which was the false claim this file used to make. */
table.tbl tr.inert td { background: color-mix(in oklab, var(--muted) 45%, transparent); }
table.tbl tr.inert .cmd, table.tbl tr.inert .matcher { opacity: .62; }
.cmd { font-family: "Geist Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; overflow-wrap: anywhere; }
.nowrap { white-space: nowrap; }
.cellflex { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.event-group { border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); overflow: hidden; }
.event-group + .event-group { margin-top: 10px; }
.event-head {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 9px 12px; background: color-mix(in oklab, var(--muted) 35%, transparent);
  border: 0; border-bottom: 1px solid var(--border); color: inherit; font: inherit;
  cursor: pointer; text-align: left;
}
.event-head:hover { background: color-mix(in oklab, var(--muted) 60%, transparent); }
.event-head:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; }
.event-head .spacer { flex: 1; }
.event-head .chev { transition: transform .12s; color: var(--faint-foreground); }
.event-head[aria-expanded="false"] .chev { transform: rotate(-90deg); }

/* ------------------------------------------------------------------ *
 * 6. Notices / strips
 * ------------------------------------------------------------------ */
.behavior-strip {
  display: flex; align-items: flex-start; gap: 10px;
  border-radius: var(--radius); padding: 10px 14px;
  border: 1px solid var(--border); background: color-mix(in oklab, var(--muted) 40%, transparent);
}
.behavior-strip.claude { border-color: color-mix(in oklab, var(--warning) 30%, transparent); background: color-mix(in oklab, var(--warning) 9%, transparent); }
.behavior-strip.codex  { border-color: color-mix(in oklab, var(--info) 30%, transparent);    background: color-mix(in oklab, var(--info) 9%, transparent); }
.behavior-strip .ico { margin-top: 1px; }
.behavior-strip .spacer { flex: 1; }

.notice { display: flex; gap: 9px; border-radius: calc(var(--radius) * 0.8); padding: 9px 12px; border: 1px solid var(--border); }
.notice .ico { margin-top: 1px; }
.notice.warn { border-color: color-mix(in oklab, var(--warning) 35%, transparent); background: color-mix(in oklab, var(--warning) 10%, transparent); }
.notice.bad  { border-color: color-mix(in oklab, var(--destructive) 35%, transparent); background: color-mix(in oklab, var(--destructive) 9%, transparent); }
.notice.info { border-color: color-mix(in oklab, var(--info) 30%, transparent); background: color-mix(in oklab, var(--info) 9%, transparent); }
.notice.ok   { border-color: color-mix(in oklab, var(--success) 30%, transparent); background: color-mix(in oklab, var(--success) 9%, transparent); }

/* Empty (shadcn Empty) */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 56px 24px; }
.empty .media {
  width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
  background: var(--muted); color: var(--muted-foreground);
}
.empty .actions { display: flex; gap: 8px; margin-top: 4px; }

/* Skeleton */
@keyframes sk { 0%,100% { opacity: .45 } 50% { opacity: .85 } }
.sk { background: var(--muted); border-radius: 6px; animation: sk 1.5s ease-in-out infinite; }

/* ------------------------------------------------------------------ *
 * 7. Dialog / AlertDialog
 * ------------------------------------------------------------------ */
.overlay {
  position: fixed; inset: 0; background: rgb(0 0 0 / .6); z-index: 60;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 48px 16px; overflow-y: auto;
}
.overlay[hidden] { display: none; }
.dialog {
  width: 100%; max-width: 620px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--popover);
  box-shadow: var(--floating-shadow); display: flex; flex-direction: column;
}
.dialog.wide { max-width: 780px; }
.dialog.narrow { max-width: 440px; }
.dialog-head { padding: 16px 20px 12px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-start; }
.dialog-head .spacer { flex: 1; }
.dialog-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }
.dialog-foot { padding: 12px 20px 16px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.dialog-foot .spacer { flex: 1; }

/* searchable event combobox */
.combo { position: relative; }
.combo-list {
  position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px);
  max-height: 236px; overflow-y: auto; border-radius: calc(var(--radius) * 0.8);
  border: 1px solid var(--border); background: var(--popover); box-shadow: var(--menu-shadow);
  padding: 4px;
}
.combo-list[hidden] { display: none; }
.combo-group { font-size: 11px; color: var(--faint-foreground); padding: 6px 8px 2px; text-transform: uppercase; letter-spacing: .04em; }
.combo-opt {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 5px 8px; border: 0; background: none; color: inherit; font: inherit; font-size: 13px;
  border-radius: 6px; cursor: pointer; text-align: left;
}
.combo-opt:hover, .combo-opt.active { background: var(--accent); }
.combo-opt .spacer { flex: 1; }
.combo-empty { padding: 10px 8px; font-size: 12px; color: var(--muted-foreground); }

/* diff */
.diff { border-radius: calc(var(--radius) * 0.8); border: 1px solid var(--border); overflow: hidden; background: var(--app-shell); }
.diff-head { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--border); background: color-mix(in oklab, var(--muted) 40%, transparent); }
.diff pre { margin: 0; padding: 10px 0; overflow-x: auto; font-family: "Geist Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; line-height: 18px; }
.diff .ln { display: block; padding: 0 12px; white-space: pre; }
.diff .ln.add { background: color-mix(in oklab, var(--success) 14%, transparent); color: color-mix(in oklab, var(--success) 75%, var(--foreground)); }
.diff .ln.del { background: color-mix(in oklab, var(--destructive) 12%, transparent); color: color-mix(in oklab, var(--destructive) 75%, var(--foreground)); }
.diff .ln.ctx { color: var(--muted-foreground); }

/* toast (sonner) */
#toasts { position: fixed; right: 16px; bottom: 16px; z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.toast {
  display: flex; gap: 8px; align-items: flex-start; min-width: 260px; max-width: 380px;
  border-radius: calc(var(--radius) * 0.8); border: 1px solid var(--border);
  background: var(--popover); box-shadow: var(--menu-shadow); padding: 10px 12px;
}
.toast .ico { margin-top: 1px; }

/* gallery */
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(276px, 1fr)); gap: 12px; }
.g-card { border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); padding: 14px; display: flex; flex-direction: column; gap: 9px; }
.g-card:hover { border-color: color-mix(in oklab, var(--brand) 40%, var(--border)); }
.g-card .g-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.g-card .g-foot { display: flex; gap: 6px; margin-top: auto; padding-top: 4px; }
.compat { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

/* precedence layer stack */
.layers { display: flex; flex-direction: column; gap: 8px; }
.layer { border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
.layer-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: color-mix(in oklab, var(--muted) 35%, transparent); }
.layer-head .spacer { flex: 1; }
.layer.writable .layer-head { background: color-mix(in oklab, var(--brand) 12%, transparent); }
.layer-body { padding: 0; }
.layer-entry { display: flex; align-items: flex-start; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--border); }
.layer-entry.inert { background: color-mix(in oklab, var(--muted) 45%, transparent); }
.layer-entry.inert .cmd, .layer-entry.inert .matcher { opacity: .62; }
.layer-entry .spacer { flex: 1; }
.runorder {
  width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; flex: none;
  background: color-mix(in oklab, var(--success) 20%, transparent); color: var(--success);
  font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
}

  if (h.type === 'agent')    return 'agent hook';
  return (h.command || '').split(/[\\/]/).pop() || h.type;
}

/* Both providers MERGE. Neither has per-entry precedence: every matching
   handler from every layer runs, so this function does not pick winners.
   What it computes instead is what merging actually costs you — how many
   handlers pile onto one event — plus the four real reasons an entry
   does not run. Docs, verbatim: "Hook entries merge across settings levels
   rather than replacing each other: user, project, and local settings add
   their own hooks without removing managed ones."
   — https://code.claude.com/docs/en/hooks

   The one genuine cross-layer interaction on Claude is DEDUPLICATION, not
   override: "If you define the same handler in more than one settings
   file, it runs once. A plugin's or skill's copy of the same handler stays
   separate." So a byte-identical handler in two settings files collapses
   to one spawn; a plugin's copy does not. Codex documents no equivalent.

   Neither provider documents a run SEQUENCE. Claude states matching hooks
   "run in parallel"; Codex says matching command hooks "are launched
   concurrently". Both describe concurrency, neither an order — so nothing
   here is numbered; an invented order would be the next thing to be wrong
   about. */
function resolve(runtime) {
  const hooks = hooksOf(runtime.id);
  const byEvent = {};
  hooks.forEach((h) => { (byEvent[h.event] = byEvent[h.event] || []).push(h); });

  /* Claude-only dedup pass. Two settings-file entries with the same
     handler shape collapse; a plugin or skill copy is kept separate. */
  const SETTINGS_LAYERS = ['managed', 'project', 'local', 'user'];
  const sig = (h) => [h.event, h.matcher || '*', h.type, h.command || h.url || h.mcpTool || h.prompt || '',
    (h.args || []).join('\u0000'), h.if || ''].join('\u0001');

  hooks.forEach((h) => { h._dupOf = null; h._dupWith = null; });
  if (runtime.provider === 'claude') {
    const seen = {};
    hooks.filter((h) => !h.parked && SETTINGS_LAYERS.includes(h.scope)).forEach((h) => {
      const k = sig(h);
      if (seen[k]) {
        h._dupOf = seen[k];
        seen[k]._dupWith = h;
      } else {
        seen[k] = h;
      }
    });
  }

  /* Kill switches. These are the only thing on either provider that
     resembles precedence, and they are global, not per-entry. */
  hooks.forEach((h) => {
    h._killed = null;
    const managed = h.scope === 'managed';
    if (state.killAll && !managed) h._killed = 'all';
    if (state.killAll && managed) h._killed = null;      // cannot be reached from outside managed settings
    if (state.killManagedOnly && !managed) {
      const exempt = runtime.provider === 'claude' && h.scope === 'plugin' && h.forceEnabled;
      if (!exempt) h._killed = 'managedOnly';
    }
  });

  /* Accumulation, the thing merging actually produces. */
  Object.keys(byEvent).forEach((ev) => {
    const group = byEvent[ev];
    const firing = group.filter((h) => runState(h, runtime).runs);
    group.forEach((h) => { h._fires = firing.length; h._configured = group.length; });
  });
  return byEvent;
}

/* One honest answer to "is this running right now?", with the reason.
   Ordered most-decisive first. Nothing here says "shadowed" — no entry
   on either provider is ever displaced by another layer. */
function runState(h, runtime) {
  const prov = runtime.provider;
  if (h._killed === 'all') return { runs: false, label: 'Off · kill switch', cls: 'b-warn', icon: 'ban',
    why: prov === 'claude'
      ? 'disableAllHooks is on. Every non-managed hook stops, whatever layer it lives in.'
      : '[features].hooks = false. Hooks are off session-wide.' };
  if (h._killed === 'managedOnly') return { runs: false, label: 'Off · managed only', cls: 'b-warn', icon: 'shield',
    why: prov === 'claude'
      ? 'allowManagedHooksOnly blocks user, project, local and plugin hooks. Only plugins force-enabled in managed enabledPlugins are exempt.'
      : 'allow_managed_hooks_only = true skips user, project, session and plugin hooks.' };
  if (h.disabledNative) return { runs: false, label: 'Disabled in /hooks', cls: '', icon: 'ban',
    why: 'Switched off per-hook in the Codex /hooks browser. This is a real Codex feature — the entry stays in the file and stops running.' };
  if (h.parked)      return { runs: false, label: 'Parked',       cls: '',       icon: 'archive',
    why: 'Configured but not registered. Multica moved the entry into a _disabledHooks sidecar, because Claude has no per-hook disable of its own.' };
  if (h.ineffective) return { runs: false, label: 'Never runs',   cls: 'b-bad',  icon: 'ban',
    why: h.type === 'http'
      ? 'Codex has no http handler type at all, so this entry can never execute.'
      : 'Codex parses type: ' + h.type + ' as a valid handler type and then never dispatches it. It has never executed.' };
  if (h.trust === 'stale') return { runs: false, label: 'Not trusted', cls: 'b-bad', icon: 'key',
    why: 'Edited since it was trusted. Codex skips it until the new hash is trusted on the host.' };
  if (h.trust === 'review') return { runs: false, label: 'Needs review', cls: 'b-bad', icon: 'key',
    why: 'Never trusted. Codex requires you to review the exact definition in /hooks before it can run — installing the plugin was not enough.' };
  if (h.ifOnNonToolEvent) return { runs: false, label: 'Never runs', cls: 'b-bad', icon: 'ban',
    why: 'An if condition is only evaluated on tool events. On ' + h.event + ', a handler with if set never runs at all.' };
  if (h._dupOf) return { runs: false, label: 'Runs once', cls: '', icon: 'copy',
    why: 'Byte-identical to the ' + layerMeta(prov, h._dupOf.scope).label + '-scope entry, so Claude collapses the pair and spawns it once. Both entries are loaded; only one process runs.' };
  if (h.broken === 'path') return { runs: true, label: 'Failing',  cls: 'b-bad',  icon: 'circleAlert',
    why: 'Registered and fires, but the command cannot be found. The shell exits 127 and only exit 2 blocks, so the action proceeds. Claude does not see the failure either \u2014 PreCompact shows an exit-2 stderr message to the user, discards systemMessage and takes no additionalContext, so nothing this hook returns has a path to the model. The transcript does get a hook-error notice with the first line of stderr, and the full text lands in the debug log; what nothing keeps is a record of it.' };
  if (h.async)       return { runs: true,  label: 'Active · async', cls: 'b-ok', icon: 'zap',
    why: 'Runs detached, so its exit status is not acted on and a failure drives nothing on its own — asyncRewake is the field that wakes Claude on exit code 2. Claude Code does emit a completion record when the process exits — hook_response, with exit_code and outcome — and that record only reaches a host through the Agent SDK stream (includeHookEvents, default off) or --output-format stream-json --verbose with --include-hook-events, which is how Multica launches claude, so the outcome does reach the fire log. The record has no duration field, so no timing for the run reaches the fire log. Completion notices are suppressed unless you run --verbose or press Ctrl+O, and its additionalContext and systemMessage still reach Claude on the next turn.' };
  return { runs: true, label: 'Active', cls: 'b-ok', icon: 'check', why: 'Registered and running.' };
}

/* Matcher semantics are the single most surprising part of the schema AND
   they differ per provider, so the hint is live and provider-aware rather
   than one tooltip that is half-wrong wherever you read it.
   Claude: exact-string unless the value contains a character outside
   [A-Za-z0-9_-,| ], in which case it is an unanchored JS regex.
   Codex: always a regex. There is no exact-match path at all, and on
   three events the matcher is parsed and then ignored. */
const CODEX_MATCHERLESS = ['UserPromptSubmit', 'Stop', 'Interrupt'];

function interpretMatcher(v, prov, event) {
  const s = (v || '').trim();
  if (prov === 'codex' && event && CODEX_MATCHERLESS.includes(event)) {
    return { kind: 'ignored', text: 'ignored. Codex does not honour a matcher on ' + event + ' — whatever you type here is parsed and discarded, and the hook fires on every occurrence.' };
  }
  if (s === '' || s === '*') return { kind: 'all', text: 'every occurrence fires this hook. Empty and * are the same thing.' };

  if (prov === 'codex') {
    const extra = [];
    if (!s.startsWith('^') || !s.endsWith('$')) {
      extra.push('Unanchored, so it matches anywhere in the name — ^' + s.replace(/[^A-Za-z0-9_]/g, '') + '$ pins it.');
    }
    if (/^[A-Za-z0-9_]+$/.test(s)) {
      extra.push('On Claude this same value would be an exact match; on Codex it is not.');
    }
    return { kind: 'regex', text: 'a regular expression. Codex has no exact-string path — every matcher is a regex, however plain it looks. ' + extra.join(' ') };
  }

  if (/^[A-Za-z0-9_\-,| ]+$/.test(s)) {
    const parts = s.split(/[|,]/).map((x) => x.trim()).filter(Boolean);
    return { kind: 'exact', text: (parts.length > 1
      ? 'matches only ' + parts.join(', ') + ' — nothing else.'
      : 'matches only ' + parts[0] + ' — nothing else.')
      + ' Only letters, digits, _, -, spaces, , and | keep it on the exact-string path.' };
  }
  const extra = [];
  if (/^[A-Za-z0-9_]+\.\*$/.test(s)) {
    const stem = s.slice(0, -2);
    extra.push('Unanchored, so it also matches Notebook' + stem + ' and Multi' + stem + '. Use ^' + stem + '$ for whole-string.');
  } else if (!s.startsWith('^')) {
    extra.push('Unanchored — it matches anywhere in the tool name. Add ^ and $ to pin it.');
  }
  return { kind: 'regex', text: 'treated as a JavaScript regex, because it contains a character outside [A-Za-z0-9_-,| ]. ' + extra.join(' ') };
}

function validateCommand(cmd) {
  const s = (cmd || '').trim();
  if (!s) return { level: 'error', text: 'A command handler needs a command.' };
  if (s.includes('\\')) return { level: 'error',
    text: 'Backslashes are Windows separators. Claude runs this through bash, which reads \\U as an escape — the path collapses to C:UsersMarty and fails with status 127 on every fire. On most events only exit 2 blocks, so the action proceeds and the transcript gets one hook-error notice per fire — what is left silently disabled is the gate this hook was meant to be. The worktree events differ: any non-zero exit aborts WorktreeCreate, and fails WorktreeRemove if the directory still exists afterward, so on those two a broken path stops the operation instead of quietly letting it through.' };
  if (/\s/.test(s.split(' ')[0]) === false && / /.test(s) && !/["']/.test(s)) {
    const first = s.split(' ')[0];
    if (!/^(sh|bash|node|python3?|npx|pnpm|uv|deno)$/.test(first)) {
      return { level: 'warn', text: 'This path contains a space and is unquoted. Wrap it in double quotes or the shell will split it.' };
    }
  }
  return null;
}

/* The provider-behaviour strip. One line, provider-specific, stating the
   thing that actually changes what happens at runtime — not a generic
   "providers differ" banner. It is persistent because the rule it states
   is the rule the rest of the screen is rendered under. */
function behaviorStrip(prov) {
  if (prov === 'claude') {
    return `
    <div class="behavior-strip claude">
      ${ic('layers', 15, 'ico')}
      <div>
        <div class="t-label"><strong class="semibold">Hooks accumulate.</strong>
        Every layer's entries merge and all of them run — nothing is ever displaced. Adding a hook
        only ever adds work. 33 events, but handler support varies: all five types on 13 of them, <code class="cmd">command</code>/<code class="cmd">http</code>/<code class="cmd">mcp_tool</code> on 18, and <code class="cmd">command</code>/<code class="cmd">mcp_tool</code> only on SessionStart and Setup.</div>
        <div class="t-caption muted" style="margin-top:2px">Claude has <strong class="semibold">no per-hook disable</strong>, so the pile only grows. A byte-identical handler in two settings files is the single exception — it collapses and runs once.</div>
      </div>
      <span class="spacer"></span>
      <button class="btn sm" data-screen="precedence">See everything that runs</button>
    </div>`;
  }
  return `
  <div class="behavior-strip codex">
    ${ic('gitBranch', 15, 'ico')}
    <div>
      <div class="t-label"><strong class="semibold">Hooks accumulate — but each one has to earn its place.</strong>
      Layers merge exactly as they do on Claude. What differs is the gate: a hook runs only while
      its hash is trusted, and 12 events, and only <code class="cmd">command</code> and
      <code class="cmd">mcp_tool</code> do anything.</div>
      <div class="t-caption muted" style="margin-top:2px">Codex <strong class="semibold">does</strong> have a per-hook disable in <code class="cmd">/hooks</code>. Every matcher here is a regex, and three events ignore it entirely.</div>
    </div>
    <span class="spacer"></span>
    <button class="btn sm" data-screen="precedence">See everything that runs</button>
  </div>`;
}

/* ==================================================================== *
 * SCREEN 1 — HOOKS LIST
 * ==================================================================== */
function screenHooks() {
  const r = rt();
  if (r.status === 'offline') return offlineBody(r);
  const byEvent = resolve(r);
  const hooks = hooksOf(r.id);
  if (!hooks.length) return emptyBody(r);

  const q = state.query.trim().toLowerCase();
  const events = Object.keys(byEvent).sort((a, b) => {
    const order = r.provider === 'claude' ? CLAUDE_EVENTS : CODEX_EVENTS;
    return order.indexOf(a) - order.indexOf(b);
  });

  const groupsHtml = events.map((ev) => {
    const group = byEvent[ev].filter((h) => !q ||
      ev.toLowerCase().includes(q) ||
      (h.matcher || '').toLowerCase().includes(q) ||
      (h.command || h.url || h.mcpTool || '').toLowerCase().includes(q));
    if (!group.length) return '';
    if (r.provider === 'codex') {
      const lo = layersOf('codex').map((l) => l.id);
      group.sort((a, b) => lo.indexOf(a.scope) - lo.indexOf(b.scope));
    }
    const open = !state.collapsed[ev];
    const running = group.filter((h) => runState(h, r).runs).length;
    const trouble = group.filter((h) => { const st = runState(h, r); return !st.runs && (h.ineffective || h.ifOnNonToolEvent || h.trust === 'stale' || h.trust === 'review'); }).length;

    return `
    <div class="event-group">
      <button class="event-head" aria-expanded="${open}" data-toggle-event="${esc(ev)}">
        ${ic('chevronDown', 14, 'chev')}
        <span class="mono t-label medium">${esc(ev)}</span>
        ${CODEX_ONLY.includes(ev) ? '<span class="badge b-codex">Codex-only event</span>' : ''}
        <span class="badge">${group.length} ${group.length === 1 ? 'hook' : 'hooks'}</span>
        <span class="badge ${running ? 'b-ok' : 'b-dim'}">${running} running</span>
        ${trouble ? `<span class="badge b-bad">${ic('alert', 11)}${trouble} not running</span>` : ''}
        ${running > 1 ? `<span class="badge ${running > 2 ? 'b-warn' : ''}">${ic('zap', 11)}all ${running} fire</span>` : ''}
        ${group.filter((h) => h._dupOf).length ? `<span class="badge">${ic('copy', 11)}${group.filter((h) => h._dupOf).length} collapsed</span>` : ''}
        <span class="spacer"></span>
        <span class="t-caption faint">merged across ${new Set(group.map((h) => h.scope)).size} file${new Set(group.map((h) => h.scope)).size === 1 ? '' : 's'}${running > 1 ? ' · ' + running + ' processes per fire' : ''}</span>
      </button>
      ${open ? hookTable(group, r) : ''}
    </div>`;
  }).join('');

  return `
  <div class="two-col">
    <div class="col-main">
      ${runtimePicker()}
      ${behaviorStrip(r.provider)}
      ${r.provider === 'codex' && hooks.some((h) => h.trust === 'stale' || h.trust === 'review') ? trustBanner(hooks.filter((h) => h.trust === 'stale' || h.trust === 'review')) : ''}
      ${hooks.some((h) => h.broken === 'path') ? `
        <div class="notice bad t-label">
          ${ic('circleAlert', 15, 'ico')}
          <div>
            <strong class="semibold">1 hook is registered but cannot run.</strong>
            <code class="cmd">snapshot.sh</code> has failed on every <code class="cmd">PreCompact</code> fire since 2026-09-04 with status 127.
            Status 127 is not exit 2, so it does not block — the compact proceeds. Claude does not see it either: <code class="cmd">PreCompact</code> shows an exit-2 stderr
            message to the user, discards <code class="cmd">systemMessage</code> and takes no <code class="cmd">additionalContext</code>, so nothing this hook returns has a path to
            the model. Each fire prints one <code class="cmd">hook error</code> notice in the transcript, with the full stderr in the debug log if you turn it on — but no
            duration, no history, nothing to filter on.
            <div style="margin-top:6px"><button class="btn sm" data-screen="log">${ic('activity', 13)}Open fire log</button>
            <button class="btn sm" data-edit="c14">${ic('pencil', 13)}Fix the path</button></div>
          </div>
        </div>` : ''}

      <div class="inline">
        <div class="field" style="flex:1;min-width:200px;max-width:320px">
          <label class="sr" for="hookSearch">Filter hooks</label>
          <div class="select-wrap">
            <input class="input" id="hookSearch" placeholder="Filter by event, matcher or command" value="${esc(state.query)}" style="padding-left:30px" />
            <svg style="position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--faint-foreground)" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">${P.search}</svg>
          </div>
        </div>
        <span style="flex:1"></span>
        <button class="btn sm" data-screen="gallery">${ic('pkg', 13)}Starter hooks</button>
        <button class="btn sm primary" data-add="1">${ic('plus', 13)}Add hook</button>
      </div>

      <div>${groupsHtml || `<div class="card"><div class="empty"><div class="media">${ic('search', 20)}</div><div class="t-title-sm medium">No hook matches “${esc(state.query)}”</div><div class="t-caption muted">Try an event name, a matcher, or part of a command.</div></div></div>`}</div>
    </div>
    <div class="col-rail">${railCards(r, hooks)}</div>
  </div>`;
}

function hookTable(group, r) {
  return `
  <table class="tbl">
    <thead><tr>
      <th style="width:1%"></th>
      <th style="width:16%">Matcher</th>
      <th style="width:11%">Handler</th>

      <th style="width:19%">Source</th>

    </tr></thead>
    <tbody>

}

function hookRow(h, r) {
  const st = runState(h, r);
  const lm = layerMeta(r.provider, h.scope);
  const types = HANDLER_TYPES[r.provider].find((t) => t.v === h.type);
  const target = h.command || h.url || h.mcpTool || h.prompt || '—';
  const mi = interpretMatcher(h.matcher, r.provider, h.event);
  const cmdIssue = h.type === 'command' ? validateCommand(h.command) : null;

  return `
  <tr class="${st.runs ? '' : 'inert'}">
